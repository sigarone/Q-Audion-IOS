name: QAudionApp
options:
  bundleIdPrefix: com.qaudion
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.6"
  # Prevents "member of multiple groups" xcodebuild warnings.
  # Without this, subdirectories (DesignSystem, Services, Views) appear
  # both in the target group and the root project group ("") when
  # sources uses path: . — XcodeGen flattens intermediate folders into
  # the root, producing duplicate file references.
  createIntermediateGroups: true

packages:
  QAudionEngine:
    path: ../QAudionEngine

targets:
  QAudionApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.html"
          - "*.yml"
          - project.yml
          # Entitlements of the build with VPN support (project-vpn.yml points
          # CODE_SIGN_ENTITLEMENTS at it); not a source of the default build.
          - QAudionVPN.entitlements
          # Bundled CallKit ringtone — added as an explicit resource below so
          # XcodeGen places it in Copy-Bundle-Resources unambiguously (same
          # rationale as PrivacyInfo.xcprivacy). Excluded from the recursive
          # `sources:` enumeration to avoid a double "Multiple commands produce".
          - "*.caf"
          # PrivacyInfo.xcprivacy is deliberately NOT excluded (and has no
          # explicit `resources:` entry below) — see the NOTE further down:
          # the exclude-then-re-add pattern silently dropped it from the
          # real IPA (verified by extracting v1.0.1101's bundle). Left to
          # the plain recursive sweep, XcodeGen classifies .xcprivacy as a
          # bundle resource and it lands at Payload/QAudionApp.app/
          # PrivacyInfo.xcprivacy, which ios-testflight.yml now asserts.
          # NOTE: it.lproj/AppIntentVocabulary.plist (ITMS-90626) is
          # deliberately NOT excluded here. Two earlier attempts (v1.0.1099,
          # v1.0.1101) both excluded it from this sweep and re-added it as
          # an explicit `resources:` entry below (same pattern already used
          # for PrivacyInfo.xcprivacy) -- confirmed via a CI diagnostic dump
          # of the generated project.pbxproj that this produced ZERO
          # references anywhere in the project, i.e. XcodeGen silently
          # dropped the resource entirely rather than mis-grouping it.
          # Control check: PrivacyInfo.xcprivacy, which used the exact same
          # exclude-then-re-add pattern, was ALSO absent from the real built
          # IPA (verified by extracting v1.0.1101's bundle) -- so this is
          # not a `.lproj`-specific or `type: folder`-specific bug, it's
          # this exclude+explicit-resource pattern itself failing silently
          # on this project/XcodeGen version for both files. Leaving
          # it.lproj OUT of excludes lets the plain recursive sweep pick it
          # up directly instead. 2026-09-12: PrivacyInfo.xcprivacy moved to
          # the same sweep-only treatment and the CI now fails the build if
          # it is missing.
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: QAudion.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.qaudion.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5G22P9239N
        CODE_SIGN_STYLE: Automatic
        # 1 = iPhone, 2 = iPad. Reverted 2026-09-13: a 2026-09-12 change
        # restricted this to "1" on the false
        # premise that iPad was untested — this project's own memory
        # (project_ios_sas_pin_and_capturelive_2026_09_08,
        # project_ios_mic_before_accept_fix_2026_09_08,
        # project_answerbeforeready_fix_ios) already recorded real live
        # calls placed and answered from a real iPad (device 1fd97f9a,
        # builds 1.0.1108/1.0.1110, 2026-09-08) — that was never checked
        # before that change shipped. iPad stays a supported device family;
        # 13-inch iPad screenshots are required in App Store Connect
        # (Version Information > Screenshots) before this build's version
        # can be released with iPad enabled.
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Store 2.1 App Completeness — QAUDION_DEV_TOOLS gates
        # SettingsScreen's "SVILUPPATORE" section (P3ControlScreen/
        # EarbudDiagScreen/CallDesignShowcase/NetworkSimulatorScreen/
        # DevResetScreen) plus every TestFlight-facing surface (OTA screen,
        # cross-platform beta toggles, "Feedback TestFlight" links, the
        # screenshot-lock bypass in BugReporter). It is OFF here — the
        # store/TestFlight build ships without them. For a local dev build
        # add `-DQAUDION_DEV_TOOLS` via OTHER_SWIFT_FLAGS or append the
        # condition to this line on a throwaway branch; never commit it.
        #
        # VPN support is compiled only when QAUDION_VPN is set, and it is NOT
        # set by this spec: this spec has no packet-tunnel extension, no
        # WireGuardKit, no NetworkExtension.framework and no Network Extension
        # entitlement, and the VPN controls are shown greyed out and inactive.
        # The variant with VPN support is project-vpn.yml, which includes this
        # file and adds all of the above (see its header for the procedure).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        # -lc++ was originally added for the quiche/BoringSSL static lib,
        # which is gone; kept because the other C++-backed binary frameworks
        # may rely on it and it is harmless when already satisfied.
        OTHER_LDFLAGS: $(inherited) -lc++
        # CarPlay (Tier B custom in-car app) is gated behind QAUDION_CARPLAY and
        # is OFF by default so `v*` TestFlight builds stay green WITHOUT the
        # Apple-approval-gated `com.apple.developer.carplay-communication`
        # entitlement. CarPlay/CarPlayScene.swift is excluded from compilation
        # while the flag is absent. To ENABLE (after Apple grants the entitlement
        # — see the header of CarPlay/CarPlayScene.swift for the full checklist):
        #   1. SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) QAUDION_CARPLAY
        #   2. add `- sdk: CarPlay.framework` to the dependencies list below
        #   3. add the entitlement + Info.plist CarPlay scene config
        # CallKit-driven incoming/active calls already surface on CarPlay with
        # NONE of the above (Tier A) — that path needs no flag and no entitlement.
    dependencies:
      - package: QAudionEngine
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreNFC.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      # CarPlay/Siri state-of-the-art plan S1 — "Hey Siri, chiama X su
      # Q-Audion" handoff (QAudionApp.swift's .onContinueUserActivity,
      # AppState.handleSiriStartCall/donateStartCallInteraction).
      - sdk: Intents.framework
      # W441: AppLockService uses LAContext for biometric / passcode auth.
      - sdk: LocalAuthentication.framework
      # Siri calling (S1): embed the Intents Extension that handles
      # INStartCallIntent. See QAudionIntents/IntentHandler.swift.
      - target: QAudionIntents
        embed: true
    resources:
      - path: Assets.xcassets
      # Custom incoming-call ringtone (CallKit cfg.ringtoneSound). Bundle root.
      - path: Resources/qaudion_ringtone.caf
      # 3 s unit of the same ring, replayed by the in-app foreground ring (AppState.startInAppRingtone).
      # Same explicit-resource pattern as the file above (which does land in the IPA).
      - path: Resources/qaudion_ringtone_unit.caf
      # Apple privacy manifest (PrivacyInfo.xcprivacy) and ITMS-90626's
      # it.lproj/AppIntentVocabulary.plist deliberately have NO explicit
      # resources: entry here (see `sources.excludes` comment above for
      # why the exclude+re-add pattern silently dropped both from the IPA).
      # it.lproj is left untouched by the recursive `sources: path: .`
      # sweep, so XcodeGen's own built-in `.lproj` handling picks the file
      # up on its own. See that file's own header comment for the
      # phrase-content rationale.

  # ------------------------------------------------------------------ #
  # QAudionIntents — SiriKit Intents Extension                          #
  # CarPlay/Siri state-of-the-art plan (docs/superpowers/plans/         #
  # 2026-09-06-carplay-state-of-the-art.md). S1: INStartCallIntent      #
  # ("Hey Siri, chiama X su Q-Audion"), thin pass-through, hands off to #
  # the main app. S2: INSendMessageIntent/INSearchForMessagesIntent —   #
  # NOT a pass-through (Apple requires handle() to send/search from     #
  # inside this process), so this target ALSO compiles                 #
  # SiriMessageBridgeStore.swift directly from QAudionApp/Siri/ (a      #
  # second source path below, NOT the whole QAudionApp target) — a      #
  # single small Foundation+CryptoKit file shared by both targets so    #
  # they speak the exact same App-Group-encrypted format, still with no #
  # QAudionEngine dependency at all (that file carries no ratchet/      #
  # session material by design — see its own header doc).              #
  # Bundle: com.qaudion.app.intents                                     #
  # ------------------------------------------------------------------ #
  QAudionIntents:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../QAudionIntents
      - path: ../QAudionApp/Siri/SiriMessageBridgeStore.swift
    settings:
      base:
        INFOPLIST_FILE: ../QAudionIntents/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../QAudionIntents/QAudionIntents.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.qaudion.app.intents
        PRODUCT_NAME: QAudionIntents
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5G22P9239N
        CODE_SIGN_STYLE: Automatic
        # Extension-only: suppress "main" entry point and standard library
        # linking that the OS handles for extensions.
        SKIP_INSTALL: YES
    dependencies:
      - sdk: Intents.framework
