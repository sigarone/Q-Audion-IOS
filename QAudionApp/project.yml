name: QAudionApp
options:
  bundleIdPrefix: com.qaudion
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.2"
  # Prevents "member of multiple groups" xcodebuild warnings.
  # Without this, subdirectories (DesignSystem, Services, Views) appear
  # both in the target group and the root project group ("") when
  # sources uses path: . — XcodeGen flattens intermediate folders into
  # the root, producing duplicate file references.
  createIntermediateGroups: true

packages:
  QAudionEngine:
    path: ../QAudionEngine
  # WireGuard official iOS library — linked only to QAudionPacketTunnel.
  # Provides WireGuardAdapter + TunnelConfiguration used in PacketTunnelProvider.
  # NOTE: pinned to sigarone/wireguard-apple fork (tag 1.0.16-27-xcode26) because
  # upstream WireGuard/wireguard-apple Package.swift declares swift-tools-version:5.3
  # but uses .macOS(.v12)/.iOS(.v15) (requires 5.5+). Xcode 26 enforces this
  # strictly, causing "Invalid manifest" package resolution failures.
  # The fork bumps swift-tools-version to 5.5 — no other changes.
  WireGuardKit:
    url: https://github.com/sigarone/wireguard-apple
    from: "1.0.18"

targets:
  QAudionApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.html"
          - "*.yml"
          - project.yml
          # Bundled CallKit ringtone — added as an explicit resource below so
          # XcodeGen places it in Copy-Bundle-Resources unambiguously (same
          # rationale as PrivacyInfo.xcprivacy). Excluded from the recursive
          # `sources:` enumeration to avoid a double "Multiple commands produce".
          - "*.caf"
          # PrivacyInfo.xcprivacy is added as an explicit resource below
          # so XcodeGen places it in the Copy-Bundle-Resources phase. We
          # exclude it from the recursive `sources:` enumeration to keep
          # the build phase classification unambiguous (Apple requires
          # the file at the bundle root to silence ITMS-91061).
          - "PrivacyInfo.xcprivacy"
          # Reality.xcframework (VLESS+REALITY, built by
          # scripts/build-reality-xcframework.sh into Vendor/) is NOT YET
          # wired as a real dependency anywhere (no `framework:` entry
          # below, no SPM binaryTarget in QAudionEngine/Package.swift —
          # see that file's own comment). Without this exclude, the blind
          # recursive `sources: path: .` sweep picks it up as a loose
          # folder resource and copies its RAW, unprocessed binary into
          # the app bundle — never going through Xcode's real embed/link
          # pipeline. altool then rejects the upload outright: "The
          # executable 'Reality.framework/Reality' has type 'OBJECT' that
          # is not valid. Only 'EXECUTE' is permitted. (90124)" — device-
          # confirmed 2026-07-08, blocked v1.0.744 (every TestFlight
          # release, not just Reality). Remove this exclude in the same
          # change that adds the real `.binaryTarget`/`framework:` wiring.
          - "Vendor/Reality.xcframework"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: QAudion.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.qaudion.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5G22P9239N
        CODE_SIGN_STYLE: Automatic
        # Universal iOS app: 1 = iPhone, 2 = iPad. Without this explicit
        # value XcodeGen leaves the build setting at Xcode's default,
        # which has historically been "1,2" but is not guaranteed across
        # toolchain rotations. Pin it so TestFlight/App Store always
        # accepts iPad installs alongside iPhone.
        TARGETED_DEVICE_FAMILY: "1,2"
        # MASQUE: quiche (static lib) bundles BoringSSL; link the C++ runtime
        # and the resolver it needs. -lresolv satisfies res_* symbols; -lc++
        # satisfies BoringSSL's C++ bits. Harmless if unused.
        OTHER_LDFLAGS: $(inherited) -lresolv -lc++
        # Cquiche module map lives in Modules/module.modulemap (committed).
        # quiche.xcframework omits its own module.modulemap to avoid an Xcode
        # 26.3 "Multiple commands produce .../include/module.modulemap" error
        # (both quiche and QaudionCryptoCore xcframeworks had the same filename).
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/Modules
        # CarPlay (Tier B custom in-car app) is gated behind QAUDION_CARPLAY and
        # is OFF by default so `v*` TestFlight builds stay green WITHOUT the
        # Apple-approval-gated `com.apple.developer.carplay-communication`
        # entitlement. CarPlay/CarPlayScene.swift is excluded from compilation
        # while the flag is absent. To ENABLE (after Apple grants the entitlement
        # — see the header of CarPlay/CarPlayScene.swift for the full checklist):
        #   1. SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) QAUDION_CARPLAY
        #   2. add `- sdk: CarPlay.framework` to the dependencies list below
        #   3. add the entitlement + Info.plist CarPlay scene config
        # CallKit-driven incoming/active calls already surface on CarPlay with
        # NONE of the above (Tier A) — that path needs no flag and no entitlement.
    dependencies:
      - package: QAudionEngine
      # MASQUE CONNECT-UDP backend. quiche.xcframework is built in CI by the
      # "Build quiche xcframework" step (scripts/build-quiche-xcframework.sh)
      # into QAudionApp/Vendor/ BEFORE `xcodegen generate`. It exposes the
      # `Cquiche` Clang module imported by AppMasqueQuicheTransport.swift
      # (gated `#if canImport(Cquiche)`). Static lib → embed: false.
      - framework: Vendor/quiche.xcframework
        embed: false
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreNFC.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      # W441: AppLockService uses LAContext for biometric / passcode auth.
      - sdk: LocalAuthentication.framework
      # VPN: NETunnelProviderManager — main app side of the packet tunnel.
      - sdk: NetworkExtension.framework
      # VPN: embed the packet tunnel extension into the app bundle.
      - target: QAudionPacketTunnel
        embed: true
    resources:
      - path: Assets.xcassets
      # Custom incoming-call ringtone (CallKit cfg.ringtoneSound). Bundle root.
      - path: Resources/qaudion_ringtone.caf
      # Apple privacy manifest. Placed at the root of the app bundle by
      # XcodeGen's Copy-Bundle-Resources phase. Required to silence
      # ITMS-91061 ("Missing privacy manifest") on uploads after May 1
      # 2024. See QAudionApp/PrivacyInfo.xcprivacy for the full content
      # and the rationale for each declared API category / data type.
      - path: PrivacyInfo.xcprivacy

  # ------------------------------------------------------------------ #
  # QAudionPacketTunnel — Network Extension (packet tunnel provider)    #
  # Separate OS-launched process; uses WireGuardKit to manage the       #
  # WireGuard tunnel. Bundle: com.bcrypto.qaudion.packet-tunnel         #
  # ------------------------------------------------------------------ #
  QAudionPacketTunnel:
    type: app-extension
    platform: iOS
    # WireGuardKit 1.x requires iOS 15+. Set to 16.0 to match the main app
    # so the extension runs on every device the app supports.
    deploymentTarget: "16.0"
    sources:
      - path: ../QAudionPacketTunnel
    settings:
      base:
        INFOPLIST_FILE: ../QAudionPacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../QAudionPacketTunnel/QAudionPacketTunnel.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.qaudion.app.packet-tunnel
        PRODUCT_NAME: QAudionPacketTunnel
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5G22P9239N
        CODE_SIGN_STYLE: Automatic
        # Extension-only: suppress "main" entry point and standard library
        # linking that the OS handles for extensions.
        SKIP_INSTALL: YES
    dependencies:
      # WireGuardKit — the only import in PacketTunnelProvider.swift besides
      # NetworkExtension and os.log (both are Apple system frameworks).
      - package: WireGuardKit
        product: WireGuardKit
    preBuildScripts:
      # Build WireGuard Go runtime library (libwg-go.a) from the SPM checkout
      # BEFORE the link phase runs.
      #
      # Why needed: WireGuardKitGo's Package.swift has
      #   linkerSettings: [.linkedLibrary("wg-go")]
      # so the linker passes -lwg-go and expects libwg-go.a in
      # $CONFIGURATION_BUILD_DIR. The library is NOT in git — it is compiled
      # from Sources/WireGuardKitGo/api-apple.go via the Makefile using Go
      # CGO cross-compilation (GOOS=ios).
      #
      # Environment variables PLATFORM_NAME, ARCHS, SDKROOT, and
      # CONFIGURATION_BUILD_DIR are set automatically by Xcode in every Run
      # Script phase — the Makefile reads them directly.
      - name: Build WireGuard Go (libwg-go.a)
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(CONFIGURATION_BUILD_DIR)/libwg-go.a
        script: |
          #!/bin/sh
          set -eu

          # Locate WireGuardKitGo inside DerivedData SourcePackages.
          #
          # BUILD_DIR during `xcodebuild build`  = .../DerivedData/<n>/Build/Products
          # BUILD_DIR during `xcodebuild archive` = .../DerivedData/<n>/Build/
          #   Intermediates.noindex/ArchiveIntermediates/Products/Release-iphoneos
          #   (several levels deeper than the regular build)
          #
          # Complication: xcodebuild archive also creates its own
          # ArchiveIntermediates/SourcePackages/ for package resolution, so a
          # naive walk-up stops there first — before reaching the top-level
          # DerivedData SourcePackages/ where the actual checkouts live.
          #
          # Strategy:
          #   1. Walk up from BUILD_DIR, collecting every ancestor that has
          #      SourcePackages/. Stop when WireGuardKitGo is found inside one.
          #   2. Within each SourcePackages use `find -name WireGuardKitGo` so
          #      we tolerate checkout directories with version/hash suffixes
          #      (e.g. wireguard-apple-1.0.18 instead of wireguard-apple).
          #   3. Last resort: search ~/Library/Developer/Xcode/DerivedData
          #      for the project folder directly.
          WG_GO_SRC=""
          SEARCH_ROOT="$BUILD_DIR"
          while [ "$SEARCH_ROOT" != "/" ]; do
            SEARCH_ROOT=$(dirname "$SEARCH_ROOT")
            if [ -d "$SEARCH_ROOT/SourcePackages/checkouts" ]; then
              CANDIDATE=$(find "$SEARCH_ROOT/SourcePackages/checkouts" \
                -maxdepth 4 -type d -name "WireGuardKitGo" 2>/dev/null | head -1 || echo "")
              if [ -n "$CANDIDATE" ]; then
                WG_GO_SRC="$CANDIDATE"
                break
              fi
            fi
          done

          # Last-resort: scan the whole project DerivedData folder
          if [ -z "$WG_GO_SRC" ]; then
            DD_PROJ=$(find ~/Library/Developer/Xcode/DerivedData \
              -maxdepth 1 -type d -name "QAudionApp-*" 2>/dev/null | head -1 || echo "")
            if [ -n "$DD_PROJ" ]; then
              WG_GO_SRC=$(find "$DD_PROJ" -type d -name "WireGuardKitGo" \
                2>/dev/null | head -1 || echo "")
            fi
          fi

          if [ -z "$WG_GO_SRC" ] || [ ! -d "$WG_GO_SRC" ]; then
            echo "error: WireGuardKitGo source not found anywhere under DerivedData"
            echo "note:  BUILD_DIR=$BUILD_DIR"
            echo "note:  Resolve the wireguard-apple SPM package first."
            exit 1
          fi

          echo "Building libwg-go.a"
          echo "  Source:                 $WG_GO_SRC"
          echo "  PLATFORM_NAME:          ${PLATFORM_NAME}"
          echo "  ARCHS:                  ${ARCHS}"
          echo "  SDKROOT:                ${SDKROOT}"
          echo "  CONFIGURATION_BUILD_DIR:${CONFIGURATION_BUILD_DIR}"

          # Ensure Go is in PATH. setup-go installs to /usr/local/go/bin on
          # GitHub Actions runners; Homebrew uses /opt/homebrew/bin on Apple Silicon.
          for GO_DIR in /usr/local/go/bin /opt/homebrew/bin /usr/bin; do
            if [ -x "$GO_DIR/go" ]; then
              export PATH="$GO_DIR:$PATH"
              break
            fi
          done

          if ! command -v go > /dev/null 2>&1; then
            echo "error: 'go' not found in PATH. Add a setup-go step in the CI workflow."
            exit 1
          fi
          echo "  Go: $(go version)"

          make -C "$WG_GO_SRC" build
