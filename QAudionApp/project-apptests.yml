# XcodeGen spec used ONLY by .github/workflows/ios-app-tests.yml.
#
# QAudionApp/project.yml (the spec ios-testflight.yml archives from) has no
# test target, so everything under QAudionAppTests/ has never been compiled or
# run. This overlay includes that spec unchanged and adds a unit-test bundle
# hosted by the app, restricted to the files listed under `includes` below.
# Nothing here reaches a release build, and the committed project.yml stays
# untouched.
#
# The bundle compiles ONLY the listed files on purpose: the rest of
# QAudionAppTests/ was written without a compiler (see the "not yet wired into
# a build target" notes in those files) and is not known to build. Add a file
# here, and its class to the -only-testing list in the workflow, once it has
# been made to pass. QAudionEngine is deliberately NOT a dependency of the
# bundle: Xcode 26 rejects a static package product linked by two targets
# ("linked as a static library by QAudionAppTests and QAudionApp ... duplication
# of library code"), so the bundle imports the engine module from the shared
# build products and resolves its symbols from the host app (BUNDLE_LOADER).
# Keep such tests pure; anything needing a ContactsStore or Keychain belongs in
# QAudionEngineTests.

include:
  - project.yml

targets:
  QAudionAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../QAudionAppTests
        includes:
          - AbuseReportCategoryTests.swift
          - AgeDeclarationTests.swift
          - AppLockServiceTests.swift
          - AppUpdateLinkTests.swift
          - AppStateFilesServerUrlTests.swift
          - AvatarAnnounceReductionTests.swift
          - AvatarResizeTests.swift
          - BlockedContactsStoreTests.swift
          - BugReportFreezeTests.swift
          - BugReporterRetryQueueTests.swift
          - ChatVoiceNoteSenderMaxUsesTests.swift
          - CallCloseReasonRedactionTests.swift
          - CallMetricsRedactionTests.swift
          - CallMinimizePolicyTests.swift
          - CallerBusyOutcomeTests.swift
          - CallStartSupportTests.swift
          - CarPlayBridgeTests.swift
          - CarPlayListModelTests.swift
          - ConfidenceToneTests.swift
          - DesignSystemAccessibilityTests.swift
          - DeviceSymbolTests.swift
          - EarbudCompileConditionTests.swift
          - FeatureFlagKillSwitchTests.swift
          - FileV2ImageCleanerTests.swift
          - IntentHandlerTests.swift
          - KmsSweepStatusTests.swift
          - LegalLinksTests.swift
          - MeshAudioRouteTests.swift
          - MeshConsentPresentationTests.swift
          - MeshConsentTests.swift
          - MeshReachTests.swift
          - MissedCallsBadgeTests.swift
          - NoticeServiceTests.swift
          - PersistentCallRecordStoreTests.swift
          - PhoneEntryScreenInviteTests.swift
          - ProximityPairingTelemetryRedactionTests.swift
          - RecoveryEnrollmentStatusTests.swift
          - ReKeyAvatarRingTests.swift
          - RuntimeLogSinkTeeTests.swift
          - SiriIntentPolicyTests.swift
          - TrustEvaluationModelTests.swift
          - VoiceDisplayFormatTests.swift
          - VoiceGuardModelTests.swift
          - VoiceToneRowTests.swift
          - VoiceWordTests.swift
      # The Siri Intents extension and the files it shares with the app, compiled into the bundle itself so that
      # IntentHandlerTests and SiriIntentPolicyTests drive the real source with a fake bridge. The bundle's own
      # copies shadow the app's: the types are different (another module), the code is the same file.
      - path: ../QAudionIntents/IntentHandler.swift
      - path: ../QAudionApp/Siri/SiriMessageBridgeStore.swift
      - path: ../QAudionApp/Siri/SiriIntentPolicy.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.qaudion.app.tests
        SWIFT_VERSION: "5.9"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/QAudionApp.app/QAudionApp
        BUNDLE_LOADER: $(TEST_HOST)
        # Engine and its binary/package dependencies are built for the host app;
        # make their modules and frameworks findable without linking them again.
        SWIFT_INCLUDE_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR) $(BUILT_PRODUCTS_DIR)/PackageFrameworks
    dependencies:
      - target: QAudionApp

schemes:
  QAudionAppTests:
    build:
      targets:
        QAudionApp: all
        QAudionAppTests: [test]
    test:
      config: Debug
      targets:
        - QAudionAppTests
