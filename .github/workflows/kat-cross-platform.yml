# Cross-platform KAT for Q-Audion iOS
#
# Runs the Swift+CryptoKit+liboqs implementation against canonical
# vectors hosted in bcrypto-server/test/kat/wire_v1.0.0/.
#
# This GitHub Actions workflow (CI moved off Codemagic 2026-05-06, see
# CLAUDE.md) is the cross-platform PR-gating canary that runs only the
# deterministic crypto KAT suite (no simulator boot needed).
#
# Status: GATING (since 2026-07-30). Auto-trigger was disabled earlier the
# same day because the old fallback ("Run SPM tests" re-running the whole
# QAudionEngineTests suite with continue-on-error) was a pure duplicate of
# engine-tests.yml on the same expensive macos-latest runner, testing
# nothing of its own. WireV1CrossPlatformKatTests.swift now exists and
# exercises CryptoKit (HKDF/X25519) + liboqs (ML-KEM-1024 derand) directly
# against these vectors — see that file's own header comment for the one
# caveat: it was authored on win32 (no local Xcode/CryptoKit/liboqs), so
# THIS WORKFLOW'S FIRST RUN is the first real compile+execute of it. If it
# fails, read the actual error before assuming the vectors are wrong — the
# Swift code is unverified, the vectors are (Android + Desktop already pass
# against the same bcrypto-server SHA locally).
#
# Scope: does not cover canonical_cbor/sealed_sender_cert_v2.json —
# SenderCertV2/sealed-sender has no iOS implementation at all.

name: KAT cross-platform

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Same discovery pattern as ios-testflight.yml's "Select Xcode" step —
  # kept in lockstep 2026-07-28 so this workflow tests against the same
  # Xcode major version that actually ships to TestFlight, instead of
  # drifting behind on an old runner default (was hard-pinned to 15.4).
  XCODE_VERSION: '26'

jobs:
  ios-kat:
    name: iOS Swift KAT
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          set -e
          PIN="${XCODE_VERSION}"
          MATCH=$(ls -d /Applications/Xcode_${PIN}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MATCH" ]; then
            echo "No Xcode matching '${PIN}*' found. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Selecting: $MATCH"
          sudo xcode-select -s "$MATCH"
          xcodebuild -version

      - name: Pull KAT vectors
        env:
          BCRYPTO_SERVER_SHA: ef3a1d423b6980b571b5d7bd63d574cb3b2b480d
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/sigarone/Bcrypto-server/${BCRYPTO_SERVER_SHA}/test/kat/wire_v1.0.0"
          DIR="QAudionEngine/Tests/QAudionEngineTests/Crypto/Resources/wire_v1.0.0"
          mkdir -p "$DIR/hkdf" "$DIR/x25519" "$DIR/aead_nonce" "$DIR/ml_kem_1024"
          for f in hkdf/expand.json x25519/derive.json x25519/ecdh.json \
                   aead_nonce/derive.json ml_kem_1024/keygen.json ml_kem_1024/decap.json; do
            curl -sSfL "$BASE/$f" -o "$DIR/$f"
          done

      - name: Run SPM tests
        run: |
          cd QAudionEngine
          swift test --filter WireV1CrossPlatformKatTests

      - name: Upload test reports on failure
        if: failure()
        # Non-fatal: a quota hit must not turn a real KAT regression
        # into "ran out of storage" on the post-fail report upload.
        # Reports are only useful for debugging — drop them silently
        # if storage is full; the test failure itself is what we care
        # about.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kat-ios-reports
          path: QAudionEngine/.build/
          retention-days: 7
