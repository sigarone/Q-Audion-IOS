# Cross-platform KAT for Q-Audion iOS
#
# Runs the Swift+CryptoKit+liboqs implementation against canonical
# vectors hosted in bcrypto-server/test/kat/wire_v1.0.0/.
#
# This GitHub Actions workflow (CI moved off Codemagic 2026-05-06, see
# CLAUDE.md) was meant to be a cross-platform PR-gating canary that runs
# only the deterministic crypto KAT suite, without booting a simulator.
#
# Status: DISABLED AGAIN (workflow_dispatch only), 2026-07-30, same day it
# was re-enabled. WireV1CrossPlatformKatTests.swift is real and DOES pass
# (all 6 assertions: HKDF, X25519 derive+ECDH, AEAD-nonce, ML-KEM-1024
# keygen+decap) — confirmed green via engine-tests.yml's ios-simulator-tests
# job, which already runs the whole QAudionEngineTests target including
# this class. What doesn't work is running it HERE, standalone, via bare
# `swift test`: this package depends on LiveKit's binary `LiveKitWebRTC`
# xcframework, and SwiftPM's CLI can't resolve/link binary xcframework
# targets the way `xcodebuild -scheme ...` can — every attempt fails with
# "no such module 'LiveKitWebRTC'" before a single test runs. Making this
# job work would mean switching to `xcodebuild test -scheme QAudionEngine
# -destination 'platform=iOS Simulator...'`, i.e. booting a simulator —
# at which point it costs exactly what engine-tests.yml already costs, for
# zero additional coverage (that job runs this same test class). Vectors
# stay vendored under Tests/QAudionEngineTests/Crypto/Resources/wire_v1.0.0/
# (bcrypto-server is private, CI can't curl it, and SPM needs the files to
# exist on disk regardless) so engine-tests.yml's run of this class keeps
# working. Re-enable this workflow only if it's rewritten to not need
# LiveKitWebRTC at all (e.g. a build configuration that excludes it), not
# by just re-adding the triggers.
#
# Scope: does not cover canonical_cbor/sealed_sender_cert_v2.json —
# SenderCertV2/sealed-sender has no iOS implementation at all.

name: KAT cross-platform

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Same discovery pattern as ios-testflight.yml's "Select Xcode" step —
  # kept in lockstep 2026-07-28 so this workflow tests against the same
  # Xcode major version that actually ships to TestFlight, instead of
  # drifting behind on an old runner default (was hard-pinned to 15.4).
  XCODE_VERSION: '26'

jobs:
  ios-kat:
    name: iOS Swift KAT
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          set -e
          PIN="${XCODE_VERSION}"
          MATCH=$(ls -d /Applications/Xcode_${PIN}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MATCH" ]; then
            echo "No Xcode matching '${PIN}*' found. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Selecting: $MATCH"
          sudo xcode-select -s "$MATCH"
          xcodebuild -version

      - name: Run SPM tests
        run: |
          cd QAudionEngine
          swift test --filter WireV1CrossPlatformKatTests

      - name: Upload test reports on failure
        if: failure()
        # Non-fatal: a quota hit must not turn a real KAT regression
        # into "ran out of storage" on the post-fail report upload.
        # Reports are only useful for debugging — drop them silently
        # if storage is full; the test failure itself is what we care
        # about.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kat-ios-reports
          path: QAudionEngine/.build/
          retention-days: 7
