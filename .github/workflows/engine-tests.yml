name: QAudionEngine Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Same discovery pattern as ios-testflight.yml's "Select Xcode" step —
  # kept in lockstep 2026-07-28 so ios-simulator-tests below builds/tests
  # against the same Xcode major version that actually ships to
  # TestFlight, instead of silently running on macos-14's old Xcode 15.4
  # default while production ships on Xcode 26.x.
  XCODE_VERSION: '26'

jobs:
  # NOTE 2026-07-28: the old macOS "test" job (swift build/swift test on
  # QAudionEngine, macos-14) was removed here. It never actually verified
  # anything: WebRTC has no macOS xcframework slice, so `swift build` failed
  # to compile every single run, and the failure was masked on purpose via
  # `| tail -100` (no `set -o pipefail`), so the job reported green
  # unconditionally. Confirmed zero real coverage lost — grepping that job's
  # historical logs for `Test Suite` never matched once; all real
  # QAudionEngine test coverage has only ever come from ios-simulator-tests
  # below. Re-adding a macOS-native lane would require either a WebRTC
  # macOS-slice build (separate repo, sigarone/webrtc-aes256-build) or
  # splitting QAudionEngine's test target so pure-logic tests don't pull in
  # WebRTC/SwiftUI-iOS-only code — both real engineering efforts, not a CI
  # config tweak, and neither can be verified without macOS/Xcode access.

  # iOS Simulator job — runs xcodebuild test targeting arm64 simulator.
  # This uses the ios-arm64-simulator slice of QaudionCryptoCore.xcframework
  # (v0.1.2) so RatchetNative.available = true and RatchetNativeRoundTripTests
  # run fully (not skipped). WebRTC's iOS-simulator slice is present, so this
  # job does NOT share the macOS-slice-missing issue.
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          set -e
          PIN="${XCODE_VERSION}"
          MATCH=$(ls -d /Applications/Xcode_${PIN}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MATCH" ]; then
            echo "No Xcode matching '${PIN}*' found. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Selecting: $MATCH"
          sudo xcode-select -s "$MATCH"
          xcodebuild -version

      # ----------------------------------------------------------
      # Build Reality.xcframework -- VLESS+REALITY-over-xray-core transport
      # (see ios-testflight.yml's own "Build reality xcframework" step for
      # the full design-doc context). This job is what actually PROVES the
      # QAudionEngine/Package.swift binaryTarget wiring compiles and
      # RealityManager's real `#if canImport(Reality)` branch links, on
      # every push -- the tag-triggered TestFlight job alone would only
      # catch a break once per release.
      #
      # go-version MUST track RealityCore/go.mod's own `go` directive
      # (currently 1.26.3): actions/setup-go@v6 sets GOTOOLCHAIN=local at
      # the job level, so an older pinned Go here can't auto-fetch a newer
      # toolchain to satisfy go.mod. A stale pin doesn't fail cleanly with
      # a version-mismatch error -- it breaks `gomobile bind`'s `tool`
      # directive resolution instead ("gomobile bind requires
      # golang.org/x/mobile in the current module, but it is not in the
      # module dependency graph"), which is a much more confusing failure
      # to debug than the real cause. Root-caused 2026-07-08 after
      # RealityCore/go.mod bumped its go directive without this pin
      # following.
      # ----------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Cache reality xcframework
        id: cache-reality
        uses: actions/cache@v5
        with:
          path: QAudionApp/Vendor/Reality.xcframework
          key: reality-xcframework-sim-${{ runner.os }}-${{ hashFiles('RealityCore/go.sum', 'scripts/build-reality-xcframework.sh') }}

      - name: Build reality xcframework
        if: steps.cache-reality.outputs.cache-hit != 'true'
        run: bash scripts/build-reality-xcframework.sh

      - name: Cache SPM (iOS Simulator)
        id: cache-spm-ios
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            QAudionEngine/.build
          # Bumped to v2 2026-07-28 (LiveKit 2.13->2.15 bump) and dropped the
          # restore-keys prefix fallback on purpose: SPM's local checkout
          # cache is keyed by package IDENTITY (repo name), not URL. The old
          # v1- prefix fallback restored a stale checkout for the
          # "webrtc-xcframework" identity from a PRIOR resolution whose
          # manifest pointed at livekit's upstream URL, and SPM kept
          # `git fetch`-ing that same checkout's already-configured (wrong)
          # remote even after this Package.swift's transitive redirect
          # changed to sigarone's AES-256 fork — confirmed live (run
          # 30344495020: resolved "LiveKitWebRTC: .../livekit/
          # webrtc-xcframework.git @ 144.7559.10" instead of the sigarone
          # fork; sigarone/webrtc-xcframework was never even considered as a
          # candidate). A prefix-fallback hit on an exact-key MISS is exactly
          # the scenario that can resurrect this: any future fork-URL swap
          # under an unchanged package identity would silently reintroduce
          # it. Exact-key-only means a genuine Package.swift change always
          # gets a fully fresh resolve — slower on that one run, never stale.
          key: ios-sim-spm-v2-${{ hashFiles('QAudionEngine/Package.swift') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        if: steps.cache-spm-ios.outputs.cache-hit != 'true'
        run: |
          cd QAudionEngine
          swift package resolve

      - name: List available schemes
        run: |
          cd QAudionEngine
          xcodebuild -list 2>&1 || true

      - name: Run Tests (iOS Simulator)
        run: |
          cd QAudionEngine
          # 2026-07-08: this job was hanging and getting force-cancelled by
          # GitHub's 60min job timeout on EVERY push for 3+ days (confirmed
          # across 10+ unrelated commits) — root-caused to a genuine thread-
          # pool-starvation deadlock inside TusUploadClientTests' Task.sleep-
          # based retry test, specific to the Simulator runner (never
          # reproduces on the sibling macOS "test" job). An in-process Swift
          # `withThrowingTaskGroup` timeout was tried first and did NOT help
          # (confirmed: still hit the 60min ceiling) — a true thread deadlock
          # starves the async timeout task's own continuation too, since it
          # needs a free cooperative-pool thread just like the hung code
          # does. Only a process-external watchdog can actually interrupt
          # this. Portable pure-bash (no dependency on `timeout`/`gtimeout`
          # binary presence on the runner) — kill xcodebuild outright after
          # 15 min instead of silently burning the full 60min job ceiling on
          # every single push.
          # -configuration Release: without it, `xcodebuild test` defaults to
          # Debug (-Onone, no optimizer) -- confirmed 2026-07-08 by pushing a
          # from-scratch rewrite of Scrypt.swift's hot loops (Data subscript ->
          # [UInt8] + withUnsafe(Mutable)BufferPointer, eliminating Data's
          # bridging/COW overhead) that made almost no difference in this job
          # (258s vs the prior 294s for the same N=131072 derivation -- ~12%,
          # not the 10-100x a real algorithmic fix should show). The dominant
          # cost is the missing optimizer, not the data-structure choice; the
          # Scrypt.swift rewrite is still a legitimate improvement, just not
          # sufficient alone.
          #
          # SWIFT_ENABLE_TESTABILITY=YES: SPM only auto-adds `-enable-testing`
          # to a library target's Debug build. Forcing -configuration Release
          # above (this run, 2026-07-08) never got exercised until the Go
          # version pin above was fixed the same day -- so this was a second,
          # previously-masked break: `@testable import QAudionEngine` in the
          # test target failed with "module 'QAudionEngine' was not compiled
          # for testing" the first time this job ever actually reached this
          # step under Release. Overriding the build setting directly here
          # (rather than in Package.swift's unsafeFlags, which would make
          # this package ineligible as a remote SPM dependency for any other
          # consumer) keeps this a CI-only concession.
          #
          # OTHER_LDFLAGS -lresolv: Reality.xcframework embeds a gomobile-
          # compiled Go runtime, which needs libresolv's res_9_ninit/
          # res_9_nsearch/res_9_nclose symbols for DNS resolution. A THIRD
          # previously-masked break, same root cause as the two above --
          # this job never linked QAudionEngineTests against Reality until
          # now. QAudionApp/project.yml already carries the identical
          # `-lresolv` for the main app target (same comment, same reason);
          # this test target just never had it.
          #
          # 2026-07-10: test_markViewOnceOpened_incomingRow_armsExpiryAndOpensIt
          # was skipped here (commit 89a221a) on the theory that it was a
          # Simulator-only GRDB write/read quirk, since the sibling macOS
          # "test" job "kept passing". That premise was never actually true:
          # the macOS job's `swift build`/`swift test` steps are piped through
          # `| tail -100`, which masks their exit code, and on macOS the whole
          # package fails to COMPILE (WebRTC has no macOS slice --
          # RTCVideoEncoderH265/RTCVideoDecoderH265 missing, plus an
          # iOS-only `.keyboardType` SwiftUI call) before it ever reaches
          # XCTest -- confirmed by grepping that CI job's log for `Test
          # Suite`: zero matches, ever. So the macOS job was never real
          # counter-evidence; this job (iOS Simulator) is the ONLY place the
          # test (and the code it exercises) actually runs.
          # Real root cause: QAudionEngine/Sources/QAudionEngine/Persistence/
          # DatabaseMappers.swift's hand-written `Message.encode(to:)` /
          # `Message.init(row:)` never mapped the `isViewOnce`/
          # `viewOnceOpened` columns (added by the `v4-view-once-screenshot-
          # perm` migration) to/from GRDB's PersistenceContainer/Row. Every
          # write silently dropped both columns and every read hard-defaulted
          # them to the initializer's `nil`, regardless of what was actually
          # in `messages.viewOnceOpened` -- a deterministic mapping bug, not
          # a timing race (production impact: ChatDetailScreen re-reads a
          # persisted view-once row and always treats it as a normal message,
          # since `msg.isViewOnce` reads back nil after any DB round-trip).
          # Fixed by adding both columns to encode(to:)/init(row:) -- un-
          # skipping this test now that the underlying bug is fixed.
          #
          # 2026-07-22: HandshakeTranscriptKatTests was permanently skipped
          # here with no root cause ever found -- confirmed via a real run
          # of THIS job (PR #34, commit 5a8b0b0) that
          # testHandshakeSigKatMatchesCrossPlatformContract failed on the
          # signature byte-equality assertion for both OFFER and ACCEPT
          # vectors while the transcript SHA-256/length assertions passed.
          # Root cause: not a bug. Apple's own doc for
          # `Curve25519.Signing.PrivateKey.signature(for:)` states CryptoKit
          # "employs randomization to generate a different signature on
          # every call, even for the same data and key, to guard against
          # side-channel attacks" -- confirmed independently by re-deriving
          # the golden signatures with an OpenSSL/`cryptography`-backed
          # Python reference from the exact seed + transcript bytes (dumped
          # via Android's HandshakeTranscript.offer()/accept(), the same
          # functions Android's own KAT test consumes): they match the
          # golden byte-for-byte, so BouncyCastle/OpenSSL are deterministic
          # and the golden vector is correct -- CryptoKit alone isn't. Test
          # fixed to assert the actual cross-platform contract instead
          # (iOS verifies the golden, and iOS's own signature verifies
          # under its own key) rather than byte-equality CryptoKit was
          # never going to satisfy. Un-skipping now that it asserts the
          # right thing.
          xcodebuild test \
            -scheme "QAudionEngine" \
            -configuration Release \
            SWIFT_ENABLE_TESTABILITY=YES \
            OTHER_LDFLAGS="\$(inherited) -lresolv" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath /tmp/dd-ios-sim \
            -resultBundlePath /tmp/ios-sim-results.xcresult &
          XCODEBUILD_PID=$!
          ( sleep 900; echo "::error::xcodebuild test exceeded 15min watchdog — killing (was hanging the full 60min job timeout before this fix)"; kill -9 "$XCODEBUILD_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$XCODEBUILD_PID"
          EXIT_CODE=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit "$EXIT_CODE"

  # ----------------------------------------------------------------
  # Report-only checks added 2026-07-28. Each of these three jobs is
  # independent of `test`/`ios-simulator-tests` above (no `needs:`,
  # no shared cache key, no shared runner) and every step below sets
  # `continue-on-error: true` so a finding here can NEVER fail the
  # workflow or block a merge (main has no branch protection today,
  # but the flag makes that explicit and future-proof). These exist
  # to surface signal that wasn't visible before, not to gate CI.
  # Once someone has reviewed the first report and the noise (if
  # any) is triaged, `continue-on-error` can be dropped to make a
  # given job actually enforce.
  # ----------------------------------------------------------------

  # SwiftLint over QAudionEngine only (scope + exclusions come from the
  # existing .swiftlint.yml at repo root — CLiboqs/COpus are already
  # excluded there since they're C, not Swift). Deliberately does NOT
  # touch QAudionApp: that's the SwiftUI app with the documented Xcode
  # 26.4 type-checker-timeout traps (see CLAUDE.md), and adding lint
  # there is a separate, higher-risk decision for later. Runs the
  # official realm/swiftlint Docker image directly (no third-party
  # Action) on ubuntu-latest — no Xcode/macOS runner needed for pure
  # linting, so this doesn't compete for macOS runner capacity.
  swiftlint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # 2026-07-28 — was `--reporter github-actions-logging`, which surfaces
      # each violation as a GitHub annotation. Confirmed live (run
      # 30350292476) that this silently caps at ~20 annotations shown/
      # queryable via the Checks API — the job's own raw log said "Done
      # linting! Found 3380 violations, 1580 serious in 472 files" the same
      # run, so the annotation view was showing 0.6% of the real picture
      # with no indication anything was cut. `--output` writes the FULL,
      # uncapped result as JSON instead, which the next two steps turn into
      # an actually-complete signal: a real total in the job summary (not
      # annotation-capped) and the full list as a downloadable artifact.
      - name: SwiftLint (full JSON report)
        id: swiftlint
        continue-on-error: true
        uses: docker://ghcr.io/realm/swiftlint:latest
        with:
          args: lint --config .swiftlint.yml --reporter json --output swiftlint-report.json
      - name: Summarize SwiftLint results (uncapped)
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -s swiftlint-report.json ]; then
            echo "### SwiftLint" >> "$GITHUB_STEP_SUMMARY"
            echo "No report produced (lint step may have crashed — see the step above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TOTAL=$(jq 'length' swiftlint-report.json)
          SERIOUS=$(jq '[.[] | select(.severity == "Error")] | length' swiftlint-report.json)
          WARNINGS=$(jq '[.[] | select(.severity == "Warning")] | length' swiftlint-report.json)
          {
            echo "### SwiftLint — full report ($TOTAL violations, GitHub annotations cap at ~20 so this summary is the real count)"
            echo ""
            echo "**$TOTAL total** — $SERIOUS serious (error), $WARNINGS warning"
            echo ""
            echo "<details><summary>Top rules by count</summary>"
            echo ""
            echo '```'
            jq -r '.[].rule_id' swiftlint-report.json | sort | uniq -c | sort -rn | head -20
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Top files by violation count</summary>"
            echo ""
            echo '```'
            jq -r '.[].file' swiftlint-report.json | xargs -n1 basename | sort | uniq -c | sort -rn | head -20
            echo '```'
            echo "</details>"
            echo ""
            echo "Full per-violation detail (file/line/rule/message): download the \`swiftlint-full-report\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full SwiftLint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-full-report
          path: swiftlint-report.json
          if-no-files-found: warn
          retention-days: 14

  # RealityCore (VLESS+REALITY Go core, see ios-simulator-tests above
  # for the gomobile-bind build of the same module) has go.mod/tests
  # but was never checked by `go vet`/`go test` in CI. go-version pinned
  # to match RealityCore/go.mod's own `go` directive, same as the
  # ios-simulator-tests job's Go setup above.
  realitycore-go-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: RealityCore/go.sum
      - name: go vet (report only)
        continue-on-error: true
        run: |
          cd RealityCore
          go vet ./...
      - name: go test (report only)
        continue-on-error: true
        run: |
          cd RealityCore
          go test ./... -v

  # Secret scan over the full repo (including history) via the
  # official gitleaks Docker image. Report only: a hit here (e.g. an
  # already-rotated historical secret, see project_vps_rotation memory)
  # is signal to review, not a merge blocker.
  secret-scan-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (report only)
        continue-on-error: true
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source . -v --redact
