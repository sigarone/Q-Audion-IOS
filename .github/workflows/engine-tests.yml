name: QAudionEngine Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find iOS Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | \
            python3 -c "import json,sys; devs=json.load(sys.stdin)['devices']; \
            ids=[d['udid'] for k,v in devs.items() if 'iOS' in k for d in v if 'iPhone' in d['name'] and d['isAvailable']]; \
            print(ids[0] if ids else '')")
          echo "dest=platform=iOS Simulator,id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"
      - name: Build & Test (iOS Simulator)
        run: |
          cd QAudionEngine
          xcodebuild test \
            -scheme QAudionEngine \
            -destination '${{ steps.sim.outputs.dest }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tail -50
