name: QAudionEngine Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve dependencies
        run: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        run: |
          cd QAudionEngine
          swift build
      - name: Run Tests (macOS)
        run: |
          cd QAudionEngine
          swift test
