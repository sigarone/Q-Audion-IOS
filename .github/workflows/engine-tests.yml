name: QAudionEngine Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Resolve dependencies
        run: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        run: |
          cd QAudionEngine
          swift build 2>&1 | tail -100
      - name: Run Tests (macOS)
        run: |
          cd QAudionEngine
          swift test 2>&1 | tail -100
