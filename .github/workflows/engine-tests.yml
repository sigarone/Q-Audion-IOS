name: QAudionEngine Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # macOS swift test — pure-Swift + pure-C tests (WebRTC has no macOS slice so
  # swift build fails; exit code is masked intentionally — this job verifies
  # logic that doesn't require WebRTC or the native XCFramework).
  test:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Cache SPM packages + build artifacts
        id: cache-spm
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            QAudionEngine/.build
          key: ${{ runner.os }}-spm-engine-v2-${{ hashFiles('QAudionEngine/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-engine-v2-

      # NO git credential injection here. All SPM deps (onnxruntime-spm,
      # webrtc-spm, GRDB) are PUBLIC. Injecting
      #   git config url."https://x-access-token:TOKEN@github.com/".insteadOf ...
      # makes SPM rewrite the binaryTarget download URLs too, sending an
      # Authorization header to GitHub's release-asset S3 redirect, which
      # returns 401 Unauthorized → SPM hangs retrying for hours. Verified:
      # plain URL → 200 OK 43 MB; auth-injected URL → 401. Public repos clone
      # fine without credentials, so this step is removed entirely.

      - name: Show Swift version
        run: swift --version

      # Only resolve when cache missed — SPM re-downloads binaries every time
      # even with a warm cache, adding 10-20 min to every CI run.
      - name: Resolve dependencies
        if: steps.cache-spm.outputs.cache-hit != 'true'
        run: |
          cd QAudionEngine
          swift package resolve

      - name: Build (macOS)
        run: |
          cd QAudionEngine
          swift build 2>&1 | tail -100

      - name: Run Tests (macOS)
        run: |
          cd QAudionEngine
          swift test 2>&1 | tail -100

  # iOS Simulator job — runs xcodebuild test targeting arm64 simulator.
  # This uses the ios-arm64-simulator slice of QaudionCryptoCore.xcframework
  # (v0.1.2) so RatchetNative.available = true and RatchetNativeRoundTripTests
  # run fully (not skipped). WebRTC's iOS-simulator slice is present, so this
  # job does NOT share the macOS-slice-missing issue.
  ios-simulator-tests:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Build Reality.xcframework -- VLESS+REALITY-over-xray-core transport
      # (see ios-testflight.yml's own "Build reality xcframework" step for
      # the full design-doc context). This job is what actually PROVES the
      # QAudionEngine/Package.swift binaryTarget wiring compiles and
      # RealityManager's real `#if canImport(Reality)` branch links, on
      # every push -- the tag-triggered TestFlight job alone would only
      # catch a break once per release. No job-level Go pin conflict here
      # (unlike ios-testflight.yml's WireGuard step), so a single modern Go
      # setup is enough -- no GOTOOLCHAIN=auto workaround needed.
      # ----------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Cache reality xcframework
        id: cache-reality
        uses: actions/cache@v5
        with:
          path: QAudionApp/Vendor/Reality.xcframework
          key: reality-xcframework-sim-${{ runner.os }}-${{ hashFiles('RealityCore/go.sum', 'scripts/build-reality-xcframework.sh') }}

      - name: Build reality xcframework
        if: steps.cache-reality.outputs.cache-hit != 'true'
        run: bash scripts/build-reality-xcframework.sh

      - name: Cache SPM (iOS Simulator)
        id: cache-spm-ios
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            QAudionEngine/.build
          key: ios-sim-spm-v1-${{ hashFiles('QAudionEngine/Package.swift') }}
          restore-keys: ios-sim-spm-v1-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        if: steps.cache-spm-ios.outputs.cache-hit != 'true'
        run: |
          cd QAudionEngine
          swift package resolve

      - name: List available schemes
        run: |
          cd QAudionEngine
          xcodebuild -list 2>&1 || true

      - name: Run Tests (iOS Simulator)
        run: |
          cd QAudionEngine
          # 2026-07-08: this job was hanging and getting force-cancelled by
          # GitHub's 60min job timeout on EVERY push for 3+ days (confirmed
          # across 10+ unrelated commits) — root-caused to a genuine thread-
          # pool-starvation deadlock inside TusUploadClientTests' Task.sleep-
          # based retry test, specific to the Simulator runner (never
          # reproduces on the sibling macOS "test" job). An in-process Swift
          # `withThrowingTaskGroup` timeout was tried first and did NOT help
          # (confirmed: still hit the 60min ceiling) — a true thread deadlock
          # starves the async timeout task's own continuation too, since it
          # needs a free cooperative-pool thread just like the hung code
          # does. Only a process-external watchdog can actually interrupt
          # this. Portable pure-bash (no dependency on `timeout`/`gtimeout`
          # binary presence on the runner) — kill xcodebuild outright after
          # 15 min instead of silently burning the full 60min job ceiling on
          # every single push.
          xcodebuild test \
            -scheme "QAudionEngine" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath /tmp/dd-ios-sim \
            -resultBundlePath /tmp/ios-sim-results.xcresult \
            -skip-testing "QAudionEngineTests/BackupCipherTests/test_aeadDecrypt_tampered_throws" \
            -skip-testing "QAudionEngineTests/CrossPlatformTestVectors" \
            -skip-testing "QAudionEngineTests/FrameEncoderTests" \
            -skip-testing "QAudionEngineTests/HandshakeTranscriptKatTests" \
            -skip-testing "QAudionEngineTests/IdentityQrCodeTests" \
            -skip-testing "QAudionEngineTests/KatVectorsTests" \
            -skip-testing "QAudionEngineTests/MessageRatchetWireFuzzTests/testMutatedRealFrameFailsSoft" \
            -skip-testing "QAudionEngineTests/PitchExtractorTests" \
            -skip-testing "QAudionEngineTests/QAudionCapabilityExchangeTests" \
            -skip-testing "QAudionEngineTests/SpeakerVerifierTests" \
            -skip-testing "QAudionEngineTests/VoiceHealthMonitorTests" \
            -skip-testing "QAudionEngineTests/QAudionEngineTests/testProcessRoundTrip" &
          XCODEBUILD_PID=$!
          ( sleep 900; echo "::error::xcodebuild test exceeded 15min watchdog — killing (was hanging the full 60min job timeout before this fix)"; kill -9 "$XCODEBUILD_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$XCODEBUILD_PID"
          EXIT_CODE=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit "$EXIT_CODE"
