# GitHub Actions -- self-tests of the iOS release gates.
#
# Two jobs. `gates` runs on ubuntu (seconds, no macOS minutes) and covers everything below
# except the macOS repeat of the signing key check. `signing-key-macos` is the one macOS job:
# a short run of the signing key check against the OpenSSL builds of a
# macOS image.
#
# What the `gates` job covers, none of which needs a Mac:
#   * the earbud hardware stack is a compile-time switch (QAUDION_EARBUD, see
#     QAudionApp/project-earbud.yml). scripts/ci/check_earbud_gating.py proves on the SOURCES that
#     with the flag off no symbol of the stack is left in code the compiler would see, and that the
#     default spec, the earbud specs and ios-testflight.yml's EARBUD_BUILD wiring are as expected;
#     its tests include mutations of the real sources. scripts/ci/test-assert-no-earbud.sh is the
#     self-test of the BINARY gate (the real gate runs on the built app in ios-app-tests.yml and on
#     the shipped IPA in ios-testflight.yml).
#   * the CarPlay scene is a compile-time switch (QAUDION_CARPLAY, see QAudionApp/project-carplay.yml).
#     scripts/ci/check_carplay_gating.py proves on the SOURCES that the flag is set only by the variant spec,
#     that no entitlements file carries a CarPlay key, that ios-testflight.yml never builds the variant, that
#     every CarPlay reference is inside the flag, and that no car-screen text points at the phone; its tests
#     include mutations of the real files. The built app is checked on macOS by ios-app-tests.yml.
#   * every Siri intent the Intents extension declares (IntentsSupported in QAudionIntents/Info.plist) has
#     example phrases that name the app in every QAudionApp/<lang>.lproj/AppIntentVocabulary.plist, the
#     vocabulary of the development language included. scripts/ci/check_siri_intent_phrases.py reads the
#     property lists; its tests cover a missing intent, a missing language, empty examples, a missing app
#     name and a stale entry.
#   * the audio wire policy on the RTP sender (a fixed 32 kbps / packet time pin, applied when the sender is
#     created and after every negotiation, no adaptive packet time anywhere) is exercised on the simulator by
#     the engine tests; scripts/ci/check_audio_wire_shape.py proves on the sources that it is still wired.
#   * dSYMs are uploaded encrypted (the repository is public): scripts/ci/install-age.sh installs the
#     pinned age release after checking its SHA-256 (the test downloads it for real and also feeds it
#     a tampered tarball), scripts/ci/encrypt-dsyms.sh and the recipient committed in
#     ios-testflight.yml are tested with throwaway keys, and scripts/test_symbolicate_decrypt.py tests
#     the decrypting side of scripts/symbolicate.py.
#
#   * the Xcode selector used by every macOS workflow (scripts/ci/select-xcode.sh) is run against
#     fake /Applications trees shaped like the runner images: only release installs are chosen,
#     an alias of a release candidate is not, and nothing matching is a failure.
#   * the simulator picker (scripts/ci/resolve_simulator.py) on simulator lists shaped like the
#     Xcode 27 image.
#   * the check of the distribution signing key (scripts/ci/check-signing-key.sh, used by
#     ios-testflight.yml) runs against throwaway keys with the OpenSSL of this image, and the job
#     signing-key-macos repeats it on a macOS image, with the default openssl and (report only)
#     with every OpenSSL build that image carries. The openssl command lines of the signing tools
#     (provisioning profile read, certificate container unwrap) are exercised report-only too.
#     Only throwaway keys are used, never a key of the repository.
#
# Needs network access to github.com for the age release only. No secrets.

name: iOS CI gates (self-tests)

on:
  pull_request:
    branches: [main]
    paths:
      - 'QAudionApp/**'
      - 'QAudionAppTests/**'
      - 'QAudionEngine/**'
      - 'QAudionIntents/**'
      - 'QAudionPacketTunnel/**'
      - 'scripts/ci/**'
      - 'scripts/symbolicate.py'
      - 'scripts/test_symbolicate_decrypt.py'
      - '.github/workflows/ios-testflight.yml'
      - '.github/workflows/ios-ci-gates.yml'
  # No push trigger for main: every change reaches main through a pull request whose
  # checks are required, so a run on the merge commit would test the same code twice.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: iOS CI gates (self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The job does not write to the repository: no stored credentials.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Earbud stack, source gate and its tests
        run: |
          python3 -I scripts/ci/check_earbud_gating.py
          python3 -I scripts/ci/test_check_earbud_gating.py

      - name: Audio sender pin, source gate and its tests
        run: |
          python3 -I scripts/ci/check_audio_wire_shape.py
          python3 -I scripts/ci/test_check_audio_wire_shape.py

      - name: CarPlay scene, source gate and its tests
        run: |
          python3 -I scripts/ci/check_carplay_gating.py
          python3 -I scripts/ci/test_check_carplay_gating.py

      - name: Siri example phrases, source gate and its tests
        run: |
          python3 -I scripts/ci/check_siri_intent_phrases.py
          python3 -I scripts/ci/test_check_siri_intent_phrases.py

      - name: Earbud stack, binary gate self-test
        run: sh scripts/ci/test-assert-no-earbud.sh

      - name: Pinned age release installs and is verified by SHA-256
        run: sh scripts/ci/test-install-age.sh

      - name: Install age (same script as the release workflow)
        run: |
          # No pipe: `sh install-age.sh | tail -1` would hide an install failure (the pipe's status
          # is tail's, and set -e does not see the first command). pipefail stays on as a guard.
          set -eo pipefail
          DIR="$RUNNER_TEMP/age-bin"
          sh scripts/ci/install-age.sh "$DIR"
          test -x "$DIR/age"
          echo "$DIR" >> "$GITHUB_PATH"

      - name: dSYM encryption and the committed recipient
        run: sh scripts/ci/test-encrypt-dsyms.sh

      - name: symbolicate.py decrypts the dSYM artifact
        run: python3 -I scripts/test_symbolicate_decrypt.py

      - name: Xcode selector, self-test
        run: sh scripts/ci/test-select-xcode.sh

      - name: Simulator picker, tests
        run: python3 -I scripts/ci/test_resolve_simulator.py

      - name: Signing key check, self-test
        run: sh scripts/ci/test-check-signing-key.sh

      - name: openssl calls of the signing tools (report only)
        continue-on-error: true
        run: sh scripts/ci/test-openssl-signing-calls.sh

  # The same signing key check on a macOS image, where the openssl a workflow gets by name is
  # the one ios-testflight.yml runs. The images carry more than one OpenSSL build (3 now, 4 as
  # the default from November 2026); the default one has to pass, the others are reported.
  signing-key-macos:
    name: Signing key check (macOS OpenSSL)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: OpenSSL builds on this image
        run: |
          which -a openssl || true
          openssl version
          for b in /opt/homebrew/opt/openssl@*/bin/openssl /usr/bin/openssl; do
            [ -x "$b" ] && echo "$b: $("$b" version)"
          done
          exit 0

      - name: Signing key check, default openssl
        run: sh scripts/ci/test-check-signing-key.sh

      - name: Signing key check, every OpenSSL build (report only)
        continue-on-error: true
        run: |
          set --
          for b in /opt/homebrew/opt/openssl@*/bin/openssl /usr/bin/openssl; do
            [ -x "$b" ] && set -- "$@" "$b"
          done
          sh scripts/ci/test-check-signing-key.sh "$@"

      - name: openssl calls of the signing tools (report only)
        continue-on-error: true
        run: |
          set --
          for b in openssl /opt/homebrew/opt/openssl@*/bin/openssl; do
            command -v "$b" > /dev/null && set -- "$@" "$b"
          done
          sh scripts/ci/test-openssl-signing-calls.sh "$@"
