# GitHub Actions -- compile QAudionApp on every relevant PR and run the
# app-target unit tests that have a wired target.
#
# Why this exists (2026-09-30): engine-tests.yml is the only workflow that
# runs on PRs, and it only builds the QAudionEngine Swift package. Nothing
# compiled QAudionApp (the SwiftUI app, ~all of AppState / the views / the
# senders) until a v* tag hit ios-testflight.yml or someone dispatched
# ios-ui-smoke.yml by hand, so an app-side compile error surfaced at release
# time. And QAudionAppTests/ had no target at all in QAudionApp/project.yml,
# so none of those tests ever ran.
#
# Step 1 is the ios-ui-smoke.yml build recipe (Simulator, Debug, ad-hoc
# signing) for the default spec, project.yml, which has no VPN support; the
# scripts/ci/assert-no-vpn.sh gate then runs on the built app.
# Step 2 regenerates the project from QAudionApp/project-apptests.yml, which
# includes project.yml unchanged and adds an app-hosted unit-test bundle
# restricted to an explicit list of test files (the rest of QAudionAppTests/
# was written without a compiler and is not known to build). Extend both that
# list and the -only-testing list below together.
#
# The second job (vpn-variant-build) compiles the variant WITH VPN support
# (QAudionApp/project-vpn.yml: QAUDION_VPN, packet-tunnel extension,
# WireGuardKit) for a device destination, unsigned, so that code does not rot
# while the default build leaves it out.
#
# The third job (earbud-variant-build) does the same for the earbud hardware
# stack (QAudionApp/project-earbud.yml: QAUDION_EARBUD), plain and together with
# QAUDION_DEV_TOOLS (the earbud diagnostics screen), and checks that the specs
# combine as intended. The default build proves the opposite: step "No earbud
# hardware stack in the default build" runs scripts/ci/assert-no-earbud.sh on the
# built app. Both gates and the source check run again on every release.
#
# CarPlay is part of every build, so there is no variant job for it: step "CarPlay scene in the default build"
# reads the built app and requires the scene configuration, the framework and the entitlement, and
# scripts/ci/check_carplay_gating.py requires the same of the sources, the specs and the entitlements files.
#
# Runs on public-repo runners (free); no signing secrets, no network to any
# real backend: the tests are pure.

name: iOS App Build + App Tests

# The SPM cache below is written only from main (push, same paths as the pull
# request trigger, or a manual dispatch on main) and only read from pull
# requests. Before this, each pull request ref saved its own copy (about 1.2 GB)
# at the end of its first run, because main never held the entry (this workflow
# did not run on push), and those copies pushed the engine caches out of the
# repository's cache quota.
on:
  push:
    branches: [main]
    paths:
      - 'QAudionApp/**'
      - 'QAudionAppTests/**'
      - 'QAudionEngine/**'
      - 'QAudionIntents/**'
      - 'QAudionPacketTunnel/**'
      - 'scripts/ci/assert-no-vpn.sh'
      - 'scripts/ci/test-assert-no-vpn.sh'
      - 'scripts/ci/assert-no-earbud.sh'
      - 'scripts/ci/test-assert-no-earbud.sh'
      - 'scripts/ci/check_earbud_gating.py'
      - 'scripts/ci/check_carplay_gating.py'
      - 'scripts/ci/test_check_carplay_gating.py'
      - '.github/workflows/ios-app-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'QAudionApp/**'
      - 'QAudionAppTests/**'
      - 'QAudionEngine/**'
      - 'QAudionIntents/**'
      - 'QAudionPacketTunnel/**'
      - 'scripts/ci/assert-no-vpn.sh'
      - 'scripts/ci/test-assert-no-vpn.sh'
      - 'scripts/ci/assert-no-earbud.sh'
      - 'scripts/ci/test-assert-no-earbud.sh'
      - 'scripts/ci/check_earbud_gating.py'
      - 'scripts/ci/check_carplay_gating.py'
      - 'scripts/ci/test_check_carplay_gating.py'
      - '.github/workflows/ios-app-tests.yml'
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# every job here only checks the repository out and reads it. Caches and artifacts
# use the runner's own token, not GITHUB_TOKEN, so no other scope is needed.
permissions:
  contents: read

# A newer push to a pull request replaces the run in progress; a run on main is
# never cancelled, so the step that writes the cache on main always completes.
concurrency:
  group: ios-app-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-build-and-tests:
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      XCODE_PROJECT: QAudionApp.xcodeproj
      XCODE_VERSION: '27'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same selector as ios-testflight.yml / ios-ui-smoke.yml (newest installed Xcode 27 release).
      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # The newest iOS runtime does not carry every device, so the simulator is picked by UDID
      # (the highest iOS 26+ runtime that has it) instead of OS=latest.
      - name: Pick the simulator
        id: sim
        run: python3 -I scripts/ci/resolve_simulator.py "iPhone 17" --min-ios 26

      - name: Restore SPM packages
        id: cache-spm
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project (default spec, no VPN support)
        working-directory: QAudionApp
        run: |
          xcodegen generate
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      # Ad-hoc local signing, not CODE_SIGNING_ALLOWED=NO: see the note above
      # the same step in ios-ui-smoke.yml (entitlements must be embedded or
      # the app crashes on Siri authorization at launch).
      - name: Build QAudionApp for Simulator (compile check)
        working-directory: QAudionApp
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath /tmp/dd-ios-app \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build-sim.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-sim.log ==="; tail -300 build-sim.log; exit 1)

      # The warnings of the build are listed in the job summary, and the job fails when the
      # project's own sources (app, extensions, engine) hold more than the counted baseline in
      # scripts/ci/warning-baseline.txt (zero).
      - name: Compiler warnings of the build
        if: always()
        env:
          DIAG_OUT: ${{ runner.temp }}/diagnostics-app-build.txt
        run: sh scripts/ci/xcode-diagnostics-summary.sh "App build (Debug, simulator)" QAudionApp/build-sim.log

      - name: Warning baseline
        run: sh scripts/ci/check-warning-baseline.sh QAudionApp/build-sim.log

      # Only main writes the entry, and only when the exact key was not found;
      # pull requests read it and never save. The package cache is filled by
      # the build above, so this sits right after it and does not wait for the
      # tests.
      - name: Save SPM packages (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}

      # The gate's own self-test, then the gate on the app just built from the
      # default spec (Simulator Debug, ad-hoc signed so the entitlements are
      # embedded): no packet-tunnel extension, no Network Extension / vpn.api
      # entitlement, no NetworkExtension.framework load command, no WireGuard.
      - name: No VPN support in the default build
        run: |
          set -e
          sh scripts/ci/test-assert-no-vpn.sh
          APP="/tmp/dd-ios-app/Build/Products/Debug-iphonesimulator/QAudionApp.app"
          test -d "$APP"
          ls "$APP/PlugIns"
          sh scripts/ci/assert-no-vpn.sh "$APP"

      # The earbud hardware stack is a compile-time switch (QAUDION_EARBUD) and the default
      # spec does not compile it: the sources first (python, no build needed), the gate's own
      # self-test, then the gate on the app just built. A Debug build keeps the object file
      # paths of every compiled source in its debug map, including the empty ones of the
      # compiled-out files, which is why the gate matches the mangled class names.
      - name: No earbud hardware stack in the default build
        run: |
          set -e
          python3 -I scripts/ci/check_earbud_gating.py
          sh scripts/ci/test-assert-no-earbud.sh
          APP="/tmp/dd-ios-app/Build/Products/Debug-iphonesimulator/QAudionApp.app"
          test -d "$APP"
          sh scripts/ci/assert-no-earbud.sh "$APP"

      # CarPlay is part of every build: the sources first (python, no build needed), then the app just built. Its
      # Info.plist declares the CarPlay scene (role CPTemplateApplicationSceneSessionRoleApplication with the scene
      # delegate, multiple scenes on), the scene class is in the binary, CarPlay.framework is linked, and the app is
      # signed with the CarPlay Communication entitlement.
      - name: CarPlay scene in the default build
        run: |
          set -e
          python3 -I scripts/ci/check_carplay_gating.py
          python3 -I scripts/ci/test_check_carplay_gating.py
          APP="/tmp/dd-ios-app/Build/Products/Debug-iphonesimulator/QAudionApp.app"
          test -d "$APP"
          ROLE="UIApplicationSceneManifest.UISceneConfigurations.CPTemplateApplicationSceneSessionRoleApplication"
          plutil -p "$APP/Info.plist" | grep -A12 UIApplicationSceneManifest || true
          test "$(plutil -extract "$ROLE.0.UISceneDelegateClassName" raw -o - "$APP/Info.plist")" = "QAudionApp.CarPlaySceneDelegate"
          test "$(plutil -extract "$ROLE.0.UISceneConfigurationName" raw -o - "$APP/Info.plist")" = "QAudionCarPlay"
          test "$(plutil -extract UIApplicationSceneManifest.UIApplicationSupportsMultipleScenes raw -o - "$APP/Info.plist")" = "true"
          if [ -z "$(grep -rlaF '20CarPlaySceneDelegate' "$APP" | head -1)" ]; then
            echo "::error::the build does not contain the CarPlay scene delegate"
            exit 1
          fi
          # CarPlay.framework is a weak load command and not a strong one (the app may run as an iPad app on a Mac).
          LOADS=""
          for BIN in "$APP/QAudionApp.debug.dylib" "$APP/QAudionApp"; do
            if [ -f "$BIN" ]; then
              LOADS="$LOADS $(otool -l "$BIN" | awk '/cmd LC_/ {cmd=$2} /name .*CarPlay\.framework\/CarPlay/ {print cmd}' | tr '\n' ' ')"
            fi
          done
          echo "CarPlay load commands:${LOADS:- none}"
          case " $LOADS " in
            *" LC_LOAD_WEAK_DYLIB "*) ;;
            *) echo "::error::the build does not link CarPlay.framework weakly"; exit 1 ;;
          esac
          case " $LOADS " in
            *" LC_LOAD_DYLIB "*) echo "::error::CarPlay.framework is linked strongly"; exit 1 ;;
          esac
          # The Simulator build is ad-hoc signed: the entitlements are in the signature and in the binary.
          KEY=com.apple.developer.carplay-communication
          SIGNED=$(codesign -d --entitlements :- "$APP" 2>/dev/null | grep -c "$KEY" || true)
          EMBEDDED=$(grep -rlaF "$KEY" "$APP" | head -1)
          if [ "$SIGNED" = "0" ] && [ -z "$EMBEDDED" ]; then
            echo "::error::the build is not signed with the CarPlay Communication entitlement"
            exit 1
          fi

      - name: Generate Xcode project (with the app-test target)
        working-directory: QAudionApp
        run: |
          xcodegen generate --spec project-apptests.yml
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -30

      # -only-testing repeats the file list in project-apptests.yml on
      # purpose: a class that is added there but forgotten here (or the other
      # way round) should fail loudly instead of silently not running.
      - name: Run app-target unit tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # A run that stalls here (the 2026-10-04 stdout-tee feedback loop did, for the whole job cap) is cut after
        # 25 minutes instead of 60: a healthy run takes about a minute.
        timeout-minutes: 25
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme QAudionAppTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath /tmp/dd-ios-app \
            -parallel-testing-enabled NO \
            -only-testing:QAudionAppTests/AbuseReportCategoryTests \
            -only-testing:QAudionAppTests/AdaptiveLayoutPolicyTests \
            -only-testing:QAudionAppTests/AgeDeclarationTests \
            -only-testing:QAudionAppTests/AppLockServiceTests \
            -only-testing:QAudionAppTests/AppUpdateLinkTests \
            -only-testing:QAudionAppTests/AppStateFilesServerUrlTests \
            -only-testing:QAudionAppTests/AvatarAnnouncePolicyTests \
            -only-testing:QAudionAppTests/AvatarSentLedgerTests \
            -only-testing:QAudionAppTests/AvatarAnnounceCoordinatorTests \
            -only-testing:QAudionAppTests/AvatarContentHashTests \
            -only-testing:QAudionAppTests/AvatarImageGeometryTests \
            -only-testing:QAudionAppTests/AvatarImageIntegrityTests \
            -only-testing:QAudionAppTests/AvatarInboundApplierTests \
            -only-testing:QAudionAppTests/AvatarReceivedLedgerTests \
            -only-testing:QAudionAppTests/AvatarImageResizerTests \
            -only-testing:QAudionAppTests/AvatarSendCopyTests \
            -only-testing:QAudionAppTests/AvatarThumbnailTests \
            -only-testing:QAudionAppTests/BlockedContactsStoreTests \
            -only-testing:QAudionAppTests/BugReportFreezeTests \
            -only-testing:QAudionAppTests/BugReporterRetryQueueTests \
            -only-testing:QAudionAppTests/ChatVoiceNoteSenderMaxUsesTests \
            -only-testing:QAudionAppTests/CallCloseReasonRedactionTests \
            -only-testing:QAudionAppTests/CallMetricsRedactionTests \
            -only-testing:QAudionAppTests/CallMinimizePolicyTests \
            -only-testing:QAudionAppTests/SasCardPlacementTests \
            -only-testing:QAudionAppTests/CallerBusyOutcomeTests \
            -only-testing:QAudionAppTests/CallStartSupportTests \
            -only-testing:QAudionAppTests/CarPlayBridgeTests \
            -only-testing:QAudionAppTests/CarPlayListModelTests \
            -only-testing:QAudionAppTests/ConfidenceToneTests \
            -only-testing:QAudionAppTests/DesignSystemAccessibilityTests \
            -only-testing:QAudionAppTests/DeviceSymbolTests \
            -only-testing:QAudionAppTests/EarbudCompileConditionTests \
            -only-testing:QAudionAppTests/FeatureFlagKillSwitchTests \
            -only-testing:QAudionAppTests/FeatureFlagsTests \
            -only-testing:QAudionAppTests/FileV2ImageCleanerTests \
            -only-testing:QAudionAppTests/GlassPolicyTests \
            -only-testing:QAudionAppTests/IntentHandlerTests \
            -only-testing:QAudionAppTests/KmsSweepStatusTests \
            -only-testing:QAudionAppTests/LegalLinksTests \
            -only-testing:QAudionAppTests/LocationAppTests \
            -only-testing:QAudionAppTests/LocationShareCenterEndTests \
            -only-testing:QAudionAppTests/LocationShareCenterTests \
            -only-testing:QAudionAppTests/LocationShareIntentTests \
            -only-testing:QAudionAppTests/LogRedactorLocationTests \
            -only-testing:QAudionAppTests/MeshAudioRouteTests \
            -only-testing:QAudionAppTests/MeshConsentPresentationTests \
            -only-testing:QAudionAppTests/MeshConsentTests \
            -only-testing:QAudionAppTests/MeshReachTests \
            -only-testing:QAudionAppTests/MessageSoundSettingsTests \
            -only-testing:QAudionAppTests/MissedCallsBadgeTests \
            -only-testing:QAudionAppTests/NoticeServiceTests \
            -only-testing:QAudionAppTests/RemoteMessageAlertPolicyTests \
            -only-testing:QAudionAppTests/RemoteMessageAlertCleanerTests \
            -only-testing:QAudionAppTests/PhonebookImportGateTests \
            -only-testing:QAudionAppTests/PersistentCallRecordStoreTests \
            -only-testing:QAudionAppTests/ProximityPairingTelemetryRedactionTests \
            -only-testing:QAudionAppTests/QuickActionTests \
            -only-testing:QAudionAppTests/RegistrationUnavailableMappingTests \
            -only-testing:QAudionAppTests/RecoveryEnrollmentStatusTests \
            -only-testing:QAudionAppTests/ReKeyAvatarRingTests \
            -only-testing:QAudionAppTests/RuntimeLogSinkTeeTests \
            -only-testing:QAudionAppTests/SiriIntentPolicyTests \
            -only-testing:QAudionAppTests/TrustEvaluationModelTests \
            -only-testing:QAudionAppTests/VoiceDisplayFormatTests \
            -only-testing:QAudionAppTests/VoiceGuardModelTests \
            -only-testing:QAudionAppTests/VoiceToneRowTests \
            -only-testing:QAudionAppTests/VoiceWordTests \
            -resultBundlePath /tmp/app-tests.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee app-tests.log \
          || (echo ""; echo "=== TESTS FAILED -- last 300 lines of app-tests.log ==="; tail -300 app-tests.log; exit 1)

      # The host app tees stdout/stderr, which swallows XCTest's per-case
      # lines from the step above, so read the result bundle instead and
      # refuse a "green" run that executed nothing.
      - name: Check app-target test results
        run: |
          set -e
          xcrun xcresulttool get test-results summary --path /tmp/app-tests.xcresult | tee /tmp/app-tests-summary.json
          PASSED=$(grep -oE '"passedTests"[^0-9]*[0-9]+' /tmp/app-tests-summary.json | grep -oE '[0-9]+$' | head -1)
          FAILED=$(grep -oE '"failedTests"[^0-9]*[0-9]+' /tmp/app-tests-summary.json | grep -oE '[0-9]+$' | head -1)
          echo "passed=${PASSED:-?} failed=${FAILED:-?}"
          if [ -z "$PASSED" ] || [ "$PASSED" -eq 0 ] || [ "${FAILED:-0}" -ne 0 ]; then
            echo "::error::app-target tests did not run cleanly (passed=${PASSED:-?} failed=${FAILED:-?})"
            exit 1
          fi

      # 2026-10-03 — diagnostic: the executed app-target cases by name (the summary above only counts them).
      - name: List the executed app-target test cases (xcresult)
        if: always()
        run: |
          python3 ../scripts/ci/xcresult_test_list.py /tmp/app-tests.xcresult /tmp/app-test-cases.txt \
            CallerBusyOutcomeTests MissedCallsBadgeTests PersistentCallRecordStoreTests ConfidenceToneTests || true
        working-directory: QAudionApp

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-tests-logs-${{ github.run_number }}
          path: |
            QAudionApp/build-sim.log
            QAudionApp/app-tests.log
            /tmp/app-test-cases.txt
          retention-days: 7
          if-no-files-found: ignore

  # The variant WITH VPN support. Device destination, unsigned: libwg-go.a (built
  # by the QAudionPacketTunnel script phase, needs Go) has no Simulator slice.
  vpn-variant-build:
    # Not on push to main: that run exists to write the SPM cache (the other
    # job does it) and this variant was already built on the pull request.
    if: github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      XCODE_PROJECT: QAudionApp.xcodeproj
      XCODE_VERSION: '27'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # Read only: the entry is written by the other job, on main.
      - name: Restore SPM packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      # QAudionVPN.entitlements must stay equal to QAudion.entitlements plus the
      # Network Extension key and the App Group shared with the extension.
      - name: Entitlements variants agree
        run: |
          python3 - <<'PY'
          import plistlib
          default = plistlib.load(open("QAudionApp/QAudion.entitlements", "rb"))
          vpn = plistlib.load(open("QAudionApp/QAudionVPN.entitlements", "rb"))
          ne = "com.apple.developer.networking.networkextension"
          groups = "com.apple.security.application-groups"
          vpn_group = "group.com.bcrypto.qaudion.vpn"
          assert ne not in default, "default entitlements must not carry the Network Extension key"
          assert vpn_group not in default.get(groups, []), "default entitlements must not carry the VPN App Group"
          assert ne in vpn and vpn_group in vpn[groups], "VPN entitlements lack the Network Extension key or App Group"
          rest = {k: v for k, v in vpn.items() if k != ne}
          rest[groups] = [g for g in rest[groups] if g != vpn_group]
          assert rest == default, "entitlements differ beyond the VPN additions: %r vs %r" % (rest, default)
          print("entitlement variants agree")
          PY

      - name: Generate Xcode project (VPN spec)
        working-directory: QAudionApp
        run: |
          xcodegen generate --spec project-vpn.yml
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      - name: Build QAudionApp with VPN support (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-vpn \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-vpn.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-vpn.log ==="; tail -300 build-vpn.log; exit 1)

      # The extension is embedded and the VPN code is really compiled in.
      - name: Check the VPN variant contents
        run: |
          set -e
          APP="/tmp/dd-ios-vpn/Build/Products/Debug-iphoneos/QAudionApp.app"
          test -d "$APP/PlugIns/QAudionPacketTunnel.appex"
          ls "$APP/PlugIns"
          test -n "$(grep -rlaF 'wg_private_key_b64' "$APP" | head -1)"

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-vpn-variant-logs-${{ github.run_number }}
          path: QAudionApp/build-vpn.log
          retention-days: 7
          if-no-files-found: ignore

  # The variant WITH the earbud hardware stack (QAUDION_EARBUD). It needs no extension, no
  # framework and no Go, so a device destination without signing is enough. Built twice: plain
  # (what ios-testflight.yml dispatched with earbud=true produces) and together with
  # QAUDION_DEV_TOOLS, which adds the earbud diagnostics screen that drives the same code.
  earbud-variant-build:
    # Not on push to main: that run exists to write the SPM cache (the first job does it) and
    # this variant was already built on the pull request.
    if: github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      XCODE_PROJECT: QAudionApp.xcodeproj
      XCODE_VERSION: '27'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # Read only: the entry is written by the first job, on main.
      - name: Restore SPM packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      # Sources and specs: the default spec never mentions the flag, the earbud specs set it, the
      # combined spec is the union of the VPN and earbud flags.
      - name: Earbud gating (sources and specs)
        run: python3 -I scripts/ci/check_earbud_gating.py

      # XcodeGen cannot stack two specs given on the command line, so the VPN + earbud
      # combination has a spec of its own (project-vpn-earbud.yml, which includes
      # project-vpn.yml). Check that the include really merges the flags the way the file says:
      # each spec must resolve to exactly its own set, on the generated project.
      - name: Specs resolve to the intended compilation conditions
        working-directory: QAudionApp
        run: |
          set -e
          # The compilation conditions are read from the generated project itself (the
          # OTHER_SWIFT_FLAGS lines of project.pbxproj): no package resolution needed.
          flags_of() {
            xcodegen generate --spec "$1" >/dev/null
            grep -E 'OTHER_SWIFT_FLAGS' "$XCODE_PROJECT/project.pbxproj" | sort -u | tr -s ' 	' ' ' || true
          }
          DEFAULT=$(flags_of project.yml)
          EARBUD=$(flags_of project-earbud.yml)
          VPN=$(flags_of project-vpn.yml)
          BOTH=$(flags_of project-vpn-earbud.yml)
          echo "default:    $DEFAULT"
          echo "earbud:     $EARBUD"
          echo "vpn:        $VPN"
          echo "vpn+earbud: $BOTH"
          case "$DEFAULT" in *QAUDION_EARBUD*|*QAUDION_VPN*) echo "::error::the default spec sets a feature flag"; exit 1;; esac
          case "$EARBUD" in *-DQAUDION_EARBUD*) ;; *) echo "::error::project-earbud.yml does not set -DQAUDION_EARBUD"; exit 1;; esac
          case "$EARBUD" in *QAUDION_VPN*) echo "::error::project-earbud.yml turns the VPN on"; exit 1;; esac
          case "$VPN" in *-DQAUDION_VPN*) ;; *) echo "::error::project-vpn.yml does not set -DQAUDION_VPN"; exit 1;; esac
          case "$VPN" in *QAUDION_EARBUD*) echo "::error::project-vpn.yml turns the earbud stack on"; exit 1;; esac
          case "$BOTH" in *-DQAUDION_VPN*-DQAUDION_EARBUD*|*-DQAUDION_EARBUD*-DQAUDION_VPN*) ;; *) echo "::error::project-vpn-earbud.yml does not set both flags"; exit 1;; esac

      - name: Generate Xcode project (earbud spec)
        working-directory: QAudionApp
        run: |
          xcodegen generate --spec project-earbud.yml
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      - name: Build QAudionApp with the earbud stack (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-earbud \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-earbud.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-earbud.log ==="; tail -300 build-earbud.log; exit 1)

      # The stack is really compiled in (class and service UUID found); this is also the positive
      # control for the signatures that assert-no-earbud.sh looks for in the default build.
      - name: Check the earbud variant contents
        run: |
          set -e
          APP="/tmp/dd-ios-earbud/Build/Products/Debug-iphoneos/QAudionApp.app"
          test -d "$APP"
          sh scripts/ci/assert-no-earbud.sh --require-present "$APP"

      # With the dev tools too, the earbud diagnostics screen (EarbudDiagScreen, which is compiled
      # only with both conditions) builds and is in the binary. The command line replaces the
      # target's compilation conditions, which in project.yml are just $(inherited).
      - name: Build QAudionApp with the earbud stack and the dev tools (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-earbud-dev \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) QAUDION_DEV_TOOLS' \
            2>&1 | tee build-earbud-dev.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-earbud-dev.log ==="; tail -300 build-earbud-dev.log; exit 1)

      - name: Check the earbud + dev tools variant contents
        run: |
          set -e
          APP="/tmp/dd-ios-earbud-dev/Build/Products/Debug-iphoneos/QAudionApp.app"
          test -d "$APP"
          sh scripts/ci/assert-no-earbud.sh --require-present "$APP"
          test -n "$(grep -rlaF '19EarbudDiagViewModel' "$APP" | head -1)"

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-earbud-variant-logs-${{ github.run_number }}
          path: |
            QAudionApp/build-earbud.log
            QAudionApp/build-earbud-dev.log
          retention-days: 7
          if-no-files-found: ignore

  # The Release configuration of the default build, the one the TestFlight archive uses
  # (optimised, whole-module): it reports warnings that a Debug build does not. Device
  # destination, unsigned. Held to the same counted baseline as the Debug build.
  release-config-build:
    if: github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      XCODE_PROJECT: QAudionApp.xcodeproj
      XCODE_VERSION: '27'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # Read only: the entry is written by the other job, on main.
      - name: Restore SPM packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project (default spec)
        working-directory: QAudionApp
        run: xcodegen generate

      - name: Build QAudionApp, Release (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-release \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-release.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-release.log ==="; tail -300 build-release.log; exit 1)

      - name: Compiler warnings of the Release build
        if: always()
        env:
          DIAG_OUT: ${{ runner.temp }}/diagnostics-release-build.txt
        run: sh scripts/ci/xcode-diagnostics-summary.sh "App build (Release, device)" QAudionApp/build-release.log

      - name: Warning baseline
        run: sh scripts/ci/check-warning-baseline.sh QAudionApp/build-release.log
