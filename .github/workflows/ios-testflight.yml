# GitHub Actions — Q-Audion iOS TestFlight build pipeline.
#
# THIS IS THE ACTIVE iOS BUILD PIPELINE. Codemagic was decommissioned
# 2026-05-06 (codemagic.yaml removed from the repo). Xcode Cloud was
# evaluated (see XCODE_CLOUD_MIGRATION.md) but never adopted. The
# ci_scripts/ directory is unused dead code — only this file is wired
# into the runner. See CLAUDE.md § "CI / BUILD PLATFORM" for the
# authoritative description.
#
# This workflow uses the `codemagic-cli-tools` Python package (a CLI
# library for App Store Connect API + keychain helpers) inside the
# macOS runner. That is NOT the Codemagic hosted-build service — the
# build itself runs on GitHub Actions' macos-latest runner.
#
# Bash steps are intentionally close to the old codemagic.yaml so the
# Hard-won lessons in CLAUDE.md (sec 1-15) stay directly applicable.
#
# Trigger: push of a tag matching `v*` (same as Codemagic).
# Runner:  macos-14 (Apple Silicon) — Xcode 15.x default; pin via
#          `sudo xcode-select -s /Applications/Xcode_X.Y.app` if needed.
#
# Required GitHub Secrets (mirror Codemagic asc_credentials env group):
#   - APP_STORE_CONNECT_KEY_IDENTIFIER  : Admin-role API key ID
#   - APP_STORE_CONNECT_ISSUER_ID       : ASC issuer UUID
#   - APP_STORE_CONNECT_PRIVATE_KEY     : .p8 file content (full text)
#   - CERTIFICATE_PRIVATE_KEY           : Distribution cert RSA 2048 PEM
#
# Configure these at:
#   github.com/sigarone/Q-Audion-IOS/settings/secrets/actions
#
# Free-tier note: macOS runners cost 10x credit multiplier on private
# repos (200 macOS minutes/month for free → ~40 builds at 5min each).
# For unlimited free macOS minutes, make the repo public (sensitive
# Q-Audion code is encrypted-by-design, but server URLs and bundle
# id would become discoverable).

name: TestFlight build

on:
  push:
    tags:
      - 'v*'
  # Allow manual triggers from the Actions tab for quick test runs.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.398). Leave empty to use HEAD.'
        required: false

jobs:
  build:
    # Apple requires Xcode 26 / iOS 26 SDK for App Store submissions
    # since 2026-04-28 (CLAUDE.md sec 12). Codemagic uses Xcode 26.4.
    # GH Actions: macos-26 runner ships Xcode 26.x by default; macos-15
    # often has 26.x as a non-default install path. Use macos-latest so
    # GitHub auto-bumps as new images roll out, and pin XCODE_VERSION
    # explicitly. Discovery step below fails fast if Xcode 26 missing.
    runs-on: macos-latest
    timeout-minutes: 150

    env:
      BUNDLE_ID: com.qaudion.app
      APP_APPLE_ID: '6762266299'
      XCODE_PROJECT: QAudionApp.xcodeproj
      # Pin to Xcode 26.x family — accept ANY 26.x minor version
      # available on the runner (the discovery step picks the latest
      # 26.x found in /Applications). Hard-pin to e.g. "26.4" if you
      # need deterministic builds across runner image rotations.
      XCODE_VERSION: '26'
      # Opt into Node.js 24 for JavaScript actions (setup-go etc.) to
      # silence the Node.js 20 deprecation warning. Node.js 20 support
      # on GH Actions runners ends 2026-09-16. Once upstream actions
      # (setup-go@v5, upload-artifact@v7 …) ship native Node 24 builds,
      # this env var can be removed.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      # ----------------------------------------------------------
      # 1) Checkout source. Fetch full history so the build can
      #    inspect tags + version metadata.
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ----------------------------------------------------------
      # 1b) Cache SPM packages (git repos + binary artifacts).
      #     save-always: true ensures partial downloads are cached
      #     even if the job times out or fails — so each run makes
      #     progress until the cache is fully warm.
      # ----------------------------------------------------------
      - name: Cache SPM packages
        id: cache-spm
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          # `save-always` is deprecated in cache@v5. The replacement is a
          # separate `Save SPM cache` step below using `if: always()`.
          restore-keys: |
            ${{ runner.os }}-spm-

      # ----------------------------------------------------------
      # 1c) NO git credential injection. All SPM deps are PUBLIC.
      #     The url.insteadOf token rewrite ALSO rewrites binaryTarget
      #     download URLs, sending an Authorization header to GitHub's
      #     release-asset S3 redirect → 401 Unauthorized → SPM hangs for
      #     hours retrying. Verified: plain URL → 200 OK; auth-injected
      #     URL → 401. Public repos clone fine without credentials.
      #     (Removed 2026-05-29 — root cause of CI binary-download hang.)
      # ----------------------------------------------------------

      # ----------------------------------------------------------
      # 2) Pin Xcode version. Adjust XCODE_VERSION env above.
      # ----------------------------------------------------------
      - name: Select Xcode
        run: |
          set -e
          echo "=== Runner OS ==="
          sw_vers
          echo ""
          echo "=== All Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          echo ""

          # Find the latest Xcode matching XCODE_VERSION prefix.
          # XCODE_VERSION="26" matches Xcode_26.0, _26.1, _26.4, etc.
          # Pick the highest version number (sort -V).
          PIN="${XCODE_VERSION}"
          MATCH=$(ls -d /Applications/Xcode_${PIN}*.app 2>/dev/null | sort -V | tail -1 || true)

          if [ -z "$MATCH" ]; then
            echo "❌ No Xcode matching '${PIN}*' found on this runner."
            echo "Apple requires Xcode 26+ since 2026-04-28 for App Store submissions."
            echo "Available Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi

          echo "Selecting: $MATCH"
          sudo xcode-select -s "$MATCH"
          echo ""
          echo "=== Active Xcode ==="
          xcodebuild -version
          xcrun swift --version 2>&1 | head -2 || true

      # ----------------------------------------------------------
      # 3) Install xcodegen + codemagic-cli-tools.
      #    codemagic-cli-tools provides `app-store-connect`,
      #    `xcode-project`, and `keychain` CLIs — same tools the
      #    codemagic.yaml steps invoke.
      # ----------------------------------------------------------
      - name: Install build tools
        run: |
          set -e
          # Install xcodegen if missing — runners have it sometimes,
          # sometimes not, depending on image rotation.
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

          # macOS runner enforces PEP 668 (externally-managed Python),
          # so we use pipx to install codemagic-cli-tools in an isolated
          # venv. pipx is preinstalled on macos-15+ runners — only
          # install if missing.
          if command -v pipx >/dev/null 2>&1; then
            echo "pipx already installed: $(pipx --version)"
          else
            brew install pipx
          fi

          # pipx ensurepath emits a noisy "already in PATH" warning when
          # rerun. Just inject the bin dir directly into GITHUB_PATH.
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install codemagic-cli-tools (idempotent: if already present
          # pipx prints a warning we don't care about; --force ignores
          # any existing install). We need this for keychain init,
          # app-store-connect signing-files fetch, and xcode-project.
          pipx install --force codemagic-cli-tools 2>&1 | grep -v "WARNING: Skipping setuptools" || true

      # ----------------------------------------------------------
      # 3b) Set up Go for WireGuard CGO cross-compilation.
      #     The QAudionPacketTunnel preBuildScript calls the
      #     WireGuardKitGo Makefile, which compiles api-apple.go into
      #     libwg-go.a using `CGO_ENABLED=1 GOOS=ios go build`. That
      #     requires a working Go toolchain in PATH at xcodebuild time.
      #     Go 1.21+ is required for iOS cross-compilation support.
      # ----------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      # ----------------------------------------------------------
      # 3c) Build quiche.xcframework — MASQUE CONNECT-UDP backend.
      #     Cached by QUICHE_REF so repeat builds skip the ~10 min
      #     cargo + BoringSSL compile. Produces QAudionApp/Vendor/
      #     quiche.xcframework (the `Cquiche` module imported by
      #     AppMasqueQuicheTransport). Runs BEFORE xcodegen so the
      #     project.yml framework reference resolves. macos runners
      #     ship rustup/cargo preinstalled.
      # ----------------------------------------------------------
      - name: Cache quiche xcframework
        id: cache-quiche
        uses: actions/cache@v5
        with:
          path: QAudionApp/Vendor/quiche.xcframework
          key: quiche-xcframework-${{ runner.os }}-0.22.0-${{ hashFiles('scripts/build-quiche-xcframework.sh') }}

      - name: Build quiche xcframework
        if: steps.cache-quiche.outputs.cache-hit != 'true'
        env:
          QUICHE_REF: '0.22.0'
        run: |
          set -e
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          bash scripts/build-quiche-xcframework.sh

      # ----------------------------------------------------------
      # 4) Generate the Xcode project from project.yml.
      # ----------------------------------------------------------
      - name: Generate Xcode project
        working-directory: QAudionApp
        run: |
          xcodegen generate
          echo "=== Schemes ==="
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      # ----------------------------------------------------------
      # 5) Bump marketing version + build number into Info.plist.
      #    Same pattern as codemagic.yaml — write directly via
      #    plutil because Info.plist hard-codes the values rather
      #    than referencing $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION).
      # ----------------------------------------------------------
      - name: Bump version
        working-directory: QAudionApp
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e
          # Marketing version from tag (strip leading "v" + any "-suffix").
          # Refuse to fall back to a hard-coded "1.0.0" — historical
          # incident 2026-05-07: a workflow_dispatch run with no `tag`
          # input produced TestFlight build "1.0.0 (54)" which polluted
          # the version timeline alongside proper 1.0.4xx builds and
          # had to be expired manually. Hard-fail here so the operator
          # gets an actionable error before the build runs.
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$GIT_TAG" ] || [ "$GIT_TAG" = "$GITHUB_REF" ]; then
            GIT_TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$GIT_TAG" ]; then
            echo "::error::No tag resolved. tag-push triggers set GITHUB_REF=refs/tags/v*; workflow_dispatch must fill the 'tag' input (e.g. v1.0.415). Refusing to upload a fallback version to TestFlight." >&2
            exit 1
          fi
          MARKETING_VERSION=$(echo "$GIT_TAG" | sed -E 's/^v//; s/-[A-Za-z].*$//')
          echo "Marketing version = $MARKETING_VERSION"

          # Build number = TestFlight latest + 1 (mirrors codemagic.yaml).
          set +e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ -z "$LATEST" ]; then
            echo "WARN: ASC fetch failed, falling back to commit count"
            LATEST=$(git rev-list --count HEAD)
          fi
          NEW_BUILD=$((LATEST + 1))
          echo "Build number = $NEW_BUILD"

          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" Info.plist
          plutil -replace CFBundleVersion            -string "$NEW_BUILD"        Info.plist

          # Sync extension version with the host. Apple validation rejects
          # archives where extension and host CFBundleVersion differ.
          EXT_PLIST="../QAudionPacketTunnel/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" "$EXT_PLIST"
          plutil -replace CFBundleVersion            -string "$NEW_BUILD"        "$EXT_PLIST"

          plutil -extract CFBundleShortVersionString raw -o - Info.plist
          plutil -extract CFBundleVersion             raw -o - Info.plist
          echo "--- extension ---"
          plutil -extract CFBundleVersion raw -o - "$EXT_PLIST"

      # ----------------------------------------------------------
      # 6) Set up signing — fetch or create Distribution cert + App
      #    Store provisioning profile via the ASC API. Same flow as
      #    codemagic.yaml.
      # ----------------------------------------------------------
      - name: Set up signing
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -e
          keychain initialize
          CERT_KEY_PATH=/tmp/dist_cert_key.pem
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          chmod 600 "$CERT_KEY_PATH"
          openssl rsa -in "$CERT_KEY_PATH" -noout -check && echo "private key OK"

          # Main app profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier

          # ── VPN extension: App Groups + Network Extensions ───────────────────
          # QAudionPacketTunnel.entitlements requires both capabilities.
          # fetch-signing-files --create creates the Bundle ID but NOT the
          # capabilities — the profile it produces has no entitlements, and
          # xcodebuild archive rejects it immediately (~3s failure) with:
          #   "requires a provisioning profile with the App Groups and
          #    Network Extensions features"
          #
          # Fix:
          #   Phase 1 — run fetch-signing-files to create/find the Bundle ID
          #             and (stale) profile; capture output to extract IDs.
          #   Phase 2 — enable APP_GROUPS + NETWORK_EXTENSIONS on the Bundle ID.
          #   Phase 3 — delete the stale profile (no capabilities) so --create
          #             makes a fresh one with capabilities in Phase 4.
          #   Phase 4 — re-run fetch-signing-files; new profile includes caps.
          EXT_BID="com.qaudion.app.packet-tunnel"

          # Phase 1: run first fetch so Bundle ID definitely exists; capture output.
          # We capture via a temp file because $() swallows ANSI colour codes
          # while still allowing tee to print to the step console.
          EXT_FETCH_TMP=$(mktemp)
          app-store-connect fetch-signing-files "$EXT_BID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier 2>&1 | tee "$EXT_FETCH_TMP" || true
          EXT_FETCH_OUT=$(cat "$EXT_FETCH_TMP")
          rm -f "$EXT_FETCH_TMP"

          # Strip ANSI codes so greps below see plain text regardless of
          # whether codemagic-cli-tools colourises its output.
          PLAIN=$(printf '%s\n' "$EXT_FETCH_OUT" | sed 's/\x1b\[[0-9;]*m//g')

          # Extract Bundle ID resource ID — two possible formats:
          #   new:      "Created Bundle ID XXXXXXXXXX"
          #   existing: "- Name identifier (XXXXXXXXXX)"
          EXT_BID_RES=$(printf '%s\n' "$PLAIN" \
            | grep -oE 'Created Bundle ID [A-Z0-9]{10}|Bundle ID [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$EXT_BID_RES" ]; then
            EXT_BID_RES=$(printf '%s\n' "$PLAIN" \
              | grep -F "com.qaudion.app.packet-tunnel" \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Extension Bundle ID res-id: ${EXT_BID_RES:-UNKNOWN}"

          # Extract Profile resource ID — two possible formats:
          #   new:      "Created Profile XXXXXXXXXX"
          #   reused:   "- IOS_APP_STORE ... (XXXXXXXXXX)"
          EXT_PROF_RES=$(printf '%s\n' "$PLAIN" \
            | grep -oE 'Created Profile [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$EXT_PROF_RES" ]; then
            EXT_PROF_RES=$(printf '%s\n' "$PLAIN" \
              | grep -E '^- IOS_APP_STORE' \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Extension Profile res-id: ${EXT_PROF_RES:-UNKNOWN}"

          # Phase 2: enable capabilities (idempotent — safe to re-run).
          # Diagnostic: print available bundle-ids subcommands on first run so
          # we can verify 'add-capability' exists if the command fails below.
          if [ -n "$EXT_BID_RES" ]; then
            echo "=== app-store-connect bundle-ids help (diagnostic) ==="
            app-store-connect bundle-ids --help 2>&1 | head -20 || true

            echo "Enabling APP_GROUPS on $EXT_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$EXT_BID_RES" --capabilities APP_GROUPS 2>&1 \
              && echo "  APP_GROUPS: done" \
              || echo "  APP_GROUPS: WARN (may already be enabled)"

            echo "Enabling NETWORK_EXTENSIONS on $EXT_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$EXT_BID_RES" --capabilities NETWORK_EXTENSIONS 2>&1 \
              && echo "  NETWORK_EXTENSIONS: done" \
              || echo "  NETWORK_EXTENSIONS: WARN"

            # Phase 3: delete stale profile (no capabilities) to force
            # fresh creation in Phase 4.
            if [ -n "$EXT_PROF_RES" ]; then
              echo "Deleting stale profile $EXT_PROF_RES (created without capabilities)..."
              app-store-connect profiles delete "$EXT_PROF_RES" 2>&1 \
                && echo "  Profile deleted." \
                || echo "  Profile delete WARN (may already be gone)"
            fi

            # Phase 4: re-create extension signing files. The profile will
            # now include APP_GROUPS + NETWORK_EXTENSIONS, satisfying the
            # entitlements file and allowing xcodebuild archive to proceed.
            echo "Re-creating extension signing files with capabilities..."
            app-store-connect fetch-signing-files "$EXT_BID" \
              --type IOS_APP_STORE \
              --create \
              --platform IOS \
              --certificate-key "@file:$CERT_KEY_PATH" \
              --strict-match-identifier
          else
            echo "WARNING: could not resolve Extension Bundle ID resource — archive may fail."
          fi

          keychain add-certificates
          xcode-project use-profiles --project "QAudionApp/$XCODE_PROJECT"

      # ----------------------------------------------------------
      # 7a) Build IPA. Identical command to codemagic.yaml.
      #     On failure: print full build.log to stdout so the
      #     error is visible in the GitHub Actions step UI without
      #     downloading the artifact.
      # ----------------------------------------------------------
      - name: Build IPA
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme QAudionApp 2>&1 | tee build.log \
          || (echo ""; echo "=== BUILD FAILED — full build.log ==="; cat build.log; exit 1)

      # ----------------------------------------------------------
      # 7b) Diagnose Swift compile errors ONLY when Build IPA fails.
      #     Previously this ran BEFORE Build IPA as a precaution (raw
      #     xcodebuild with CODE_SIGNING_ALLOWED=NO so Swift errors
      #     appear without xcbeautify filtering them away). That paid
      #     ~2:10 of full re-compilation on EVERY build, including
      #     green ones — ~22% of total wall time wasted when nothing
      #     is broken. By gating on `if: failure()`, the diag pass
      #     runs only when actually needed (the build-log tail above
      #     gives a first hint; this gives the full Swift output).
      #     See CLAUDE.md sec 13 for the type-checker timeout traps.
      # ----------------------------------------------------------
      - name: Diagnose Swift compile (raw xcodebuild)
        if: failure()
        working-directory: QAudionApp
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee diag.log | grep -E 'error:|warning:|note:' || true
          echo "--- diag.log tail ---"
          tail -50 diag.log

      - name: Upload diag.log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ github.run_number }}
          path: QAudionApp/diag.log
          retention-days: 7
          if-no-files-found: warn

      # ----------------------------------------------------------
      # 8) Patch onnxruntime.framework MinimumOSVersion + re-sign.
      #    See CLAUDE.md sec 4 for the full story. Currently 1.24.2.
      #    The plutil line forces 16.0 regardless of what the XCFramework
      #    Info.plist contains, so this step is version-agnostic.
      # ----------------------------------------------------------
      - name: Patch onnxruntime + re-sign
        run: |
          set -e
          IPA_PATH=$(find QAudionApp/build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"; exit 1
          fi
          WORK=$(mktemp -d)
          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/$IPA_PATH"

          # Patch onnxruntime.framework MinimumOSVersion (CLAUDE.md sec 4).
          FW="Payload/QAudionApp.app/Frameworks/onnxruntime.framework"
          if [ -d "$FW" ]; then
            plutil -replace MinimumOSVersion -string "16.0" "$FW/Info.plist"
          else
            echo "onnxruntime.framework not in IPA — skipping MinimumOSVersion patch"
          fi

          # Remove libquiche.a from the app bundle root.
          # Xcode 26 copies the static xcframework's .a into the bundle even with
          # embed:false in project.yml. Apple validation (altool 409) rejects any
          # standalone .a in the bundle. The symbols are already linked into the
          # QAudionApp binary; the .a copy is spurious and safe to delete.
          if [ -f "Payload/QAudionApp.app/libquiche.a" ]; then
            rm "Payload/QAudionApp.app/libquiche.a"
            echo "Removed spurious Payload/QAudionApp.app/libquiche.a"
          fi

          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
                     | awk -F'"' '/Apple Distribution|iPhone Distribution/ {print $2; exit}')

          if [ -d "$FW" ]; then
            codesign --force --sign "$IDENTITY" "$FW"
          fi

          ENT_FILE="$WORK/app.entitlements.plist"
          codesign -d --entitlements :- --xml "Payload/QAudionApp.app" > "$ENT_FILE" 2>/dev/null || true
          if [ ! -s "$ENT_FILE" ]; then
            codesign -d --entitlements :- "Payload/QAudionApp.app" > "$ENT_FILE" 2>/dev/null || true
          fi
          codesign --force --sign "$IDENTITY" --entitlements "$ENT_FILE" "Payload/QAudionApp.app"

          rm -f "$GITHUB_WORKSPACE/$IPA_PATH"
          zip -qr "$GITHUB_WORKSPACE/$IPA_PATH" Payload
          ls -lh "$GITHUB_WORKSPACE/$IPA_PATH"

      # ----------------------------------------------------------
      # 9) Upload to TestFlight Internal group "Q-Audion testers".
      # ----------------------------------------------------------
      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e
          IPA_PATH=$(find QAudionApp/build/ios/ipa -name "*.ipa" | head -1)

          # Use Apple's altool directly instead of `app-store-connect
          # publish --testflight`. Reason: the codemagic CLI's publish
          # action tries to submit the build for EXTERNAL TestFlight
          # beta review even when we only have an INTERNAL group. That
          # submission fails on "missing test info" and breaks the
          # workflow even though the upload + internal distribution
          # succeeded. altool upload is exactly what we need: the build
          # uploads, Apple processes it, internal testers see it
          # automatically. No beta review involved.
          #
          # Write the .p8 to a temp file (altool needs it on disk).
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo ""
          echo "✅ Upload complete. Build will appear in TestFlight Internal"
          echo "   group 'Q-Audion testers' automatically once Apple"
          echo "   finishes processing (~5-10 min)."

      # ----------------------------------------------------------
      # 10) Upload artifacts so the human can download IPA + dSYM
      #     even when running locally / for crash symbolication.
      # ----------------------------------------------------------
      - name: Upload artifacts
        if: always()
        # Non-fatal: this step runs AFTER the TestFlight altool upload
        # (step 9 above), so the IPA is already on App Store Connect by
        # the time we get here. A storage-quota hit must not turn an
        # otherwise-successful TestFlight build into a red CI run —
        # `continue-on-error: true` keeps the workflow green and lets
        # the human download the artifacts only when storage allows.
        # retention-days dropped 14 → 7 to be a good citizen now that
        # we've observed the org's quota cap fill up.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            QAudionApp/build/ios/ipa/*.ipa
            QAudionApp/build/ios/dsym/*.zip
            QAudionApp/build.log
          retention-days: 7
          if-no-files-found: warn
