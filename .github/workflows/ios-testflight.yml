# GitHub Actions -- Q-Audion iOS TestFlight build pipeline.
#
# THIS IS THE ACTIVE iOS BUILD PIPELINE. Codemagic was decommissioned
# 2026-05-06 (codemagic.yaml removed from the repo). Xcode Cloud was
# evaluated (see XCODE_CLOUD_MIGRATION.md) but never adopted. The
# ci_scripts/ directory is unused dead code -- only this file is wired
# into the runner. See CLAUDE.md ? "CI / BUILD PLATFORM" for the
# authoritative description.
#
# This workflow uses the `codemagic-cli-tools` Python package (a CLI
# library for App Store Connect API + keychain helpers) inside the
# macOS runner. That is NOT the Codemagic hosted-build service -- the
# build itself runs on GitHub Actions' macos-latest runner.
#
# Bash steps are intentionally close to the old codemagic.yaml so the
# Hard-won lessons in CLAUDE.md (sec 1-15) stay directly applicable.
#
# Trigger: push of a tag matching `v*` (same as Codemagic).
# Runner:  macos-14 (Apple Silicon) -- Xcode 15.x default; pin via
#          `sudo xcode-select -s /Applications/Xcode_X.Y.app` if needed.
#
# Required GitHub Secrets (mirror Codemagic asc_credentials env group):
#   - APP_STORE_CONNECT_KEY_IDENTIFIER  : Admin-role API key ID
#   - APP_STORE_CONNECT_ISSUER_ID       : ASC issuer UUID
#   - APP_STORE_CONNECT_PRIVATE_KEY     : .p8 file content (full text)
#   - CERTIFICATE_PRIVATE_KEY           : Distribution cert RSA 2048 PEM
#
# Configure these at:
#   github.com/sigarone/Q-Audion-IOS/settings/secrets/actions
#
# Free-tier note: macOS runners cost 10x credit multiplier on private
# repos (200 macOS minutes/month for free -> ~40 builds at 5min each).
# For unlimited free macOS minutes, make the repo public (sensitive
# Q-Audion code is encrypted-by-design, but server URLs and bundle
# id would become discoverable).
#
# --- Opt-in "dev tools" TestFlight build (workflow_dispatch only) ---------
# A normal tag push (`v*`) is UNCHANGED by this: QAUDION_DEV_TOOLS stays off,
# the store-readiness gates all run exactly as before. To get a build with
# the Settings "SVILUPPATORE" section (and every other TestFlight-facing
# surface normally compiled out) for internal testing, dispatch manually
# with the new `dev_tools` input set to true:
#
#   gh workflow run ios-testflight.yml -f tag=vX -f dev_tools=true
#
# `tag` must name an existing tag on main (same rule as any other manual
# dispatch -- see the "Bump version" step). What changes when dev_tools=true:
#   - QAUDION_DEV_TOOLS is injected into the QAudionApp target's
#     SWIFT_ACTIVE_COMPILATION_CONDITIONS before `xcodegen generate` runs
#     (see "Patch project.yml for dev tools build" step) -- app target only,
#     $(inherited) and any other condition (e.g. QAUDION_CARPLAY) untouched.
#   - The store-readiness gate that fails the build on TestFlight-only
#     strings (itms-beta:// / testflight.apple.com) in the shipped binary is
#     skipped -- that string IS expected to be present once dev tools are
#     compiled in. Every other gate (privacy manifests, the WebRTC
#     key-material logging gate) still runs and can still fail the build.
#   - The build number still comes from the normal ASC-latest+1 (or
#     commit-count fallback) logic, so it is always higher than, and never
#     collides with, any prior upload for this app -- dev or store. The
#     dSYM archive and the job step summary get a "-dev" marketing-version
#     suffix (display only; the actual CFBundleShortVersionString/
#     CFBundleVersion written to Info.plist are untouched, to avoid any
#     App Store Connect version-string validation surprises) so the two
#     kinds of build are never visually confused, and a loud `::warning::`
#     plus a job-summary banner remind whoever is looking at the run that
#     a dev_tools build must NEVER be submitted for App Store review.
# ---------------------------------------------------------------------------

name: TestFlight build

on:
  push:
    tags:
      - 'v*'
  # Allow manual triggers from the Actions tab for quick test runs.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.398). Leave empty to use HEAD.'
        required: false
      download_dsyms:
        description: 'Recover dSYMs from App Store Connect (expired-artifact rescue). Does NOT build/upload -- runs the fastlane recovery step only.'
        required: false
        type: boolean
        default: false
      dev_tools:
        description: 'DEV BUILD (internal testing only): compile in QAUDION_DEV_TOOLS (Settings "SVILUPPATORE" section + other TestFlight-facing surfaces) and skip the store-readiness TestFlight-strings gate. Never submit a build made with this on for App Store review. Ignored on a tag push -- workflow_dispatch only.'
        required: false
        type: boolean
        default: false

# Serialize the whole job across EVERY trigger (tag push AND workflow_dispatch,
# dev_tools or not) -- a single static group, not per-ref/per-tag. Reason: the
# "Bump version" step reads "latest TestFlight build number" from App Store
# Connect and writes latest+1; two runs in flight at once (e.g. a tag push
# landing while someone dispatches a dev_tools build) could read the SAME
# latest value and produce two builds claiming the same build number, which
# altool then either rejects as a redundant/duplicate binary or -- worse --
# silently races on who uploads first. `cancel-in-progress: false` is
# mandatory here: this queues a second run behind the first (never cancels
# it), so a tag build already uploading to TestFlight is never killed by a
# later dispatch (or another tag push) landing on top of it.
concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  build:
    # Apple requires Xcode 26 / iOS 26 SDK for App Store submissions
    # since 2026-04-28 (CLAUDE.md sec 12). Codemagic uses Xcode 26.4.
    # GH Actions: macos-26 runner ships Xcode 26.x by default; macos-15
    # often has 26.x as a non-default install path. Use macos-latest so
    # GitHub auto-bumps as new images roll out, and pin XCODE_VERSION
    # explicitly. Discovery step below fails fast if Xcode 26 missing.
    runs-on: macos-latest
    timeout-minutes: 150

    env:
      BUNDLE_ID: com.qaudion.app
      APP_APPLE_ID: '6762266299'
      XCODE_PROJECT: QAudionApp.xcodeproj
      # Pin to Xcode 26.x family -- accept ANY 26.x minor version
      # available on the runner (the discovery step picks the latest
      # 26.x found in /Applications). Hard-pin to e.g. "26.4" if you
      # need deterministic builds across runner image rotations.
      XCODE_VERSION: '26'
      # Opt into Node.js 24 for JavaScript actions (setup-go etc.) to
      # silence the Node.js 20 deprecation warning. Node.js 20 support
      # on GH Actions runners ends 2026-09-16. Once upstream actions
      # (setup-go@v5, upload-artifact@v7 ...) ship native Node 24 builds,
      # this env var can be removed.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # WebRTC key-material logging gate (scripts/ci/assert-no-key-logging.sh, step
      # "Assert no WebRTC key-material logging in the IPA" below).
      #   '1' = ENFORCE (current): the step fails the job, BEFORE the TestFlight upload, if
      #         any Mach-O in the app still contains the upstream WebRTC key-dump log strings,
      #         or if nothing could be scanned. Flipped on in the same PR that pinned the
      #         rebuilt WebRTC.xcframework / LiveKitWebRTC.xcframework
      #         (sigarone/webrtc-aes256-build, no-key-log.patch) in QAudionEngine/Package.swift
      #         + QAudionApp/project.yml.
      #   '0' = REPORT-ONLY: same scan, prints what it found, never fails the step or the
      #         release. Use it (one-line change) only to roll back to binaries that still
      #         carry the strings.
      WEBRTC_KEYLOG_GATE: '1'

    steps:
      # ----------------------------------------------------------
      # 1) Checkout source. Fetch full history so the build can
      #    inspect tags + version metadata.
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ----------------------------------------------------------
      # 1b) Cache SPM packages (git repos + binary artifacts).
      #     save-always: true ensures partial downloads are cached
      #     even if the job times out or fails -- so each run makes
      #     progress until the cache is fully warm.
      # ----------------------------------------------------------
      - name: Cache SPM packages
        id: cache-spm
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          # `save-always` is deprecated in cache@v5. The replacement is a
          # separate `Save SPM cache` step below using `if: always()`.
          restore-keys: |
            ${{ runner.os }}-spm-

      # ----------------------------------------------------------
      # 1c) NO git credential injection. All SPM deps are PUBLIC.
      #     The url.insteadOf token rewrite ALSO rewrites binaryTarget
      #     download URLs, sending an Authorization header to GitHub's
      #     release-asset S3 redirect -> 401 Unauthorized -> SPM hangs for
      #     hours retrying. Verified: plain URL -> 200 OK; auth-injected
      #     URL -> 401. Public repos clone fine without credentials.
      #     (Removed 2026-05-29 -- root cause of CI binary-download hang.)
      # ----------------------------------------------------------

      # ----------------------------------------------------------
      # 2) Pin Xcode version. Adjust XCODE_VERSION env above.
      # ----------------------------------------------------------
      - name: Select Xcode
        run: |
          set -e
          echo "=== Runner OS ==="
          sw_vers
          echo ""
          echo "=== All Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          echo ""

          # Find the latest Xcode matching XCODE_VERSION prefix.
          # XCODE_VERSION="26" matches Xcode_26.0, _26.1, _26.4, etc.
          # Pick the highest version number (sort -V).
          PIN="${XCODE_VERSION}"
          MATCH=$(ls -d /Applications/Xcode_${PIN}*.app 2>/dev/null | sort -V | tail -1 || true)

          if [ -z "$MATCH" ]; then
            echo "? No Xcode matching '${PIN}*' found on this runner."
            echo "Apple requires Xcode 26+ since 2026-04-28 for App Store submissions."
            echo "Available Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi

          echo "Selecting: $MATCH"
          sudo xcode-select -s "$MATCH"
          echo ""
          echo "=== Active Xcode ==="
          xcodebuild -version
          xcrun swift --version 2>&1 | head -2 || true

      # ----------------------------------------------------------
      # 3) Install xcodegen + codemagic-cli-tools.
      #    codemagic-cli-tools provides `app-store-connect`,
      #    `xcode-project`, and `keychain` CLIs -- same tools the
      #    codemagic.yaml steps invoke.
      # ----------------------------------------------------------
      - name: Install build tools
        run: |
          set -e
          # The macOS runner image ships an `aws/tap` that Homebrew now
          # refuses to trust, so EVERY brew command below prints a 12-line
          # "the following taps are not trusted" block and the job carries a
          # permanent yellow annotation. Nothing here installs anything from
          # that tap, so drop it rather than silence the check with
          # HOMEBREW_NO_REQUIRE_TAP_TRUST (which brew itself calls not
          # recommended, and which would also mask a tap we DID care about).
          #
          # Guarded and non-fatal on purpose: this is the release path. A
          # future runner image without that tap must not fail the build over
          # a cosmetic cleanup, hence the `|| true` under `set -e`.
          if brew tap 2>/dev/null | grep -qx "aws/tap"; then
            echo "Untapping aws/tap (unused here, and untrusted by brew)"
            brew untap aws/tap || true
          fi

          # Install xcodegen if missing -- runners have it sometimes,
          # sometimes not, depending on image rotation.
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

          # macOS runner enforces PEP 668 (externally-managed Python),
          # so we use pipx to install codemagic-cli-tools in an isolated
          # venv. pipx is preinstalled on macos-15+ runners -- only
          # install if missing.
          if command -v pipx >/dev/null 2>&1; then
            echo "pipx already installed: $(pipx --version)"
          else
            brew install pipx
          fi

          # pipx ensurepath emits a noisy "already in PATH" warning when
          # rerun. Just inject the bin dir directly into GITHUB_PATH.
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install codemagic-cli-tools (idempotent: if already present
          # pipx prints a warning we don't care about; --force ignores
          # any existing install). We need this for keychain init,
          # app-store-connect signing-files fetch, and xcode-project.
          pipx install --force codemagic-cli-tools 2>&1 | grep -v "WARNING: Skipping setuptools" || true

      # ----------------------------------------------------------
      # 3b) Set up Go for WireGuard CGO cross-compilation.
      #     The QAudionPacketTunnel preBuildScript calls the
      #     WireGuardKitGo Makefile, which compiles api-apple.go into
      #     libwg-go.a using `CGO_ENABLED=1 GOOS=ios go build`. That
      #     requires a working Go toolchain in PATH at xcodebuild time.
      #     Go 1.21+ is required for iOS cross-compilation support.
      # ----------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      # ----------------------------------------------------------
      # 3c) DEV BUILD opt-in (workflow_dispatch `dev_tools=true` only --
      #     never runs on a tag push, see the `if:` guard). Injects
      #     QAUDION_DEV_TOOLS into the QAudionApp TARGET ONLY (never the
      #     QAudionPacketTunnel / QAudionBroadcastExtension / QAudionIntents
      #     extension targets, which don't declare the flag at all) before
      #     `xcodegen generate` runs, so the generated .xcodeproj already has
      #     it. The regex isolates the "  QAudionApp:" block up to the next
      #     top-level target key and only edits the FIRST
      #     SWIFT_ACTIVE_COMPILATION_CONDITIONS line inside it (the real
      #     setting on line ~121; a later line matching the same text only
      #     appears inside a comment, which never starts with the bare
      #     keyword at column 0 of its stripped indentation, so it can't
      #     match). $(inherited) and any other already-present condition
      #     (e.g. QAUDION_CARPLAY on a branch that enables it) are preserved
      #     -- the new token is appended, nothing is replaced.
      # ----------------------------------------------------------
      - name: Patch project.yml for dev tools build (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dev_tools == 'true' }}
        working-directory: QAudionApp
        run: |
          set -e
          python3 - <<'PY'
          import re
          import sys

          path = "project.yml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          m = re.search(r'(?m)^  QAudionApp:\n(.*?)(?=^  [A-Za-z])', text, re.S)
          if not m:
              print("::error::could not locate QAudionApp target block in project.yml")
              sys.exit(1)
          block = m.group(1)

          line_re = re.compile(r'(?m)^(\s*SWIFT_ACTIVE_COMPILATION_CONDITIONS:\s*)(.*)$')
          lm = line_re.search(block)
          if not lm:
              print("::error::could not locate SWIFT_ACTIVE_COMPILATION_CONDITIONS in the QAudionApp target settings")
              sys.exit(1)

          tokens = lm.group(2).strip().split()
          if "QAUDION_DEV_TOOLS" in tokens:
              print("QAUDION_DEV_TOOLS already present in SWIFT_ACTIVE_COMPILATION_CONDITIONS -- no change")
          else:
              tokens.append("QAUDION_DEV_TOOLS")
              new_line = lm.group(1) + " ".join(tokens)
              block = block[:lm.start()] + new_line + block[lm.end():]
              text = text[:m.start(1)] + block + text[m.end(1):]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print("Injected QAUDION_DEV_TOOLS into the QAudionApp target's SWIFT_ACTIVE_COMPILATION_CONDITIONS")

          print("=== Resulting QAudionApp compilation-condition line ===")
          for l in block.splitlines():
              if "SWIFT_ACTIVE_COMPILATION_CONDITIONS" in l and not l.strip().startswith("#"):
                  print(l)
          PY
          echo "::warning::DEV TOOLS BUILD -- QAUDION_DEV_TOOLS is compiled in (Settings SVILUPPATORE section + TestFlight-facing surfaces enabled). This build must NEVER be submitted for App Store review."

      # ----------------------------------------------------------
      # 4) Generate the Xcode project from project.yml.
      # ----------------------------------------------------------
      - name: Generate Xcode project
        working-directory: QAudionApp
        run: |
          xcodegen generate
          echo "=== Schemes ==="
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      # ----------------------------------------------------------
      # 5) Bump marketing version + build number into Info.plist.
      #    Same pattern as codemagic.yaml -- write directly via
      #    plutil because Info.plist hard-codes the values rather
      #    than referencing $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION).
      # ----------------------------------------------------------
      - name: Bump version
        id: version
        working-directory: QAudionApp
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # SEC (Aikido, 2026-08-21): pass workflow_dispatch input via env,
          # never interpolate ${{ }} directly into the script — the ${{ }}
          # form splices raw text into the run: block BEFORE bash parses it,
          # so shell metacharacters in a malicious `tag` value would execute.
          # Referencing $TAG_INPUT below is a normal shell variable read —
          # its value can never be reinterpreted as script syntax.
          TAG_INPUT: ${{ github.event.inputs.tag }}
          # Same env-indirection rule for dev_tools (see SEC note above).
          DEV_TOOLS_INPUT: ${{ github.event.inputs.dev_tools }}
        run: |
          set -e
          # Marketing version from tag (strip leading "v" + any "-suffix").
          # Refuse to fall back to a hard-coded "1.0.0" -- historical
          # incident 2026-05-07: a workflow_dispatch run with no `tag`
          # input produced TestFlight build "1.0.0 (54)" which polluted
          # the version timeline alongside proper 1.0.4xx builds and
          # had to be expired manually. Hard-fail here so the operator
          # gets an actionable error before the build runs.
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$GIT_TAG" ] || [ "$GIT_TAG" = "$GITHUB_REF" ]; then
            GIT_TAG="$TAG_INPUT"
          fi
          if [ -z "$GIT_TAG" ]; then
            echo "::error::No tag resolved. tag-push triggers set GITHUB_REF=refs/tags/v*; workflow_dispatch must fill the 'tag' input (e.g. v1.0.415). Refusing to upload a fallback version to TestFlight." >&2
            exit 1
          fi
          MARKETING_VERSION=$(echo "$GIT_TAG" | sed -E 's/^v//; s/-[A-Za-z].*$//')
          echo "Marketing version = $MARKETING_VERSION"

          # Build number = TestFlight latest + 1 (mirrors codemagic.yaml).
          # 2026-06-23: bound the ASC API call with `timeout`. App Store Connect's
          # get-latest-testflight-build-number hung indefinitely (no client-side
          # timeout) during an ASC slowdown and wedged the build at this step for
          # 45+ min. `timeout 120` kills a hung call so the fallback runs. If the
          # runner lacks a `timeout` binary the command fails fast (rc=127) and we
          # ALSO fall back — safe either way. Fallback = commit count (monotonic,
          # > any prior build number) → valid TestFlight build (unique+increasing).
          # macOS has no GNU `timeout`; Homebrew coreutils on the runner
          # provides `gtimeout` (run 34701677262 logged rc=127 from the bare
          # name and silently fell back to the commit count). Prefer
          # gtimeout, accept timeout, run unbounded only if neither exists.
          TIMEOUT_BIN=$(command -v gtimeout || command -v timeout || true)
          set +e
          if [ -n "$TIMEOUT_BIN" ]; then
            LATEST=$("$TIMEOUT_BIN" 120 app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID")
          else
            echo "WARN: no gtimeout/timeout binary on runner — ASC lookup runs unbounded"
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID")
          fi
          rc=$?
          set -e
          BUILD_SOURCE="asc"
          if [ "$rc" -ne 0 ] || [ -z "$LATEST" ]; then
            # Fail CLOSED for a dev_tools dispatch instead of falling back to
            # the commit-count heuristic: that count is only guaranteed to be
            # HIGHER than every prior build number when every prior build was
            # also built from a strictly later commit on a linear main-branch
            # history. A dev dispatch breaks that assumption on purpose (e.g.
            # dispatching an OLDER tag for a quick internal build while newer
            # commits already exist on main), so `git rev-list --count HEAD`
            # here could be LOWER than a build number already on TestFlight --
            # exactly the collision this workflow exists to prevent. Refuse
            # rather than guess; a normal tag build keeps today's fallback.
            if [ "${DEV_TOOLS_INPUT:-false}" = "true" ]; then
              echo "::error::ASC get-latest-testflight-build-number failed/timed out (rc=$rc) on a dev_tools dispatch — refusing to fall back to the commit-count heuristic, which is not guaranteed to be higher than an already-uploaded build number for a non-HEAD tag. Re-run once App Store Connect is reachable." >&2
              exit 1
            fi
            LATEST=$(git rev-list --count HEAD)
            BUILD_SOURCE="commit-count"
            echo "::warning::ASC get-latest-testflight-build-number failed/timed out (rc=$rc) — falling back to commit count ($LATEST). Safe for the normal linear tag-on-main history this pipeline assumes; if history was rewritten/rebased, verify the upload step below doesn't report a redundant/duplicate binary."
          fi
          NEW_BUILD=$((LATEST + 1))
          echo "Build number = $NEW_BUILD (source: $BUILD_SOURCE)"
          echo "build_number_source=$BUILD_SOURCE" >> "$GITHUB_OUTPUT"

          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" Info.plist
          plutil -replace CFBundleVersion            -string "$NEW_BUILD"        Info.plist

          # Sync extension version with the host. Apple validation rejects
          # archives where extension and host CFBundleVersion differ.
          EXT_PLIST="../QAudionPacketTunnel/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" "$EXT_PLIST"
          plutil -replace CFBundleVersion            -string "$NEW_BUILD"        "$EXT_PLIST"

          # Same rule for the broadcast (screen-share) extension — its
          # Info.plist otherwise keeps a hardcoded placeholder version and
          # fails the same host/extension version-match validation.
          BCAST_PLIST="../QAudionBroadcastExtension/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" "$BCAST_PLIST"
          plutil -replace CFBundleVersion            -string "$NEW_BUILD"        "$BCAST_PLIST"

          # And the SiriKit Intents extension — it was the one extension
          # left out, so every archive warned "CFBundleVersion of an app
          # extension (1) must match ... (<build>)" (audit FIX-15).
          INTENTS_PLIST="../QAudionIntents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" "$INTENTS_PLIST"
          plutil -replace CFBundleVersion            -string "$NEW_BUILD"        "$INTENTS_PLIST"

          plutil -extract CFBundleShortVersionString raw -o - Info.plist
          plutil -extract CFBundleVersion             raw -o - Info.plist
          echo "--- extension ---"
          plutil -extract CFBundleVersion raw -o - "$EXT_PLIST"
          echo "--- broadcast extension ---"
          plutil -extract CFBundleVersion raw -o - "$BCAST_PLIST"

          # Expose the resolved version + build number as step outputs so the
          # dSYM-archival step below can name its artifact by version
          # (dsyms-<MARKETING_VERSION>) for later `gh run download` lookup.
          # Additive only -- reads values already written to Info.plist above.
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD"             >> "$GITHUB_OUTPUT"

          # DEV BUILD identification. The build number above is already
          # guaranteed unique and higher than any prior upload (ASC
          # latest+1, or the monotonic commit count as fallback) regardless
          # of dev_tools -- re-dispatching the SAME tag with dev_tools=true
          # cannot collide with, or be mistaken for, an earlier upload of
          # that tag purely on build number. What it CAN still be confused
          # with is the MARKETING_VERSION, which would read identically
          # ("$MARKETING_VERSION") for a store build and a dev build of the
          # same tag. Info.plist itself is left untouched (CFBundleShortVersionString/
          # CFBundleVersion stay pure numeric -- no "-dev" suffix there, to
          # avoid any App Store Connect version-string validation surprise
          # on an artifact that might later get re-tagged/reused); the
          # "-dev" marker instead goes into a DISPLAY-only string used for
          # the dSYM artifact name and this run's job summary.
          MARKETING_VERSION_DISPLAY="$MARKETING_VERSION"
          if [ "${DEV_TOOLS_INPUT:-false}" = "true" ]; then
            MARKETING_VERSION_DISPLAY="${MARKETING_VERSION}-dev"
            echo "::warning::DEV TOOLS BUILD -- version $MARKETING_VERSION_DISPLAY (build $NEW_BUILD). Compiled WITH QAUDION_DEV_TOOLS for internal testing. This build must NEVER be submitted for App Store review."
            {
              echo "### :warning: DEV TOOLS build"
              echo ""
              echo "- Marketing version: \`$MARKETING_VERSION\` (tag \`$GIT_TAG\`)"
              echo "- Build number: \`$NEW_BUILD\` (source: \`$BUILD_SOURCE\`)"
              echo "- QAUDION_DEV_TOOLS: **ON** -- Settings \"SVILUPPATORE\" section and other TestFlight-facing surfaces are compiled in."
              echo "- Store-readiness TestFlight-strings gate: **skipped** (expected -- see the \"Patch onnxruntime + re-sign\" step)."
              echo ""
              echo "**Do not submit this build for App Store review.** It is for TestFlight internal testing only."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "marketing_version_display=$MARKETING_VERSION_DISPLAY" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 6) Set up signing -- fetch or create Distribution cert + App
      #    Store provisioning profile via the ASC API. Same flow as
      #    codemagic.yaml.
      # ----------------------------------------------------------
      - name: Set up signing
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -e
          keychain initialize
          CERT_KEY_PATH=/tmp/dist_cert_key.pem
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          chmod 600 "$CERT_KEY_PATH"
          openssl rsa -in "$CERT_KEY_PATH" -noout -check && echo "private key OK"

          # Main app profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier

          # -- Main app: Associated Domains --------------------------------
          # v1.0.1023 (2026-08-21): Universal Links support was added
          # (QAudionApp.entitlements now declares
          # com.apple.developer.associated-domains for the
          # applinks:q-audion.com / applinks:www.q-audion.com domains), but
          # the App Store profile above was created before that capability
          # existed on the Bundle ID -- xcodebuild archive rejected it
          # immediately with:
          #   "Provisioning profile ... doesn't include the Associated
          #    Domains capability."
          # Same class of fix as the VPN extension/broadcast extension
          # below (same root cause: fetch-signing-files --create makes the
          # Bundle ID/profile but does not add a capability that didn't
          # exist yet) -- reusing that exact Phase 1-4 pattern here instead
          # of a one-off manual portal fix, so this self-heals on every
          # future run rather than needing to be redone if the profile is
          # ever recreated from scratch.
          #
          # Phase 1: resolve the main app's Bundle ID resource id. Verified
          # 2026-08-21 against the real installed codemagic-cli-tools source
          # (codemagic/apple/resources/resource.py Resource.__str__) that
          # plain `list`/`profiles` output (unlike fetch-signing-files' own
          # custom progress log lines used elsewhere in this file) always
          # starts each printed resource with a literal "Id: <RESOURCE_ID>"
          # line -- confirmed by running both commands locally against the
          # real Apple API with a syntactically-valid-but-unauthorized key
          # (got a real 401 from the real endpoint, not an argparse error,
          # i.e. the flags/subcommands below are real and accepted).
          echo "Resolving main app Bundle ID resource id for capability check..."
          MAIN_BID_LOOKUP=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier 2>&1 || true)
          MAIN_BID_PLAIN=$(printf '%s\n' "$MAIN_BID_LOOKUP" | sed 's/\x1b\[[0-9;]*m//g')
          MAIN_BID_RES=$(printf '%s\n' "$MAIN_BID_PLAIN" \
            | grep -E '^Id: ' | head -1 | sed 's/^Id: //' || echo "")
          echo "Main app Bundle ID res-id: ${MAIN_BID_RES:-UNKNOWN}"

          if [ -n "$MAIN_BID_RES" ]; then
            echo "Enabling Associated Domains on $MAIN_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$MAIN_BID_RES" --capability "Associated Domains" 2>&1 \
              && echo "  ASSOCIATED_DOMAINS: done" \
              || echo "  ASSOCIATED_DOMAINS: WARN (may already be enabled)"

            # CarPlay/Siri state-of-the-art plan S1 (docs/superpowers/plans/
            # 2026-09-06-carplay-state-of-the-art.md) -- QAudion.entitlements
            # now declares com.apple.developer.siri, but the main app's App
            # Store profile was created before that capability existed on
            # the Bundle ID. Same self-healing pattern as Associated Domains
            # above: enable it here, then Phase 2/3 below delete the stale
            # profile and recreate it so the new profile actually includes it.
            echo "Enabling SiriKit on $MAIN_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$MAIN_BID_RES" --capability "SiriKit" 2>&1 \
              && echo "  SIRIKIT: done" \
              || echo "  SIRIKIT: WARN (may already be enabled)"

            # Phase 2: delete the stale profile (created before the
            # capability existed) so --create below makes a fresh one that
            # actually includes it. `bundle-ids profiles` (not `profiles
            # list`, which has no --bundle-id-identifier filter) is the
            # real subcommand for "profiles for this bundle id".
            MAIN_PROF_LOOKUP=$(app-store-connect bundle-ids profiles \
              --bundle-ids "$MAIN_BID_RES" --type IOS_APP_STORE 2>&1 || true)
            MAIN_PROF_PLAIN=$(printf '%s\n' "$MAIN_PROF_LOOKUP" | sed 's/\x1b\[[0-9;]*m//g')
            MAIN_PROF_RES=$(printf '%s\n' "$MAIN_PROF_PLAIN" \
              | grep -E '^Id: ' | head -1 | sed 's/^Id: //' || echo "")
            if [ -n "$MAIN_PROF_RES" ]; then
              echo "Deleting stale main app profile $MAIN_PROF_RES (created without Associated Domains)..."
              app-store-connect profiles delete "$MAIN_PROF_RES" 2>&1 \
                && echo "  Profile deleted." \
                || echo "  Profile delete WARN (may already be gone)"
            else
              echo "WARNING: could not resolve main app profile resource -- relying on --create below."
            fi

            # Phase 3: re-create the main app profile. It will now include
            # Associated Domains, satisfying the entitlements file.
            echo "Re-creating main app signing files with Associated Domains..."
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create \
              --platform IOS \
              --certificate-key "@file:$CERT_KEY_PATH" \
              --strict-match-identifier
          else
            echo "WARNING: could not resolve main app Bundle ID resource -- archive may still fail on Associated Domains."
          fi

          # ?? VPN extension: App Groups + Network Extensions ???????????????????
          # QAudionPacketTunnel.entitlements requires both capabilities.
          # fetch-signing-files --create creates the Bundle ID but NOT the
          # capabilities -- the profile it produces has no entitlements, and
          # xcodebuild archive rejects it immediately (~3s failure) with:
          #   "requires a provisioning profile with the App Groups and
          #    Network Extensions features"
          #
          # Fix:
          #   Phase 1 -- run fetch-signing-files to create/find the Bundle ID
          #             and (stale) profile; capture output to extract IDs.
          #   Phase 2 -- enable APP_GROUPS + NETWORK_EXTENSIONS on the Bundle ID.
          #   Phase 3 -- delete the stale profile (no capabilities) so --create
          #             makes a fresh one with capabilities in Phase 4.
          #   Phase 4 -- re-run fetch-signing-files; new profile includes caps.
          EXT_BID="com.qaudion.app.packet-tunnel"

          # Phase 1: run first fetch so Bundle ID definitely exists; capture output.
          # We capture via a temp file because $() swallows ANSI colour codes
          # while still allowing tee to print to the step console.
          EXT_FETCH_TMP=$(mktemp)
          app-store-connect fetch-signing-files "$EXT_BID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier 2>&1 | tee "$EXT_FETCH_TMP" || true
          EXT_FETCH_OUT=$(cat "$EXT_FETCH_TMP")
          rm -f "$EXT_FETCH_TMP"

          # Strip ANSI codes so greps below see plain text regardless of
          # whether codemagic-cli-tools colourises its output.
          PLAIN=$(printf '%s\n' "$EXT_FETCH_OUT" | sed 's/\x1b\[[0-9;]*m//g')

          # Extract Bundle ID resource ID -- two possible formats:
          #   new:      "Created Bundle ID XXXXXXXXXX"
          #   existing: "- Name identifier (XXXXXXXXXX)"
          EXT_BID_RES=$(printf '%s\n' "$PLAIN" \
            | grep -oE 'Created Bundle ID [A-Z0-9]{10}|Bundle ID [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$EXT_BID_RES" ]; then
            EXT_BID_RES=$(printf '%s\n' "$PLAIN" \
              | grep -F "com.qaudion.app.packet-tunnel" \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Extension Bundle ID res-id: ${EXT_BID_RES:-UNKNOWN}"

          # Extract Profile resource ID -- two possible formats:
          #   new:      "Created Profile XXXXXXXXXX"
          #   reused:   "- IOS_APP_STORE ... (XXXXXXXXXX)"
          EXT_PROF_RES=$(printf '%s\n' "$PLAIN" \
            | grep -oE 'Created Profile [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$EXT_PROF_RES" ]; then
            EXT_PROF_RES=$(printf '%s\n' "$PLAIN" \
              | grep -E '^- IOS_APP_STORE' \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Extension Profile res-id: ${EXT_PROF_RES:-UNKNOWN}"

          # Phase 2: enable capabilities (idempotent -- safe to re-run).
          # Diagnostic: print available bundle-ids subcommands on first run so
          # we can verify 'add-capability' exists if the command fails below.
          if [ -n "$EXT_BID_RES" ]; then
            echo "=== app-store-connect bundle-ids help (diagnostic) ==="
            app-store-connect bundle-ids --help 2>&1 | head -20 || true

            echo "Enabling APP_GROUPS on $EXT_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$EXT_BID_RES" --capability "App Groups" 2>&1 \
              && echo "  APP_GROUPS: done" \
              || echo "  APP_GROUPS: WARN (may already be enabled)"

            echo "Enabling NETWORK_EXTENSIONS on $EXT_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$EXT_BID_RES" --capability "Network Extensions" 2>&1 \
              && echo "  NETWORK_EXTENSIONS: done" \
              || echo "  NETWORK_EXTENSIONS: WARN"

            # Phase 3: delete stale profile (no capabilities) to force
            # fresh creation in Phase 4.
            if [ -n "$EXT_PROF_RES" ]; then
              echo "Deleting stale profile $EXT_PROF_RES (created without capabilities)..."
              app-store-connect profiles delete "$EXT_PROF_RES" 2>&1 \
                && echo "  Profile deleted." \
                || echo "  Profile delete WARN (may already be gone)"
            fi

            # Phase 4: re-create extension signing files. The profile will
            # now include APP_GROUPS + NETWORK_EXTENSIONS, satisfying the
            # entitlements file and allowing xcodebuild archive to proceed.
            echo "Re-creating extension signing files with capabilities..."
            app-store-connect fetch-signing-files "$EXT_BID" \
              --type IOS_APP_STORE \
              --create \
              --platform IOS \
              --certificate-key "@file:$CERT_KEY_PATH" \
              --strict-match-identifier
          else
            echo "WARNING: could not resolve Extension Bundle ID resource -- archive may fail."
          fi

          # ── Broadcast extension: App Groups ─────────────────────────────
          # QAudionBroadcastExtension.entitlements (ReplayKit screen-share,
          # feat(groups): ReplayKit broadcast extension) requires App Groups.
          # Same class of fix as the VPN extension above: fetch-signing-files
          # --create makes the Bundle ID but not the capability -- the profile
          # it produces has no entitlements and xcodebuild archive rejects it.
          # No NETWORK_EXTENSIONS needed here (broadcast, not a tunnel).
          BCAST_BID="com.qaudion.app.broadcast"

          BCAST_FETCH_TMP=$(mktemp)
          app-store-connect fetch-signing-files "$BCAST_BID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier 2>&1 | tee "$BCAST_FETCH_TMP" || true
          BCAST_FETCH_OUT=$(cat "$BCAST_FETCH_TMP")
          rm -f "$BCAST_FETCH_TMP"

          BCAST_PLAIN=$(printf '%s\n' "$BCAST_FETCH_OUT" | sed 's/\x1b\[[0-9;]*m//g')

          BCAST_BID_RES=$(printf '%s\n' "$BCAST_PLAIN" \
            | grep -oE 'Created Bundle ID [A-Z0-9]{10}|Bundle ID [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$BCAST_BID_RES" ]; then
            BCAST_BID_RES=$(printf '%s\n' "$BCAST_PLAIN" \
              | grep -F "com.qaudion.app.broadcast" \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Broadcast Extension Bundle ID res-id: ${BCAST_BID_RES:-UNKNOWN}"

          BCAST_PROF_RES=$(printf '%s\n' "$BCAST_PLAIN" \
            | grep -oE 'Created Profile [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$BCAST_PROF_RES" ]; then
            BCAST_PROF_RES=$(printf '%s\n' "$BCAST_PLAIN" \
              | grep -E '^- IOS_APP_STORE' \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Broadcast Extension Profile res-id: ${BCAST_PROF_RES:-UNKNOWN}"

          if [ -n "$BCAST_BID_RES" ]; then
            echo "Enabling APP_GROUPS on $BCAST_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$BCAST_BID_RES" --capability "App Groups" 2>&1 \
              && echo "  APP_GROUPS: done" \
              || echo "  APP_GROUPS: WARN (may already be enabled)"

            if [ -n "$BCAST_PROF_RES" ]; then
              echo "Deleting stale profile $BCAST_PROF_RES (created without capabilities)..."
              app-store-connect profiles delete "$BCAST_PROF_RES" 2>&1 \
                && echo "  Profile deleted." \
                || echo "  Profile delete WARN (may already be gone)"
            fi

            echo "Re-creating broadcast extension signing files with capabilities..."
            app-store-connect fetch-signing-files "$BCAST_BID" \
              --type IOS_APP_STORE \
              --create \
              --platform IOS \
              --certificate-key "@file:$CERT_KEY_PATH" \
              --strict-match-identifier
          else
            echo "WARNING: could not resolve Broadcast Extension Bundle ID resource -- archive may fail."
          fi

          # ── Intents extension: App Groups (S2 added QAudionIntents.entitlements) ─
          # CarPlay/Siri state-of-the-art plan. S1 (INStartCallIntent) needed
          # no entitlements file at all -- S2 (INSendMessageIntent/
          # INSearchForMessagesIntent, SiriMessageBridgeStore.swift) added
          # QAudionIntents.entitlements declaring
          # group.com.bcrypto.qaudion.siri, so this now needs the same
          # enable-capabilities / delete-stale-profile dance as the VPN and
          # broadcast extensions above, not a plain profile.
          INTENTS_BID="com.qaudion.app.intents"

          INTENTS_FETCH_TMP=$(mktemp)
          app-store-connect fetch-signing-files "$INTENTS_BID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier 2>&1 | tee "$INTENTS_FETCH_TMP" || true
          INTENTS_FETCH_OUT=$(cat "$INTENTS_FETCH_TMP")
          rm -f "$INTENTS_FETCH_TMP"

          INTENTS_PLAIN=$(printf '%s\n' "$INTENTS_FETCH_OUT" | sed 's/\x1b\[[0-9;]*m//g')

          INTENTS_BID_RES=$(printf '%s\n' "$INTENTS_PLAIN" \
            | grep -oE 'Created Bundle ID [A-Z0-9]{10}|Bundle ID [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$INTENTS_BID_RES" ]; then
            INTENTS_BID_RES=$(printf '%s\n' "$INTENTS_PLAIN" \
              | grep -F "com.qaudion.app.intents" \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Intents Extension Bundle ID res-id: ${INTENTS_BID_RES:-UNKNOWN}"

          INTENTS_PROF_RES=$(printf '%s\n' "$INTENTS_PLAIN" \
            | grep -oE 'Created Profile [A-Z0-9]{10}' \
            | grep -oE '[A-Z0-9]{10}' | head -1 || echo "")
          if [ -z "$INTENTS_PROF_RES" ]; then
            INTENTS_PROF_RES=$(printf '%s\n' "$INTENTS_PLAIN" \
              | grep -E '^- IOS_APP_STORE' \
              | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()' | head -1 || echo "")
          fi
          echo "Intents Extension Profile res-id: ${INTENTS_PROF_RES:-UNKNOWN}"

          if [ -n "$INTENTS_BID_RES" ]; then
            echo "Enabling APP_GROUPS on $INTENTS_BID_RES..."
            app-store-connect bundle-ids enable-capabilities \
              "$INTENTS_BID_RES" --capability "App Groups" 2>&1 \
              && echo "  APP_GROUPS: done" \
              || echo "  APP_GROUPS: WARN (may already be enabled)"

            if [ -n "$INTENTS_PROF_RES" ]; then
              echo "Deleting stale profile $INTENTS_PROF_RES (created without capabilities)..."
              app-store-connect profiles delete "$INTENTS_PROF_RES" 2>&1 \
                && echo "  Profile deleted." \
                || echo "  Profile delete WARN (may already be gone)"
            fi

            echo "Re-creating Intents extension signing files with capabilities..."
            app-store-connect fetch-signing-files "$INTENTS_BID" \
              --type IOS_APP_STORE \
              --create \
              --platform IOS \
              --certificate-key "@file:$CERT_KEY_PATH" \
              --strict-match-identifier
          else
            echo "WARNING: could not resolve Intents Extension Bundle ID resource -- archive may fail."
          fi

          keychain add-certificates
          xcode-project use-profiles --project "QAudionApp/$XCODE_PROJECT"

      # ----------------------------------------------------------
      # 7a) Build IPA. Identical command to codemagic.yaml.
      #     On failure: print full build.log to stdout so the
      #     error is visible in the GitHub Actions step UI without
      #     downloading the artifact.
      # ----------------------------------------------------------
      - name: Build IPA
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme QAudionApp 2>&1 | tee build.log \
          || (echo ""; echo "=== BUILD FAILED -- full build.log ==="; cat build.log; exit 1)

      # ----------------------------------------------------------
      # 7a-2) I5 (MASVS assessment) -- publish the real Package.resolved
      #     produced by this build as an artifact. No Swift/Xcode toolchain
      #     exists on the dev machine that authors these workflow changes
      #     (Windows), so this macOS runner is the only place the actual
      #     resolved dependency graph is ever materialized; committing it
      #     to the repo (for reproducible-build / supply-chain pinning)
      #     needs it pulled from here.
      #
      #     ONE file only, ONE known path: the Xcode-managed workspace's own
      #     xcshareddata/swiftpm/Package.resolved. The first version of this
      #     step also globbed all of DerivedData "just in case" -- that
      #     picked up a SECOND, unrelated Package.resolved belonging to
      #     GRDB.swift's own vendored test-fixture sub-project
      #     (.../SourcePackages/checkouts/GRDB.swift/Tests/Performance/
      #     GRDBPerformance/...), confirmed from that run's own logged
      #     source paths -- not this app's dependency graph at all, and
      #     genuinely confusing to find sitting next to the real one with no
      #     way to tell them apart without re-reading the log. QAudionEngine
      #     itself has no separate Package.resolved (it resolves as part of
      #     the same workspace graph, confirmed by this fix -- only one file
      #     was ever real).
      #     Always runs (not gated on success) so a Package.resolved that
      #     did get written before a later failure is still recoverable.
      # ----------------------------------------------------------
      - name: Collect Package.resolved
        if: always()
        working-directory: QAudionApp
        continue-on-error: true
        run: |
          OUT="$GITHUB_WORKSPACE/package-resolved-out"
          mkdir -p "$OUT"
          SRC="QAudionApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$OUT/Package.resolved"
            echo "Found: $SRC"
          else
            echo "Package.resolved not found at expected path: $SRC"
          fi

      - name: Upload Package.resolved
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: package-resolved-${{ github.run_number }}
          path: package-resolved-out
          retention-days: 30
          if-no-files-found: warn

      # ----------------------------------------------------------
      # 7b) Diagnose Swift compile errors ONLY when Build IPA fails.
      #     Previously this ran BEFORE Build IPA as a precaution (raw
      #     xcodebuild with CODE_SIGNING_ALLOWED=NO so Swift errors
      #     appear without xcbeautify filtering them away). That paid
      #     ~2:10 of full re-compilation on EVERY build, including
      #     green ones -- ~22% of total wall time wasted when nothing
      #     is broken. By gating on `if: failure()`, the diag pass
      #     runs only when actually needed (the build-log tail above
      #     gives a first hint; this gives the full Swift output).
      #     See CLAUDE.md sec 13 for the type-checker timeout traps.
      # ----------------------------------------------------------
      - name: Diagnose Swift compile (raw xcodebuild)
        if: failure()
        working-directory: QAudionApp
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee diag.log | grep -E 'error:|warning:|note:' || true
          echo "--- diag.log tail ---"
          tail -50 diag.log

      - name: Upload diag.log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ github.run_number }}
          path: QAudionApp/diag.log
          retention-days: 7
          if-no-files-found: warn

      # ----------------------------------------------------------
      # 7c) Diagnose Archive/signing errors ONLY when Build IPA fails
      #     AND the Swift-compile diagnostic above came back clean.
      #     `xcode-project build-ipa` (7a) runs archive through
      #     xcbeautify, which summarizes/filters the real xcodebuild
      #     output -- a genuine signing/entitlements failure can come
      #     back as a bare "Failed to archive" with zero detail (seen
      #     on v1.0.795: Swift-compile diag passed clean, archive still
      #     failed in ~11s with nothing printed). This re-runs the
      #     IDENTICAL archive invocation xcode-project uses internally,
      #     but raw (no xcbeautify), so the real reason surfaces.
      # ----------------------------------------------------------
      - name: Diagnose archive (raw xcodebuild, signed)
        if: failure()
        working-directory: QAudionApp
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -archivePath build/ios/xcarchive/QAudionApp_diag.xcarchive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=5G22P9239N \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee archive-diag.log
          echo "--- archive-diag.log tail ---"
          tail -80 archive-diag.log

      - name: Upload archive-diag.log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: archive-diag-${{ github.run_number }}
          path: QAudionApp/archive-diag.log
          retention-days: 7
          if-no-files-found: warn

      # ----------------------------------------------------------
      # 8) Patch onnxruntime.framework MinimumOSVersion + re-sign.
      #    See CLAUDE.md sec 4 for the full story. Currently 1.24.2.
      #    The plutil line forces 16.0 regardless of what the XCFramework
      #    Info.plist contains, so this step is version-agnostic.
      # ----------------------------------------------------------
      - name: Patch onnxruntime + re-sign
        env:
          # SEC (Aikido, 2026-08-21): env indirection, same rule as the
          # "Bump version" step's TAG_INPUT/DEV_TOOLS_INPUT above.
          DEV_TOOLS_INPUT: ${{ github.event.inputs.dev_tools }}
        run: |
          set -e
          IPA_PATH=$(find QAudionApp/build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"; exit 1
          fi
          WORK=$(mktemp -d)
          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/$IPA_PATH"

          # Patch onnxruntime.framework MinimumOSVersion (CLAUDE.md sec 4).
          FW="Payload/QAudionApp.app/Frameworks/onnxruntime.framework"
          if [ -d "$FW" ]; then
            plutil -replace MinimumOSVersion -string "16.0" "$FW/Info.plist"
          else
            echo "onnxruntime.framework not in IPA -- skipping MinimumOSVersion patch"
          fi

          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
                     | awk -F'"' '/Apple Distribution|iPhone Distribution/ {print $2; exit}')

          # Re-sign EVERY embedded framework with the distribution cert, not
          # just onnxruntime. Signing the .app bundle below is NOT recursive
          # (no --deep, which Apple discourages), so any framework that was
          # patched (onnxruntime's MinimumOSVersion) OR arrived unsigned from
          # a binary xcframework must be signed here or altool rejects the
          # upload with 90034 "not signed using an Apple submission
          # certificate" (device-confirmed on v1.0.743, 2026-07-08, against
          # the since-removed Reality.xcframework — the failure mode is
          # general to any unsigned embedded framework, so this step stays).
          # Sign inner frameworks before the outer app so nested signatures
          # are sealed by the app signature. Frameworks can live at the app
          # root OR under Frameworks/ — find covers both.
          find "Payload/QAudionApp.app" -name "*.framework" -type d | while read -r EMBED_FW; do
            codesign --force --sign "$IDENTITY" "$EMBED_FW"
            echo "re-signed: $EMBED_FW"
          done

          ENT_FILE="$WORK/app.entitlements.plist"
          codesign -d --entitlements :- --xml "Payload/QAudionApp.app" > "$ENT_FILE" 2>/dev/null || true
          if [ ! -s "$ENT_FILE" ]; then
            codesign -d --entitlements :- "Payload/QAudionApp.app" > "$ENT_FILE" 2>/dev/null || true
          fi
          codesign --force --sign "$IDENTITY" --entitlements "$ENT_FILE" "Payload/QAudionApp.app"

          # ---- Store-readiness gates on the SHIPPED artifact -----------
          # (App Store readiness audit 2026-09-12, FIX-01/FIX-06.) The
          # privacy manifest was silently absent from every IPA up to
          # v1.0.1151 because of a project.yml exclude+re-add pattern; a
          # manifest that exists in git but not in the bundle is exactly
          # the failure only the artifact can prove. Same for TestFlight
          # wording: it must be compiled out of the store build.
          APP="Payload/QAudionApp.app"
          for MANIFEST in "$APP/PrivacyInfo.xcprivacy"                           "$APP/PlugIns/QAudionIntents.appex/PrivacyInfo.xcprivacy"                           "$APP/PlugIns/QAudionPacketTunnel.appex/PrivacyInfo.xcprivacy"                           "$APP/PlugIns/QAudionBroadcastExtension.appex/PrivacyInfo.xcprivacy"; do
            if [ ! -f "$MANIFEST" ]; then
              echo "::error::privacy manifest missing from IPA: $MANIFEST"
              exit 1
            fi
            plutil -lint "$MANIFEST"
          done
          # TestFlight-strings gate: skipped ONLY for an explicit dev_tools
          # dispatch (QAUDION_DEV_TOOLS was deliberately compiled in by the
          # "Patch project.yml for dev tools build" step earlier in this
          # job, so the itms-beta/testflight.apple.com strings ARE expected
          # here). A tag push never sets DEV_TOOLS_INPUT=true, so this gate
          # runs exactly as before for every store build. Every OTHER gate
          # (privacy manifests above, the WebRTC key-material logging gate
          # below) still runs unconditionally.
          if [ "${DEV_TOOLS_INPUT:-false}" = "true" ]; then
            echo "::warning::store-readiness TestFlight-strings gate SKIPPED (dev_tools build) — itms-beta/testflight.apple.com strings are expected in this binary. This build must NEVER be submitted for App Store review."
          elif strings "$APP/QAudionApp" | grep -qiE "itms-beta://|testflight\.apple\.com"; then
            echo "::error::TestFlight-only surface compiled into the store binary (itms-beta / testflight.apple.com string found) — QAUDION_DEV_TOOLS must be OFF for a tag build"
            exit 1
          fi
          echo "store-readiness gates: privacy manifests present (x4), no TestFlight strings in binary"

          rm -f "$GITHUB_WORKSPACE/$IPA_PATH"
          zip -qr "$GITHUB_WORKSPACE/$IPA_PATH" Payload
          ls -lh "$GITHUB_WORKSPACE/$IPA_PATH"

      # ----------------------------------------------------------
      # 8b) WebRTC key-material logging gate on the SHIPPED IPA.
      #     Upstream webrtc-sdk/webrtc prints the frame-cryptor secret / salt and
      #     the DERIVED AES key at RTC_LOG(LS_INFO) (derived_key / "slat << " /
      #     raw_key); with RTCSetMinDebugLogLevel(.info) those lines reach stderr
      #     and the uploaded live-log blobs. sigarone/webrtc-aes256-build's
      #     no-key-log.patch removes them at the source; this step proves it on
      #     the artifact that is about to be uploaded (the IPA re-zipped by the
      #     previous step): every Mach-O in the app bundle is scanned (app
      #     binary, Frameworks/*, PlugIns/*), counts and file names are printed.
      #     Mode: env WEBRTC_KEYLOG_GATE at the top of this job. That job-level env
      #     currently sets it to '1', so this workflow ENFORCES the gate by default
      #     (fails the build on a hit); only setting it to something other than '1'
      #     switches to report-only, which can never fail a release.
      # ----------------------------------------------------------
      - name: Assert no WebRTC key-material logging in the IPA
        # Report-only mode must not be able to break the release even through an
        # unrelated failure (unzip, mktemp, a missing script in an old tag), so the
        # step is also continue-on-error unless the gate is enforcing.
        continue-on-error: ${{ env.WEBRTC_KEYLOG_GATE != '1' }}
        run: |
          set -e
          echo "WEBRTC_KEYLOG_GATE=${WEBRTC_KEYLOG_GATE:-0} (1 = enforce, anything else = report-only)"
          if [ ! -f scripts/ci/assert-no-key-logging.sh ]; then
            echo "::warning::scripts/ci/assert-no-key-logging.sh is not in this checkout (old tag?) - key-logging gate skipped"
            if [ "${WEBRTC_KEYLOG_GATE:-0}" = "1" ]; then exit 1; fi
            exit 0
          fi
          IPA_PATH=$(find QAudionApp/build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::warning::key-logging gate: no IPA found under QAudionApp/build/ios/ipa - nothing scanned"
            if [ "${WEBRTC_KEYLOG_GATE:-0}" = "1" ]; then exit 1; fi
            exit 0
          fi
          SCAN=$(mktemp -d)
          unzip -q "$GITHUB_WORKSPACE/$IPA_PATH" -d "$SCAN"
          sh scripts/ci/assert-no-key-logging.sh "$SCAN/Payload/QAudionApp.app"
          rm -rf "$SCAN"

      # ----------------------------------------------------------
      # 9) Upload to TestFlight Internal group "Q-Audion testers".
      # ----------------------------------------------------------
      - name: Upload IPA to App Store Connect
        env:
          ALLOW_REDUNDANT: ${{ github.event.inputs.allow_redundant }}
          BUILD_NUMBER_SOURCE: ${{ steps.version.outputs.build_number_source }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e
          IPA_PATH=$(find QAudionApp/build/ios/ipa -name "*.ipa" | head -1)

          # Use Apple's altool directly instead of `app-store-connect
          # publish --testflight`. Reason: the codemagic CLI's publish
          # action tries to submit the build for EXTERNAL TestFlight
          # beta review even when we only have an INTERNAL group. That
          # submission fails on "missing test info" and breaks the
          # workflow even though the upload + internal distribution
          # succeeded. altool upload is exactly what we need: the build
          # uploads, Apple processes it, internal testers see it
          # automatically. No beta review involved.
          #
          # Write the .p8 to a temp file (altool needs it on disk).
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Hardened upload: altool/iTMSTransporter can hang on a flaky App
          # Store Connect connection (60+ min stall on the v1.0.695 build).
          # macOS has NO `timeout` binary by default (it's GNU coreutils), so
          # use gtimeout if present, else run altool directly. Retry up to 3x
          # and treat an "already uploaded" response as success so a retry
          # after a partial upload is safe.
          TO=""
          if command -v gtimeout >/dev/null 2>&1; then TO="gtimeout 1500"
          elif command -v timeout >/dev/null 2>&1; then TO="timeout 1500"; fi
          upload_ok=0
          for attempt in 1 2 3; do
            echo "=== altool upload attempt $attempt/3 (timeout='${TO:-none}') ==="
            set +e
            OUT=$($TO xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1)
            rc=$?
            set -e
            echo "$OUT"
            if [ "$rc" -eq 0 ]; then upload_ok=1; break; fi
            if echo "$OUT" | grep -qiE "already been uploaded|redundant binary|same version"; then
              # A redundant binary means the build number was NOT
              # monotonic (e.g. the ASC lookup failed and the commit-count
              # fallback collided). Treat it as success only when the
              # operator explicitly asked for that (workflow_dispatch
              # allow_redundant=true); otherwise fail loudly so a store
              # submission never silently reuses an older upload.
              if [ "${ALLOW_REDUNDANT:-false}" = "true" ]; then
                echo "altool: build already on App Store Connect — allow_redundant=true, treating as success"
                upload_ok=1; break
              fi
              echo "::error::altool reports this build number is already on App Store Connect and allow_redundant is not set — build number source was '${BUILD_NUMBER_SOURCE:-unknown}'"
              exit 1
            fi
            echo "=== altool attempt $attempt failed (rc=$rc); backoff 30s ==="
            sleep 30
          done
          if [ "$upload_ok" != "1" ]; then
            echo "altool upload failed after 3 attempts"
            exit 1
          fi

          echo ""
          echo "? Upload complete. Build will appear in TestFlight Internal"
          echo "   group 'Q-Audion testers' automatically once Apple"
          echo "   finishes processing (~5-10 min)."

      # ----------------------------------------------------------
      # 10) Upload artifacts so the human can download IPA + dSYM
      #     even when running locally / for crash symbolication.
      # ----------------------------------------------------------
      - name: Upload artifacts
        if: always()
        # Non-fatal: this step runs AFTER the TestFlight altool upload
        # (step 9 above), so the IPA is already on App Store Connect by
        # the time we get here. A storage-quota hit must not turn an
        # otherwise-successful TestFlight build into a red CI run --
        # `continue-on-error: true` keeps the workflow green and lets
        # the human download the artifacts only when storage allows.
        # retention-days dropped 14 -> 7 to be a good citizen now that
        # we've observed the org's quota cap fill up.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            QAudionApp/build/ios/ipa/*.ipa
            QAudionApp/build/ios/dsym/*.zip
            QAudionApp/build.log
          retention-days: 7
          if-no-files-found: warn

      # ----------------------------------------------------------
      # 11) P0-A -- Versioned dSYM archive for Mac-free crash
      #     symbolication. The IPA pipeline (xcode-project build-ipa)
      #     already produces dSYM zip(s) under QAudionApp/build/ios/dsym/,
      #     but step 10 bundles them into ios-build-<run_number> with a
      #     7-day retention that can be skipped on a storage-quota hit.
      #     That makes the *exact* dSYM for an old TestFlight build hard
      #     to find (you must know the run number) and short-lived.
      #
      #     This step publishes a SEPARATE artifact named by version
      #     (dsyms-<CFBundleShortVersionString>) retained 90 days, so any
      #     later crash can fetch the matching dSYM with:
      #         gh run download <run-id> -n dsyms-<version> -D ./dsyms
      #     No Mac required to symbolicate afterwards (atos / symbolicate,
      #     or scripts/symbolicate.py).
      #
      #     Robust collection: prefer codemagic's dsym/*.zip output; also
      #     scan the whole build tree + any .xcarchive for *.dSYM bundles
      #     so a runner-layout change can't silently drop the dSYM. Each
      #     found bundle is staged under a UNIQUE subdir so two .dSYMs
      #     with the same basename can never clobber one another.
      #
      #     `if: always()` + continue-on-error keeps an otherwise-green
      #     TestFlight build green on a storage-quota miss (CLAUDE.md:
      #     the pipeline is fragile -- additive, non-fatal only). The
      #     collect step always creates $GITHUB_WORKSPACE/dsyms-out and
      #     the upload uses a STATIC path glob (never a cross-step env
      #     var), so the upload can never run with an empty path input.
      # ----------------------------------------------------------
      - name: Archive dSYMs (versioned, 90d)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/dsyms-out"
          mkdir -p "$OUT"

          # 1) codemagic build-ipa writes ready-made dSYM zip(s) here.
          if ls QAudionApp/build/ios/dsym/*.zip >/dev/null 2>&1; then
            cp QAudionApp/build/ios/dsym/*.zip "$OUT/" || true
            echo "Copied codemagic dSYM zip(s) from build/ios/dsym/"
          fi

          # 2) Fallback: collect any raw *.dSYM bundles from the build
          #    tree and from any .xcarchive the build may have produced.
          #    Process substitution keeps the loop in the MAIN shell (no
          #    subshell counter), and each bundle goes to its own subdir
          #    (n=0,1,2,...) so same-basename bundles never collide.
          STAGE="$(mktemp -d)"
          n=0
          found_any=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            mkdir -p "$STAGE/found_$n"
            cp -R "$d" "$STAGE/found_$n/" 2>/dev/null && found_any=1
            n=$((n + 1))
          done < <(find QAudionApp/build "$HOME/Library/Developer/Xcode/Archives" \
                     -type d -name '*.dSYM' 2>/dev/null || true)

          if [ "$found_any" = "1" ]; then
            ( cd "$STAGE" && zip -qry "$OUT/QAudionApp.dSYMs.raw.zip" . ) || true
            echo "Zipped raw .dSYM bundle(s) from build tree / xcarchive"
          fi

          echo "=== Collected dSYM payload ==="
          ls -lh "$OUT" || true
          if ! ls "$OUT"/* >/dev/null 2>&1; then
            echo "::warning::No dSYMs found to archive (build may have failed before producing them)."
          fi

      - name: Upload versioned dSYMs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # Named by version so a future crash can do:
          #   gh run download --name dsyms-<version>
          # Falls back to run_number when the version output is empty
          # (e.g. the build failed before the Bump version step ran).
          # `||` returns the right operand when the left is the empty
          # string -- this IS the correct GitHub Actions fallback idiom.
          # marketing_version_display carries a "-dev" suffix on a dev_tools
          # dispatch (see "Bump version" step) so a dev dSYM archive can
          # never be confused with, or overwrite, the store archive for the
          # same tag.
          name: dsyms-${{ steps.version.outputs.marketing_version_display || steps.version.outputs.marketing_version || github.run_number }}
          # STATIC path glob -- never a cross-step env var. The collect
          # step always creates dsyms-out/, so this input is never empty.
          path: dsyms-out/*
          retention-days: 90
          if-no-files-found: warn

      # ----------------------------------------------------------
      # 12) P0-A FALLBACK -- recover dSYMs from App Store Connect for a
      #     build whose 90-day artifact already expired. OPT-IN ONLY:
      #     runs solely on a manual workflow_dispatch with
      #     download_dsyms=true (never on a normal tag push). Uses
      #     fastlane download_dsyms (stable, documented ASC dSYM API;
      #     fastlane is preinstalled on macos runners) authenticated via
      #     an App Store Connect API-key JSON (key_id + issuer_id + key
      #     content). NOTE: this app does not use Bitcode, so Apple does
      #     not recompile -- the build dSYMs from step 11 are already
      #     final; this path exists only for expired-artifact recovery.
      #
      #     The guard is an explicit event_name + string compare so it is
      #     null-safe on tag-push (github.event.inputs is null there) and
      #     documents intent. Boolean dispatch inputs serialize to the
      #     strings 'true'/'false'.
      # ----------------------------------------------------------
      - name: Recover dSYMs from App Store Connect (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_dsyms == 'true' }}
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # SEC (Aikido, 2026-08-21): env, not ${{ }} spliced into the
          # script — see the "Bump version" step's identical fix above.
          TAG_INPUT: ${{ github.event.inputs.tag }}
          MARKETING_VERSION_OUTPUT: ${{ steps.version.outputs.marketing_version }}
        run: |
          # NB: intentionally NO `set -x` -- it would echo the .p8 secret.
          set -uo pipefail

          # Write the .p8 + an App Store Connect API-key JSON under
          # RUNNER_TEMP (NOT the build tree) so the step-11 `find
          # QAudionApp/build` dSYM scan and the upload globs can never
          # capture the secret.
          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # fastlane download_dsyms needs key_id + issuer_id + key, not a
          # bare .p8 path. The documented stable shape is an ASC API-key
          # JSON consumed via api_key_path:. Build it here (in_house:false
          # for App Store / TestFlight builds).
          API_JSON="$KEY_DIR/asc_api_key.json"
          python3 - "$KEY_FILE" > "$API_JSON" <<'PY'
          import json, sys, os
          key_id = os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]
          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          with open(sys.argv[1], "r") as f:
              key = f.read()
          json.dump({
              "key_id": key_id,
              "issuer_id": issuer,
              "key": key,
              "in_house": False,
          }, sys.stdout)
          PY
          chmod 600 "$API_JSON"

          REC_OUT="$GITHUB_WORKSPACE/dsyms-recovered"
          mkdir -p "$REC_OUT"

          # version: prefer the bumped value, else parse the dispatch tag.
          VER="$MARKETING_VERSION_OUTPUT"
          if [ -z "$VER" ]; then
            VER="$(echo "$TAG_INPUT" | sed -E 's/^v//; s/-[A-Za-z].*$//')"
          fi
          echo "Recovering dSYMs for app $BUNDLE_ID${VER:+ version $VER}"

          # download_dsyms pulls every dSYM Apple holds for the app
          # (optionally filtered by version) into output_directory. The
          # ASC API key JSON carries the auth (key_id/issuer_id/key).
          fastlane run download_dsyms \
            api_key_path:"$API_JSON" \
            app_identifier:"$BUNDLE_ID" \
            output_directory:"$REC_OUT" \
            ${VER:+version:"$VER"} \
            || echo "::warning::download_dsyms returned non-zero (no matching build, or no dSYMs on ASC)."

          echo "=== Recovered dSYMs ==="
          ls -lhR "$REC_OUT" || true
          # Ensure the upload below always has a non-empty path input even
          # when nothing was recovered (avoids an empty-path input error).
          if ! ls "$REC_OUT"/* >/dev/null 2>&1; then
            echo "No dSYMs recovered from App Store Connect for ${VER:-<any version>}." > "$REC_OUT/README.txt"
          fi

      - name: Upload recovered dSYMs (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.download_dsyms == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dsyms-recovered-${{ steps.version.outputs.marketing_version || github.run_number }}
          path: dsyms-recovered/*
          retention-days: 90
          if-no-files-found: warn
