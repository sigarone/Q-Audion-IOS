            -only-testing:QAudionAppTests/ChatVoiceNoteSenderMaxUsesTests \
            -only-testing:QAudionAppTests/CallCloseReasonRedactionTests \
            -only-testing:QAudionAppTests/CrashDiagnosticsRedactionTests \
            -only-testing:QAudionAppTests/CallMetricsRedactionTests \
            -only-testing:QAudionAppTests/CallMinimizePolicyTests \
            -only-testing:QAudionAppTests/SasCardPlacementTests \
            -only-testing:QAudionAppTests/CallControlDockTests \
            -only-testing:QAudionAppTests/CallDiagnosticsModelTests \
            -only-testing:QAudionAppTests/CallPipLayoutTests \
            -only-testing:QAudionAppTests/InstallIdStoreTests \
            -only-testing:QAudionAppTests/CredentialTextParserTests \
