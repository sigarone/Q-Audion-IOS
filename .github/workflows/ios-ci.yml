            -only-testing:QAudionAppTests/RecoveryEnrollmentStatusTests \
            -only-testing:QAudionAppTests/ReKeyAvatarRingTests \
            -only-testing:QAudionAppTests/RuntimeLogSinkTeeTests \
            -only-testing:QAudionAppTests/ShareQueueTests \
            -only-testing:QAudionAppTests/SiriIntentPolicyTests \
            -only-testing:QAudionAppTests/TrustEvaluationModelTests \
            -only-testing:QAudionAppTests/VoiceDisplayFormatTests \
            -only-testing:QAudionAppTests/VoiceGuardModelTests \
            -only-testing:QAudionAppTests/VoiceToneRowTests \
            -only-testing:QAudionAppTests/VoiceWordTests \
            -only-testing:QAudionAppTests/VpnSessionCoordinatorTests \
            -resultBundlePath /tmp/app-tests.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee app-tests.log \
          || (echo ""; echo "=== TESTS FAILED -- last 300 lines of app-tests.log ==="; tail -300 app-tests.log; exit 1)

      # The host app tees stdout/stderr, which swallows XCTest's per-case
      # lines from the step above, so read the result bundle instead and
      # refuse a "green" run that executed nothing.
      - name: Check app-target test results
        run: |
          set -e
          xcrun xcresulttool get test-results summary --path /tmp/app-tests.xcresult | tee /tmp/app-tests-summary.json
          PASSED=$(grep -oE '"passedTests"[^0-9]*[0-9]+' /tmp/app-tests-summary.json | grep -oE '[0-9]+$' | head -1)
          FAILED=$(grep -oE '"failedTests"[^0-9]*[0-9]+' /tmp/app-tests-summary.json | grep -oE '[0-9]+$' | head -1)
          echo "passed=${PASSED:-?} failed=${FAILED:-?}"
          if [ -z "$PASSED" ] || [ "$PASSED" -eq 0 ] || [ "${FAILED:-0}" -ne 0 ]; then
            echo "::error::app-target tests did not run cleanly (passed=${PASSED:-?} failed=${FAILED:-?})"
            exit 1
          fi

      # 2026-10-03 — diagnostic: the executed app-target cases by name (the summary above only counts them).
      - name: List the executed app-target test cases (xcresult)
        if: always()
        run: |
          python3 ../scripts/ci/xcresult_test_list.py /tmp/app-tests.xcresult /tmp/app-test-cases.txt \
            CallerBusyOutcomeTests MissedCallsBadgeTests PersistentCallRecordStoreTests ConfidenceToneTests || true
        working-directory: QAudionApp

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-tests-logs-${{ github.run_number }}
          path: |
            QAudionApp/build-sim.log
            QAudionApp/app-tests.log
            /tmp/app-test-cases.txt
          retention-days: 7
          if-no-files-found: ignore

  # The build with the share extension (QAudionApp/project-share.yml: QAUDION_SHARE, QAudionShare extension), compiled
  # for the simulator without signing so the extension does not rot while the default build leaves it out.
  share-variant-build:
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.share != 'true' && (needs.plan.result != 'success' || needs.plan.outputs.share == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      - name: Restore SPM packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project (share spec)
        working-directory: QAudionApp
        run: |
          xcodegen generate --spec project-share.yml
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      - name: Build the app with the share extension
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-share \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/share-build.log" | tail -40

      - name: The extension is embedded in the app
        run: |
          APP=/tmp/dd-ios-share/Build/Products/Debug-iphoneos/QAudionApp.app
          test -n "$APP" && test -d "$APP/PlugIns/QAudionShare.appex"
          plutil -lint "$APP/PlugIns/QAudionShare.appex/Info.plist"
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$APP/PlugIns/QAudionShare.appex/Info.plist")" = "com.apple.share-services"
          echo "share extension embedded"

  # The variant WITH VPN support. Device destination, unsigned: libwg-go.a (built
  # by the QAudionPacketTunnel script phase, needs Go) has no Simulator slice.
  vpn-variant-build:
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.vpn != 'true' && (needs.plan.result != 'success' || needs.plan.outputs.vpn == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # Read only: the entry is written by the other job, on main.
      - name: Restore SPM packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.22'
          cache: false

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      # QAudionVPN.entitlements must stay equal to QAudion.entitlements plus the
      # Network Extension key and the App Group shared with the extension.
      - name: Entitlements variants agree
        run: |
          python3 - <<'PY'
          import plistlib
          default = plistlib.load(open("QAudionApp/QAudion.entitlements", "rb"))
          vpn = plistlib.load(open("QAudionApp/QAudionVPN.entitlements", "rb"))
          ne = "com.apple.developer.networking.networkextension"
          groups = "com.apple.security.application-groups"
          vpn_group = "group.com.bcrypto.qaudion.vpn"
          assert ne not in default, "default entitlements must not carry the Network Extension key"
          assert vpn_group not in default.get(groups, []), "default entitlements must not carry the VPN App Group"
          assert ne in vpn and vpn_group in vpn[groups], "VPN entitlements lack the Network Extension key or App Group"
          rest = {k: v for k, v in vpn.items() if k != ne}
          rest[groups] = [g for g in rest[groups] if g != vpn_group]
          assert rest == default, "entitlements differ beyond the VPN additions: %r vs %r" % (rest, default)
          share = plistlib.load(open("QAudionApp/QAudionShareApp.entitlements", "rb"))
          share_group = "group.com.bcrypto.qaudion.share"
          assert share_group not in default.get(groups, []), "default entitlements must not carry the share App Group"
          assert share_group not in vpn.get(groups, []), "VPN entitlements must not carry the share App Group"
          assert share_group in share.get(groups, []), "share entitlements lack the share App Group"
          share_rest = dict(share)
          share_rest[groups] = [g for g in share_rest[groups] if g != share_group]
          assert share_rest == default, "share entitlements differ beyond the share group: %r vs %r" % (share_rest, default)
          print("entitlement variants agree")
          PY

      - name: Generate Xcode project (VPN spec)
        working-directory: QAudionApp
        run: |
          xcodegen generate --spec project-vpn.yml
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      - name: Build QAudionApp with VPN support (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-vpn \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-vpn.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-vpn.log ==="; tail -300 build-vpn.log; exit 1)

      # The extension is embedded and the VPN code is really compiled in.
      - name: Check the VPN variant contents
        run: |
          set -e
          APP="/tmp/dd-ios-vpn/Build/Products/Debug-iphoneos/QAudionApp.app"
          test -d "$APP/PlugIns/QAudionPacketTunnel.appex"
          ls "$APP/PlugIns"
          test -n "$(grep -rlaF 'wg_private_key_b64' "$APP" | head -1)"

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-vpn-variant-logs-${{ github.run_number }}
          path: QAudionApp/build-vpn.log
          retention-days: 7
          if-no-files-found: ignore

  # The variant WITH the earbud hardware stack (QAUDION_EARBUD). It needs no extension, no
  # framework and no Go, so a device destination without signing is enough. Built twice: plain
  # (what ios-testflight.yml dispatched with earbud=true produces) and together with
  # QAUDION_DEV_TOOLS, which adds the earbud diagnostics screen that drives the same code.
  earbud-variant-build:
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.earbud != 'true' && (needs.plan.result != 'success' || needs.plan.outputs.earbud == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # Read only: the entry is written by the first job, on main.
      - name: Restore SPM packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      # Sources and specs: the default spec never mentions the flag, the earbud specs set it, the
      # combined spec is the union of the VPN and earbud flags.
      - name: Earbud gating (sources and specs)
        run: python3 -I scripts/ci/check_earbud_gating.py

      # XcodeGen cannot stack two specs given on the command line, so the VPN + earbud
      # combination has a spec of its own (project-vpn-earbud.yml, which includes
      # project-vpn.yml). Check that the include really merges the flags the way the file says:
      # each spec must resolve to exactly its own set, on the generated project.
      - name: Specs resolve to the intended compilation conditions
        working-directory: QAudionApp
        run: |
          set -e
          # The compilation conditions are read from the generated project itself (the
          # OTHER_SWIFT_FLAGS lines of project.pbxproj): no package resolution needed.
          flags_of() {
            xcodegen generate --spec "$1" >/dev/null
            grep -E 'OTHER_SWIFT_FLAGS' "$XCODE_PROJECT/project.pbxproj" | sort -u | tr -s ' 	' ' ' || true
          }
          DEFAULT=$(flags_of project.yml)
          EARBUD=$(flags_of project-earbud.yml)
          VPN=$(flags_of project-vpn.yml)
          BOTH=$(flags_of project-vpn-earbud.yml)
          echo "default:    $DEFAULT"
          echo "earbud:     $EARBUD"
          echo "vpn:        $VPN"
          echo "vpn+earbud: $BOTH"
          case "$DEFAULT" in *QAUDION_EARBUD*|*QAUDION_VPN*) echo "::error::the default spec sets a feature flag"; exit 1;; esac
          case "$EARBUD" in *-DQAUDION_EARBUD*) ;; *) echo "::error::project-earbud.yml does not set -DQAUDION_EARBUD"; exit 1;; esac
          case "$EARBUD" in *QAUDION_VPN*) echo "::error::project-earbud.yml turns the VPN on"; exit 1;; esac
          case "$VPN" in *-DQAUDION_VPN*) ;; *) echo "::error::project-vpn.yml does not set -DQAUDION_VPN"; exit 1;; esac
          case "$VPN" in *QAUDION_EARBUD*) echo "::error::project-vpn.yml turns the earbud stack on"; exit 1;; esac
          case "$BOTH" in *-DQAUDION_VPN*-DQAUDION_EARBUD*|*-DQAUDION_EARBUD*-DQAUDION_VPN*) ;; *) echo "::error::project-vpn-earbud.yml does not set both flags"; exit 1;; esac

      - name: Generate Xcode project (earbud spec)
        working-directory: QAudionApp
        run: |
          xcodegen generate --spec project-earbud.yml
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      - name: Build QAudionApp with the earbud stack (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-earbud \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-earbud.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-earbud.log ==="; tail -300 build-earbud.log; exit 1)

      # The stack is really compiled in (class and service UUID found); this is also the positive
      # control for the signatures that assert-no-earbud.sh looks for in the default build.
      - name: Check the earbud variant contents
        run: |
          set -e
          APP="/tmp/dd-ios-earbud/Build/Products/Debug-iphoneos/QAudionApp.app"
          test -d "$APP"
          sh scripts/ci/assert-no-earbud.sh --require-present "$APP"

      # With the dev tools too, the earbud diagnostics screen (EarbudDiagScreen, which is compiled
      # only with both conditions) builds and is in the binary. The command line replaces the
      # target's compilation conditions, which in project.yml are just $(inherited).
      - name: Build QAudionApp with the earbud stack and the dev tools (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-earbud-dev \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) QAUDION_DEV_TOOLS' \
            2>&1 | tee build-earbud-dev.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-earbud-dev.log ==="; tail -300 build-earbud-dev.log; exit 1)

      - name: Check the earbud + dev tools variant contents
        run: |
          set -e
          APP="/tmp/dd-ios-earbud-dev/Build/Products/Debug-iphoneos/QAudionApp.app"
          test -d "$APP"
          sh scripts/ci/assert-no-earbud.sh --require-present "$APP"
          test -n "$(grep -rlaF '19EarbudDiagViewModel' "$APP" | head -1)"

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-earbud-variant-logs-${{ github.run_number }}
          path: |
            QAudionApp/build-earbud.log
            QAudionApp/build-earbud-dev.log
          retention-days: 7
          if-no-files-found: ignore

  # The Release configuration of the default build, the one the TestFlight archive uses
  # (optimised, whole-module): it reports warnings that a Debug build does not. Device
  # destination, unsigned. Held to the same counted baseline as the Debug build.
  release-config-build:
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.release != 'true' && (needs.plan.result != 'success' || needs.plan.outputs.release == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh "$XCODE_VERSION"

      # Read only: the entry is written by the other job, on main.
      - name: Restore SPM packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project (default spec)
        working-directory: QAudionApp
        run: xcodegen generate

      - name: Build QAudionApp, Release (device, unsigned)
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-ios-release \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-release.log \
          || (echo ""; echo "=== BUILD FAILED -- last 300 lines of build-release.log ==="; tail -300 build-release.log; exit 1)

      - name: Compiler warnings of the Release build
        if: always()
        env:
          DIAG_OUT: ${{ runner.temp }}/diagnostics-release-build.txt
        run: sh scripts/ci/xcode-diagnostics-summary.sh "App build (Release, device)" QAudionApp/build-release.log

      - name: Warning baseline
        run: sh scripts/ci/check-warning-baseline.sh QAudionApp/build-release.log

  # The same signing key check on a macOS image, where the openssl a workflow gets by name is
  # the one ios-testflight.yml runs. The images carry more than one OpenSSL build (3 now, 4 as
  # the default from November 2026); the default one has to pass, the others are reported.
  signing-key-macos:
    name: Signing key check (macOS OpenSSL)
    needs: plan
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.result != 'success' || needs.plan.outputs.signing == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: OpenSSL builds on this image
        run: |
          which -a openssl || true
          openssl version
          for b in /opt/homebrew/opt/openssl@*/bin/openssl /usr/bin/openssl; do
            [ -x "$b" ] && echo "$b: $("$b" version)"
          done
          exit 0

      - name: Signing key check, default openssl
        run: sh scripts/ci/test-check-signing-key.sh

      - name: Signing key check, every OpenSSL build (report only)
        continue-on-error: true
        run: |
          set --
          for b in /opt/homebrew/opt/openssl@*/bin/openssl /usr/bin/openssl; do
            [ -x "$b" ] && set -- "$@" "$b"
          done
          sh scripts/ci/test-check-signing-key.sh "$@"

      - name: openssl calls of the signing tools (report only)
        continue-on-error: true
        run: |
          set --
          for b in openssl /opt/homebrew/opt/openssl@*/bin/openssl; do
            command -v "$b" > /dev/null && set -- "$@" "$b"
          done
          sh scripts/ci/test-openssl-signing-calls.sh "$@"

  # The Linux job: the self-tests of the CI scripts and of the release gates, the source gates that read the app sources,
  # and the tests of the log filter. Seconds, no macOS minutes. It runs on a pull request and on a dispatch, not on a push
  # to main (every change reaches main through a pull request that ran it).
  #
  # What it covers, none of which needs a Mac:
  #   * the earbud hardware stack is a compile-time switch (QAUDION_EARBUD, see QAudionApp/project-earbud.yml).
  #     scripts/ci/check_earbud_gating.py proves on the SOURCES that with the flag off no symbol of the stack is left in
  #     code the compiler would see, and that the default spec, the earbud specs and ios-testflight.yml's EARBUD_BUILD
  #     wiring are as expected; its tests include mutations of the real sources. scripts/ci/test-assert-no-earbud.sh is
  #     the self-test of the BINARY gate (the real gate runs on the built app in app-build-and-tests and on the shipped
  #     IPA in ios-testflight.yml).
  #   * the CarPlay scene is part of every build. scripts/ci/check_carplay_gating.py proves on the SOURCES that
  #     project.yml links CarPlay.framework, that the app's Info.plist declares the scene, that both app entitlements
  #     files carry the CarPlay Communication key (and no other file does), that ios-testflight.yml regenerates the App
  #     Store profile against every entitlement, and that no car-screen text points at the phone; its tests include
  #     mutations of the real files. The built app is checked on macOS by app-build-and-tests.
  #   * every Siri intent the Intents extension declares (IntentsSupported in QAudionIntents/Info.plist) has example
  #     phrases that name the app in every QAudionApp/<lang>.lproj/AppIntentVocabulary.plist, the vocabulary of the
  #     development language included. scripts/ci/check_siri_intent_phrases.py reads the property lists.
  #   * user-facing Italian text goes through the String Catalog: scripts/ci/check_hardcoded_italian.py reads the Swift
  #     sources and fails on an Italian string literal outside String(localized:) and the SwiftUI initializers that take
  #     a LocalizedStringKey, on a catalog key a literal names but the catalog lacks, and on an allowlist line
  #     (scripts/ci/hardcoded_italian_allowlist.txt) that matches nothing any more.
  #   * the audio wire policy on the RTP sender (a fixed 32 kbps / packet time pin, applied when the sender is created
  #     and after every negotiation, no adaptive packet time anywhere) is exercised on the simulator by the engine tests;
  #     scripts/ci/check_audio_wire_shape.py proves on the sources that it is still wired.
  #   * dSYMs are uploaded encrypted (the repository is public): scripts/ci/install-age.sh installs the pinned age release
  #     after checking its SHA-256 (the test downloads it for real and also feeds it a tampered tarball),
  #     scripts/ci/encrypt-dsyms.sh and the recipient committed in ios-testflight.yml are tested with throwaway keys, and
  #     scripts/test_symbolicate_decrypt.py tests the decrypting side of scripts/symbolicate.py.
  #   * the app-level rules of the iOS 27 SDK (scripts/ci/check_sdk27_requirements.py): the app stays scene based with a
  #     launch screen, no Liquid Glass or full-screen opt-out key in any Info.plist, no use of the deprecated window lists.
  #   * the Xcode selector used by every macOS job (scripts/ci/select-xcode.sh) is run against fake /Applications trees
  #     shaped like the runner images, and the simulator picker (scripts/ci/resolve_simulator.py) on simulator lists
  #     shaped like the Xcode 27 image.
  #   * the check of the distribution signing key (scripts/ci/check-signing-key.sh, used by ios-testflight.yml) runs
  #     against throwaway keys with the OpenSSL of this image (the job signing-key-macos repeats it on a macOS image).
  #     Only throwaway keys are used, never a key of the repository.
  #   * the reuse of pull request results on push to main (scripts/ci/ci-run-reuse.sh, used by the job `reuse` and by the
  #     gate of ios-testflight.yml) runs against a stand-in `gh`: a job is reused only for the same tree, an up-to-date
  #     head from this repository, a green run of this pull request, and an API error, a fork, a failed or unfinished run,
  #     the run of another pull request or a different tree reuse nothing; the decision of the job `plan`
  #     (scripts/ci/ios-ci-plan.sh) and the wiring between this workflow and the gate (scripts/ci/check_ci_wiring.py)
  #     are tested the same way.
  #   * the log filter (scripts/ship-ios-logs.py and, for the server side, scripts/ship-server-logs.py): every
  #     scripts/test_ship_ios_*.py, every scripts/test_ship_server_*.py and the fuzz scripts/test_ship_redactor_fuzz.py.
  #     The filter lets through only the lines of a known vocabulary and drops the rest without any error, so a change
  #     can make valid lines vanish (or let too many through) without any other check noticing: these tests are the only
  #     check. Some of them read Swift sources (the vocabulary of the log lines), which is why those files set the flag
  #     `scripts`. Python only, the tests load the filter with a fake `paramiko` module when the library is missing.
  #
  # Needs network access to github.com for the age release only. No secrets.
  gates:
    name: iOS CI gates (self-tests)
    needs: plan
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.result != 'success' || needs.plan.outputs.scripts == 'true' || needs.plan.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The steps that need the network, or that only a change of a script or of the log filter can break, run when the
      # flag `scripts` is set; the source gates and the quick self-tests run whenever the job runs.
      SCRIPTS_CHANGED: ${{ needs.plan.result != 'success' || needs.plan.outputs.scripts == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The job does not write to the repository: no stored credentials.
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Earbud stack, source gate and its tests
        run: |
          python3 -I scripts/ci/check_earbud_gating.py
          python3 -I scripts/ci/test_check_earbud_gating.py

      - name: Audio sender pin, source gate and its tests
        run: |
          python3 -I scripts/ci/check_audio_wire_shape.py
          python3 -I scripts/ci/test_check_audio_wire_shape.py

      - name: CarPlay scene, source gate and its tests
        run: |
          python3 -I scripts/ci/check_carplay_gating.py
          python3 -I scripts/ci/test_check_carplay_gating.py

      - name: Siri example phrases, source gate and its tests
        run: |
          python3 -I scripts/ci/check_siri_intent_phrases.py
          python3 -I scripts/ci/test_check_siri_intent_phrases.py

      - name: Release notes, wording gate and its tests
        run: |
          python3 -I scripts/ci/check_release_notes.py
          python3 -I scripts/ci/test_check_release_notes.py

      - name: Hard-coded Italian text, source gate and its tests
        run: |
          python3 -I scripts/ci/check_hardcoded_italian.py
          python3 -I scripts/ci/test_check_hardcoded_italian.py

      - name: Earbud stack, binary gate self-test
        run: sh scripts/ci/test-assert-no-earbud.sh

      - name: Notification entitlements and keychain groups, source gate and its tests
        run: |
          python3 -I scripts/ci/test_check_notify_entitlements.py
          python3 -I scripts/ci/check_notify_entitlements.py .

      - name: iOS 27 SDK app-level rules
        run: |
          python3 -I scripts/ci/test_check_sdk27_requirements.py
          python3 -I scripts/ci/check_sdk27_requirements.py .

      - name: Xcode selector, self-test
        run: sh scripts/ci/test-select-xcode.sh

      - name: Simulator picker, tests
        run: python3 -I scripts/ci/test_resolve_simulator.py

      - name: Warning baseline check, self-test
        run: sh scripts/ci/test-check-warning-baseline.sh

      - name: Signing key check, self-test
        run: sh scripts/ci/test-check-signing-key.sh

      - name: Reuse of pull request results on main, self-test
        run: sh scripts/ci/test-ci-run-reuse.sh

      - name: Plan of this workflow, self-test
        run: sh scripts/ci/test-ios-ci-plan.sh

      - name: Wiring between this workflow and the TestFlight gate
        run: |
          python3 -I scripts/ci/test_check_ci_wiring.py
          python3 -I scripts/ci/check_ci_wiring.py .

      - name: Pinned age release installs and is verified by SHA-256
        if: ${{ env.SCRIPTS_CHANGED == 'true' }}
        run: sh scripts/ci/test-install-age.sh

      - name: Install age (same script as the release workflow)
        if: ${{ env.SCRIPTS_CHANGED == 'true' }}
        run: |
          # No pipe: `sh install-age.sh | tail -1` would hide an install failure (the pipe's status
          # is tail's, and set -e does not see the first command). pipefail stays on as a guard.
          set -eo pipefail
          DIR="$RUNNER_TEMP/age-bin"
          sh scripts/ci/install-age.sh "$DIR"
          test -x "$DIR/age"
          echo "$DIR" >> "$GITHUB_PATH"

      - name: dSYM encryption and the committed recipient
        if: ${{ env.SCRIPTS_CHANGED == 'true' }}
        run: sh scripts/ci/test-encrypt-dsyms.sh

      - name: symbolicate.py decrypts the dSYM artifact
        if: ${{ env.SCRIPTS_CHANGED == 'true' }}
        run: python3 -I scripts/test_symbolicate_decrypt.py

      - name: Log filter tests
        if: ${{ env.SCRIPTS_CHANGED == 'true' }}
        run: |
          # Runs all of them even when one fails, then exits with an error if any exited with a code other than 0.
          status=0
          n=0
          for t in scripts/test_ship_ios_*.py scripts/test_ship_server_*.py scripts/test_ship_redactor_fuzz.py; do
            if [ ! -f "$t" ]; then
              echo "::error::test not found: $t"
              status=1
              continue
            fi
            n=$((n + 1))
            echo "=== $t"
            if ! python3 -I "$t"; then
              echo "::error file=$t::the test exited with a code other than 0"
              status=1
            fi
          done
          # The fuzz on the server filter (same file, option --server).
          n=$((n + 1))
          echo "=== scripts/test_ship_redactor_fuzz.py --server"
          if ! python3 -I scripts/test_ship_redactor_fuzz.py 4000 7 --server; then
            echo "::error file=scripts/test_ship_redactor_fuzz.py::the fuzz --server exited with a code other than 0"
            status=1
          fi
          # The port of redactStructured (LogRedactor.swift), with the coordinates rule.
          n=$((n + 1))
          echo "=== scripts/test_redact_structured_parity.py"
          if ! python3 -I scripts/test_redact_structured_parity.py; then
            echo "::error file=scripts/test_redact_structured_parity.py::the test exited with a code other than 0"
            status=1
          fi
          echo "tests run: $n"
          exit $status

      - name: openssl calls of the signing tools (report only)
        if: ${{ env.SCRIPTS_CHANGED == 'true' }}
        continue-on-error: true
        run: sh scripts/ci/test-openssl-signing-calls.sh

  # SwiftLint over QAudionApp: the one rule that is active there, a ban on new bare print() calls (2026-08-21, MASVS-CODE
  # I8), with .swiftlint-qaudionapp.yml (only_rules: [] + one custom rule) instead of widening the main .swiftlint.yml,
  # so this does NOT run any of the default/opt-in rules against QAudionApp (the SwiftUI app with the documented Xcode
  # 26.4 type-checker-timeout traps: a flood of violations from one rule alone was seen, 2258 of 3380). Required check of
  # main under this name; non-blocking (continue-on-error), a visibility signal for new violations, not a merge gate.
  # Runs the official realm/swiftlint Docker image directly (no third-party Action) on ubuntu-latest: no Xcode or macOS
  # runner needed for pure linting.
  swiftlint-qaudionapp-print-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: SwiftLint (QAudionApp, print()-ban rule only)
        continue-on-error: true
        uses: docker://ghcr.io/realm/swiftlint@sha256:b8f3cf76353336c048f133aa5b02f5c35c6984b9e6451e906fb8f8c9f92bb30b # latest as of 2026-10-17 (image built 2026-09-28, no version tag; newer than 0.65.1)
        with:
          args: lint --config .swiftlint-qaudionapp.yml --path QAudionApp

  # ----------------------------------------------------------------
  # Report-only checks (added 2026-07-28): SwiftLint runs on push to main and on a manual run (it reports on the tree
  # that is on main, not on every pull request); the secret scan runs on every event, pull requests included. Every step
  # sets `continue-on-error: true`, so a finding here can NEVER fail the workflow or block a merge. They exist to surface
  # signal that was not visible before, not to gate CI.
  # ----------------------------------------------------------------

  # SwiftLint over QAudionEngine only (scope + exclusions come from the existing .swiftlint.yml at repo root; CLiboqs and
  # COpus are excluded there since they are C, not Swift). Deliberately does NOT run the full rule set against QAudionApp
  # (see the job above). Official realm/swiftlint Docker image on ubuntu-latest.
  swiftlint-report:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # 2026-07-28 — was `--reporter github-actions-logging`, which surfaces each violation as a GitHub annotation. That
      # silently caps at ~20 annotations shown/queryable via the Checks API (the raw log said "Found 3380 violations,
      # 1580 serious in 472 files" the same run), so the annotation view showed 0.6% of the real picture. `--output`
      # writes the FULL, uncapped result as JSON instead, which the next two steps turn into a complete signal: a real
      # total in the job summary and the full list as a downloadable artifact.
      - name: SwiftLint (full JSON report)
        id: swiftlint
        continue-on-error: true
        uses: docker://ghcr.io/realm/swiftlint@sha256:b8f3cf76353336c048f133aa5b02f5c35c6984b9e6451e906fb8f8c9f92bb30b # latest as of 2026-10-17 (image built 2026-09-28, no version tag; newer than 0.65.1)
        with:
          args: lint --config .swiftlint.yml --reporter json --output swiftlint-report.json
      - name: Summarize SwiftLint results (uncapped)
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -s swiftlint-report.json ]; then
            echo "### SwiftLint" >> "$GITHUB_STEP_SUMMARY"
            echo "No report produced (lint step may have crashed — see the step above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TOTAL=$(jq 'length' swiftlint-report.json)
          SERIOUS=$(jq '[.[] | select(.severity == "Error")] | length' swiftlint-report.json)
          WARNINGS=$(jq '[.[] | select(.severity == "Warning")] | length' swiftlint-report.json)
          {
            echo "### SwiftLint — full report ($TOTAL violations, GitHub annotations cap at ~20 so this summary is the real count)"
            echo ""
            echo "**$TOTAL total** — $SERIOUS serious (error), $WARNINGS warning"
            echo ""
            echo "<details><summary>Top rules by count</summary>"
            echo ""
            echo '```'
            jq -r '.[].rule_id' swiftlint-report.json | sort | uniq -c | sort -rn | head -20
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Top files by violation count</summary>"
            echo ""
            echo '```'
            jq -r '.[].file' swiftlint-report.json | xargs -n1 basename | sort | uniq -c | sort -rn | head -20
            echo '```'
            echo "</details>"
            echo ""
            echo "Full per-violation detail (file/line/rule/message): download the \`swiftlint-full-report\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full SwiftLint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftlint-full-report
          path: swiftlint-report.json
          if-no-files-found: warn
          retention-days: 14

  # Secret scan over the full repo (including history) via the official gitleaks Docker image. Report only: a hit here
  # (e.g. an already-rotated historical secret) is signal to review, not a merge blocker, and the job is not in the
  # `needs` of `result`. It runs on every event, pull requests included (about 20 s): the repository is public, so a
  # secret committed by a pull request has to be reported before the merge and not only after it, on push to main.
  secret-scan-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (report only)
        continue-on-error: true
        uses: docker://zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source . -v --redact

  # One check for the whole run: fails when a job that ran failed or was cancelled. A job skipped by the plan is fine.
  # Not a required check today (see the header); it is the check to require if the required list is ever shortened.
  result:
    name: iOS CI result
    if: ${{ always() }}
    needs: [plan, reuse, ios-simulator-tests, app-build-and-tests, share-variant-build, vpn-variant-build, earbud-variant-build, release-config-build, signing-key-macos, gates, swiftlint-qaudionapp-print-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran has passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -u
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' | while IFS="$(printf '\t')" read -r job result; do
            printf '%-34s %s\n' "$job" "$result"
          done
          # A plan that did not succeed ran everything; the jobs below it decide.
          BAD=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.key != "plan" and (.value.result == "failure" or .value.result == "cancelled")) | .key')
          if [ -n "$BAD" ]; then
            echo "::error::failed or cancelled: $(printf '%s' "$BAD" | tr '\n' ' ')"
            exit 1
          fi
