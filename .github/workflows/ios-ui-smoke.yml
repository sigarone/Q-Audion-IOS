# GitHub Actions -- Q-Audion iOS UI smoke test (Maestro, simulator).
#
# Manual-only (workflow_dispatch): this repo's macOS runner minutes are
# rate-limited on the free tier (10x credit multiplier on private repos,
# 200 min/month free -- see ios-testflight.yml's own note). This job does
# NOT run on every push/PR to avoid burning that budget; trigger it by
# hand from the Actions tab when you want to verify the UI still boots.
#
# What it does: builds QAudionApp for the iOS Simulator (NOT an archive/
# IPA -- no signing, no App Store Connect secrets needed), boots a
# simulator, installs the app, and runs a Maestro flow (maestro/*.yaml)
# against it. Screenshots + Maestro's own debug output are uploaded as
# artifacts regardless of pass/fail.
#
# Iteration history (2026-08-06, no Mac available to dry-run locally --
# every fix below came from reading real CI logs, gh run watch/view):
#   run 31078668610: xcodegen not installed -- added the "Install xcodegen"
#     step (was missing from the ios-testflight.yml pattern this copied).
#   run 31078878215: quiche.xcframework has no Simulator slice (built
#     device-only on purpose, see build-quiche-xcframework.sh) -- dropped
#     its cache/build steps, strip the framework dependency from a LOCAL
#     project.yml copy instead (AppMasqueQuicheTransport.swift is already
#     `#if canImport(Cquiche)`-gated, so not linking it compiles clean).
#   run 31079254653: same class of problem, WireGuardKitGo this time --
#     `libwg-go.a` (built by the QAudionPacketTunnel target's "Build
#     WireGuard Go" script phase) is GOOS=ios device-only, Go has no
#     Simulator-ABI Darwin runtime shims out of the box -- dropped the
#     now-unused Go setup step, strip the QAudionPacketTunnel target embed
#     from the same local project.yml copy (VPN tunnel isn't exercised by
#     the onboarding screen; NetworkExtension.framework SDK linkage stays).
# Still unverified end-to-end as of this commit -- next run tests whether
# QAudionBroadcastExtension (pure Swift, no native cross-compile) and the
# simulator boot/install/Maestro steps below all hold up.
#
# Requires Maestro flow(s) under apps/qaudion-ios/maestro/ -- see
# smoke-launch.yaml for the first one (cold launch -> onboarding welcome
# screen, no login required).

name: iOS UI Smoke Test (Maestro)

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Maestro flow file to run (relative to maestro/). Leave empty to run all flows in the directory.'
        required: false
        default: 'smoke-launch.yaml'

jobs:
  ui-smoke:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.qaudion.app
      XCODE_PROJECT: QAudionApp.xcodeproj
      XCODE_VERSION: '26'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Same pattern as ios-testflight.yml -- pin to the newest installed
      # 26.x Xcode on the runner image.
      - name: Select Xcode
        run: |
          set -e
          PIN="${XCODE_VERSION}"
          MATCH=$(ls -d /Applications/Xcode_${PIN}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MATCH" ]; then
            echo "No Xcode matching '${PIN}*' found. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Selecting: $MATCH"
          sudo xcode-select -s "$MATCH"
          xcodebuild -version

      - name: Cache SPM packages
        id: cache-spm
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('QAudionEngine/Package.swift', 'QAudionApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # quiche.xcframework (MASQUE) is DEVICE-ONLY by design --
      # scripts/build-quiche-xcframework.sh's own header comment says so
      # explicitly ("Add the sim slice later only if simulator runs are
      # needed") because of a known Rust/BoringSSL cross-compile snag
      # (ring/boring-sys's C build doesn't tag its simulator-target object
      # files correctly, so xcodebuild -create-xcframework rejects the
      # merge with "multiple platforms not supported"). Fixing that needs
      # Mac-side cargo iteration this workflow's author couldn't do
      # (no Mac available when this was written 2026-08-06). Real fix
      # if this is ever needed for more than a smoke test: add an
      # aarch64-apple-ios-sim slice to that script with the right
      # per-dependency C flags, then drop the project.yml patch below.
      #
      # For a UI smoke test we don't need MASQUE at all --
      # AppMasqueQuicheTransport.swift is already gated
      # `#if canImport(Cquiche)`, so simply never linking the framework
      # compiles that path out cleanly (same pattern already proven for
      # Reality.xcframework's optional linking). Strip the framework
      # reference from a LOCAL copy of project.yml for this CI checkout
      # only -- the committed file (and ios-testflight.yml's real,
      # device-only build) is never touched.
      #
      # Same story as quiche above, different native toolchain: run
      # 31079254653 failed the Simulator link with "Undefined symbols ...
      # _darwin_arm_init_mach_exception_handler" from libwg-go.a --
      # WireGuardKitGo's `GOOS=ios` CGO cross-compile only ever targets
      # real iOS DEVICE (Go's runtime has no simulator-ABI variant of its
      # Darwin syscall shims out of the box), and the "Build WireGuard Go"
      # script phase inside the QAudionPacketTunnel target has never had a
      # reason to know about Simulator until this workflow. Real fix if
      # ever needed beyond a smoke test: teach that Makefile/script a
      # Simulator-target Go build (nontrivial CGO cross-compile work,
      # can't iterate without a Mac). A UI smoke test needs none of this --
      # the VPN tunnel extension isn't exercised by the onboarding screen,
      # and NetworkExtension.framework (the SDK the main app's own VPN
      # code links against) stays untouched -- only the extension TARGET
      # embed is dropped, so it's never built for this lane.
      - name: Strip quiche.xcframework + QAudionPacketTunnel (Simulator lane only)
        run: |
          set -e
          sed -i.bak \
            -e '/- framework: Vendor\/quiche.xcframework/,+1d' \
            -e '/- target: QAudionPacketTunnel/,+1d' \
            QAudionApp/project.yml
          rm QAudionApp/project.yml.bak
          if grep -qE "framework: Vendor/quiche.xcframework|target: QAudionPacketTunnel" QAudionApp/project.yml; then
            echo "::error::sed failed to remove quiche/PacketTunnel dependency lines"
            exit 1
          fi
          echo "quiche.xcframework + QAudionPacketTunnel dependencies removed from this run's project.yml (committed file untouched)"

      # Reality.xcframework (VLESS+REALITY) -- same cache key as
      # engine-tests.yml's ios-simulator-tests job so a warm cache is reused.
      - name: Cache reality xcframework
        id: cache-reality
        uses: actions/cache@v5
        with:
          path: QAudionApp/Vendor/Reality.xcframework
          key: reality-xcframework-sim-${{ runner.os }}-${{ hashFiles('RealityCore/go.sum', 'scripts/build-reality-xcframework.sh') }}

      - name: Build reality xcframework
        if: steps.cache-reality.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GOTOOLCHAIN: auto
        run: bash scripts/build-reality-xcframework.sh

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: QAudionApp
        run: |
          xcodegen generate
          xcodebuild -project "$XCODE_PROJECT" -list 2>&1 | head -20

      # No signing needed -- Simulator builds don't require a provisioning
      # profile or distribution cert, unlike ios-testflight.yml's archive.
      - name: Build QAudionApp for Simulator
        working-directory: QAudionApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme QAudionApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath /tmp/dd-ios-ui \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-sim.log \
          || (echo ""; echo "=== BUILD FAILED -- full build-sim.log ==="; cat build-sim.log; exit 1)

      - name: Upload build log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-sim-log-${{ github.run_number }}
          path: QAudionApp/build-sim.log
          retention-days: 7
          if-no-files-found: warn

      - name: Boot simulator + install + launch app
        run: |
          set -e
          APP_PATH=$(find /tmp/dd-ios-ui -name "QAudionApp.app" -path "*iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "QAudionApp.app not found under /tmp/dd-ios-ui"; exit 1
          fi
          echo "App: $APP_PATH"

          UDID=$(xcrun simctl list devices available | grep "iPhone 17 (" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No 'iPhone 17' simulator preinstalled -- creating one"
            RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
            UDID=$(xcrun simctl create "iPhone 17" "com.apple.CoreSimulator.SimDeviceType.iPhone-17" "$RUNTIME")
          fi
          echo "UDID=$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          # Verbose CFNetwork/URLSession logging -- only matters for flows
          # that skip their own launchApp (e.g. diag-register.yaml), since
          # a flow's own launchApp kills+relaunches without these env vars.
          # Harmless no-op for normal flows. `simctl launch` has no `-e`
          # flag (first attempt: "Invalid device: -e") -- env vars for the
          # LAUNCHED process go through shell vars prefixed SIMCTL_CHILD_,
          # stripped of that prefix by simctl itself. Documented Apple
          # mechanism, not a flag.
          SIMCTL_CHILD_CFNETWORK_DIAGNOSTICS=3 SIMCTL_CHILD_OS_ACTIVITY_MODE=debug \
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 5

      - name: Install Maestro
        run: |
          brew tap mobile-dev-inc/tap
          brew install mobile-dev-inc/tap/maestro
          maestro --version

      # Diagnostic (2026-08-06) -- home-tabs-smoke.yaml's registration step
      # fails with a generic decode error and zero matching bcrypto-lite
      # server log entry, meaning the request never reached origin.
      # Cert-pinning was checked and ruled out (PinnedServerHost's pins
      # match the live chain). Hits the real endpoint from THIS runner's
      # network path (same as the Simulator's traffic) to see the raw
      # response -- rules in/out a Cloudflare-edge block of the runner's
      # IP before guessing further. Remove once the root cause is fixed.
      - name: DIAGNOSTIC - raw curl to register endpoint
        continue-on-error: true
        run: |
          echo "=== GET /api/v1/health ==="
          curl -sv -m 15 "https://voip.bcrypto.com/api/v1/health" 2>&1 | tail -40
          echo ""
          echo "=== POST /api/v1/auth/register/extension over HTTP/2 (body printed) ==="
          curl -sv -m 15 -X POST "https://voip.bcrypto.com/api/v1/auth/register/extension" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-diag-h2-'"$(date +%s)"'@example.invalid","platform":"ios"}' \
            -o /tmp/resp-h2.json -D /tmp/headers-h2.txt 2>&1 | tail -40
          echo "--- h2 response headers ---"; cat /tmp/headers-h2.txt
          echo "--- h2 response body ($(wc -c < /tmp/resp-h2.json) bytes) ---"; cat /tmp/resp-h2.json; echo
          echo ""
          # The app's own Network.framework logs show its request going out
          # over HTTP/3 (QUIC), NOT HTTP/2 like the curl call above -- this
          # is the one variable that test didn't control for. curl on the
          # macOS runner image ships with HTTP/3 support (unlike the local
          # dev-box curl used to draft this diagnostic, which lacked it).
          echo "=== POST /api/v1/auth/register/extension over HTTP/3 (body printed) ==="
          curl --http3 -sv -m 15 -X POST "https://voip.bcrypto.com/api/v1/auth/register/extension" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-diag-h3-'"$(date +%s)"'@example.invalid","platform":"ios"}' \
            -o /tmp/resp-h3.json -D /tmp/headers-h3.txt 2>&1 | tail -40
          echo "--- h3 response headers ---"; cat /tmp/headers-h3.txt
          echo "--- h3 response body ($(wc -c < /tmp/resp-h3.json) bytes) ---"; cat /tmp/resp-h3.json; echo

      - name: Run Maestro flow(s)
        run: |
          set -e
          FLOW_INPUT="${{ github.event.inputs.flow }}"
          if [ -n "$FLOW_INPUT" ]; then
            echo "Running single flow: maestro/$FLOW_INPUT"
            maestro test "maestro/$FLOW_INPUT"
          else
            echo "Running every flow under maestro/"
            maestro test maestro/
          fi

      - name: Capture final screenshot
        if: always()
        continue-on-error: true
        run: xcrun simctl io "$SIM_UDID" screenshot ios-ui-smoke-final.png

      - name: Upload screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-smoke-screenshot-${{ github.run_number }}
          path: ios-ui-smoke-final.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Maestro debug output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-${{ github.run_number }}
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7
