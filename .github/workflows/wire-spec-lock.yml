# WIRE_SPEC drift lock
#
# WIRE_SPEC.md is duplicated in six repos (bcrypto-server, qaudion-android-new,
# qaudion-ios, qaudion-desktop, qaudion-webapp, qaudion-firmware) because each client must be able to read the
# contract it implements without cloning the others. Nothing enforced that the
# copies stayed equal, and they did not: as of 2026-07-24, when only the server,
# Android, iOS and Desktop carried one, the Desktop copy
# defined `### 3.5` as "Base WebRTC SDP exchange" while the server copy defined
# the SAME number as "Call acceptance gate" -- and every single code reference
# to §3.5 across those four repos meant the acceptance gate. Desktop's own code
# cited a section its own spec copy no longer contained. Android and iOS had
# neither section at all.
#
# A spec that means different things depending on which checkout you read is
# worse than no spec: it produces confident, wrong implementations. This job
# fails the build if this repo's copy stops matching the canonical hash.
#
# docs/EARBUD_V6_ENDPOINT.md is locked the same way (EXPECTED_EARBUD_EP) and is byte-identical in the same six repos.
#
# To change WIRE_SPEC.md or docs/EARBUD_V6_ENDPOINT.md: edit it, copy the SAME bytes into all six repos,
# update EXPECTED (WIRE_SPEC.md) or EXPECTED_EARBUD_EP below in all six, and push together.

name: WIRE_SPEC drift lock

on:
  pull_request:
    branches: [main, release/*]
    paths: ['WIRE_SPEC.md', 'docs/EARBUD_V6_ENDPOINT.md', '.github/workflows/wire-spec-lock.yml']
  # No push trigger for main: every change reaches main through a pull request whose
  # checks are required, so a run on the merge commit would test the same code twice.
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# the only job here checks the repository out and reads it (actions/checkout),
# so no other GITHUB_TOKEN scope is needed.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify WIRE_SPEC.md and docs/EARBUD_V6_ENDPOINT.md match the canonical hashes
        run: |
          EXPECTED=079f5e1e8bb53af6370a76ea5a8f0b357b569c074ac0e78f481fc89cfe095fb9
          EXPECTED_EARBUD_EP=f45162866bc7f1f79440184e3fc1c5a66ec42bbe0eed637b99050f17b3fe0e8c
          status=0
          check() {
            ACTUAL=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$1"
            echo "expected $2"
            echo "actual   $ACTUAL"
            if [ "$2" != "$ACTUAL" ]; then
              echo "::error file=$1::$1 diverged from the canonical copy."
              status=1
            else
              echo "$1 is in sync."
            fi
          }
          check WIRE_SPEC.md "$EXPECTED"
          check docs/EARBUD_V6_ENDPOINT.md "$EXPECTED_EARBUD_EP"
          if [ "$status" != 0 ]; then
            echo "The six repo copies of WIRE_SPEC.md and of docs/EARBUD_V6_ENDPOINT.md MUST be byte-identical."
            echo "Either revert this edit, or apply the same bytes to the other five repos and update EXPECTED"
            echo "and EXPECTED_EARBUD_EP in all six workflows."
            exit 1
          fi
          echo "WIRE_SPEC.md and docs/EARBUD_V6_ENDPOINT.md are in sync."
