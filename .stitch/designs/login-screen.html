<style>
        body {
            background-color: #131313;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 218, 243, 0.03) 0%, transparent 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="flex flex-col min-h-screen text-on-surface antialiased font-body selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
<!-- Top Navigation Shell (Suppressed due to Transactional Intent - using simplified Header) -->
<header class="w-full top-0 flex justify-center items-center px-6 h-20 bg-[#131313]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim text-2xl" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<span class="text-lg font-black tracking-tighter text-white">SECURE TERMINAL</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-8 pb-20 pt-4">
<!-- Identity Section -->
<div class="w-full max-w-sm flex flex-col items-center mb-12">
<div class="relative mb-6">
<div class="absolute inset-0 bg-primary-fixed-dim/20 blur-2xl rounded-full"></div>
<div class="relative bg-surface-container-high p-4 rounded-xl shadow-[0_0_20px_rgba(0,218,243,0.15)]">
<span class="material-symbols-outlined text-5xl text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
</div>
<h1 class="text-[28pt] font-black text-primary tracking-tighter mb-1 font-headline">Q-AUDION</h1>
<p class="text-on-surface-variant font-medium tracking-wide">Post-Quantum Encrypted Calls</p>
</div>
<!-- Form Section -->
<form class="w-full max-w-sm space-y-4">
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-on-surface-variant/60 font-label uppercase ml-1 tracking-widest">User ID</label>
<input class="w-full bg-surface-container-lowest border-none outline outline-1 outline-outline-variant/20 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-1 focus:ring-primary-fixed-dim focus:outline-primary-fixed-dim/50 transition-all duration-200" placeholder="Enter secure ID" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-on-surface-variant/60 font-label uppercase ml-1 tracking-widest">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none outline outline-1 outline-outline-variant/20 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-1 focus:ring-primary-fixed-dim focus:outline-primary-fixed-dim/50 transition-all duration-200" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 cursor-pointer text-xl">visibility</span>
</div>
</div>
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-on-surface-variant/60 font-label uppercase ml-1 tracking-widest">Server URL</label>
<input class="w-full bg-surface-container-lowest border-none outline outline-1 outline-outline-variant/20 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-1 focus:ring-primary-fixed-dim focus:outline-primary-fixed-dim/50 transition-all duration-200" placeholder="vault.q-audion.com" type="url"/>
</div>
<div class="pt-6">
<button class="w-full bg-primary-fixed-dim text-on-primary-fixed font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(0,218,243,0.3)] hover:shadow-[0_0_25px_rgba(0,218,243,0.5)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
<div class="text-center pt-4">
<a class="text-sm font-medium text-on-surface-variant hover:text-primary-fixed-dim transition-colors" href="#">Create Account</a>
</div>
</form>
<!-- Decorative Security Visualization -->
<div class="mt-12 w-full max-w-sm">
<div class="h-[1px] bg-gradient-to-r from-transparent via-outline-variant/20 to-transparent mb-6"></div>
<div class="grid grid-cols-2 gap-4">
<div class="p-4 rounded-xl bg-surface-container-low/50 border border-outline-variant/10">
<p class="text-[8px] font-bold text-primary-fixed-dim/70 font-label uppercase tracking-widest mb-1">Tunnel Status</p>
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-primary-fixed-dim animate-pulse shadow-[0_0_8px_#00daf3]"></div>
<p class="text-xs font-label text-on-surface font-bold">READY</p>
</div>
</div>
<div class="p-4 rounded-xl bg-surface-container-low/50 border border-outline-variant/10">
<p class="text-[8px] font-bold text-primary-fixed-dim/70 font-label uppercase tracking-widest mb-1">Enc Level</p>
<p class="text-xs font-label text-on-surface font-bold">MIL-SPEC L4</p>
</div>
</div>
</div>
</main>
<!-- Footer Algorithm Badge -->
<footer class="w-full flex flex-col items-center pb-8 gap-4">
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-primary-fixed-dim/10 border border-primary-fixed-dim/20">
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim"></span>
<span class="text-[10px] font-bold text-primary-fixed-dim font-label tracking-widest">ML-KEM-1024</span>
</div>
<p class="text-[10px] text-on-surface-variant/30 font-label uppercase tracking-[0.2em]">Sovereign Communication Protocol v2.4.0</p>
</footer>
<!-- Background Decoration -->
<div class="fixed top-0 right-0 p-8 pointer-events-none opacity-20 hidden md:block">
<div class="text-[10rem] font-black text-primary-fixed-dim/5 leading-none">Q</div>
</div>
