workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Lint (SwiftLint)
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd QAudionEngine
            swiftlint lint --config ../.swiftlint.yml --reporter xcode 2>&1 | tee lint_results.txt || true
          else
            echo "SwiftLint not installed, skipping lint step" | tee QAudionEngine/lint_results.txt
          fi
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
      - name: Export Code Coverage
        script: |
          cd QAudionEngine
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -print -quit)
          XCTEST_BIN=$(find "${BIN_PATH}" -name '*.xctest' -print -quit 2>/dev/null || true)
          # On macOS SPM the test binary lives next to the .xctest bundle
          TEST_BIN="${BIN_PATH}/QAudionEnginePackageTests.xctest/Contents/MacOS/QAudionEnginePackageTests"
          if [ ! -f "$TEST_BIN" ]; then
            TEST_BIN=$(find "${BIN_PATH}" -type f -perm +111 -name '*PackageTests*' -print -quit 2>/dev/null || true)
          fi
          if [ -n "$PROFDATA" ] && [ -n "$TEST_BIN" ] && [ -f "$TEST_BIN" ]; then
            xcrun llvm-cov export \
              -format=lcov \
              -instr-profile "$PROFDATA" \
              "$TEST_BIN" \
              > coverage.lcov
            echo "Coverage report generated: coverage.lcov"
          else
            echo "Could not locate profdata or test binary; skipping coverage export."
            echo "PROFDATA=${PROFDATA:-<not found>}"
            echo "TEST_BIN=${TEST_BIN:-<not found>}"
          fi
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt
      - QAudionEngine/lint_results.txt
      - QAudionEngine/coverage.lcov

  qaudion-app-build:
    name: Q-Audion App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
      - name: Find Simulator
        script: |
          SIM_ID=$(xcrun simctl list devices available -j | \
            python3 -c "import json,sys; devs=json.load(sys.stdin)['devices']; \
            ids=[d['udid'] for k,v in devs.items() if 'iOS' in k for d in v if 'iPhone' in d['name'] and d['isAvailable']]; \
            print(ids[0] if ids else '')")
          echo "SIM_DEST=platform=iOS Simulator,id=$SIM_ID" >> $CM_ENV
      - name: Build App
        script: |
          cd QAudionApp
          xcodebuild build \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -destination "$SIM_DEST" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -50
    artifacts:
      - QAudionApp/build/Build/Products/**/*.app
