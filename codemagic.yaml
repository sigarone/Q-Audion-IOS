workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Build QAudionEngine (Swift Package)
        script: |
          cd QAudionEngine
          swift build -c release
      - name: Run Engine Tests
        script: |
          cd QAudionEngine
          swift test --parallel
    artifacts:
      - QAudionEngine/.build/**/*.o

  qaudion-engine-test:
    name: Q-Audion Engine Tests
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Build
        script: |
          cd QAudionEngine
          swift build
      - name: Test
        script: |
          cd QAudionEngine
          swift test --parallel 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/test_results.txt
