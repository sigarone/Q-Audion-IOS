workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Lint (SwiftLint)
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd QAudionEngine
            swiftlint lint --config ../.swiftlint.yml --reporter xcode 2>&1 | tee lint_results.txt || true
          else
            echo "SwiftLint not installed, skipping lint step" | tee QAudionEngine/lint_results.txt
          fi
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
      - name: Export Code Coverage
        script: |
          cd QAudionEngine
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -print -quit)
          XCTEST_BIN=$(find "${BIN_PATH}" -name '*.xctest' -print -quit 2>/dev/null || true)
          TEST_BIN="${BIN_PATH}/QAudionEnginePackageTests.xctest/Contents/MacOS/QAudionEnginePackageTests"
          if [ ! -f "$TEST_BIN" ]; then
            TEST_BIN=$(find "${BIN_PATH}" -type f -perm +111 -name '*PackageTests*' -print -quit 2>/dev/null || true)
          fi
          if [ -n "$PROFDATA" ] && [ -n "$TEST_BIN" ] && [ -f "$TEST_BIN" ]; then
            xcrun llvm-cov export \
              -format=lcov \
              -instr-profile "$PROFDATA" \
              "$TEST_BIN" \
              > coverage.lcov
            echo "Coverage report generated: coverage.lcov"
          else
            echo "Could not locate profdata or test binary; skipping coverage export."
          fi
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt
      - QAudionEngine/lint_results.txt
      - QAudionEngine/coverage.lcov

  qaudion-app-build:
    name: Q-Audion App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
      - name: Build App for Device (unsigned IPA)
        script: |
          cd QAudionApp
          # Build for generic iOS device (arm64, not simulator)
          xcodebuild build \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tail -50
      - name: Package IPA
        script: |
          cd QAudionApp
          # Find the .app bundle
          APP_PATH=$(find build -name "QAudionApp.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            # Create Payload directory and package as IPA
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r QAudionApp-v1.0.0-unsigned.ipa Payload/
            rm -rf Payload
            echo "IPA created: QAudionApp-v1.0.0-unsigned.ipa ($(du -h QAudionApp-v1.0.0-unsigned.ipa | cut -f1))"
          else
            echo "ERROR: .app bundle not found"
            find build -name "*.app" -type d
          fi
    artifacts:
      - QAudionApp/QAudionApp-*.ipa
      - QAudionApp/build/Build/Products/**/*.app
