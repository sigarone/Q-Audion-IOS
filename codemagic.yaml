workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      # W313: pinned to 26.4 (was 'latest', which resolved to 26.4.1).
      # Apple ITMS-90725 deadline (April 28, 2026) requires Xcode 26+
      # for App Store submissions — pin matches current behavior with
      # reproducibility for future runs.
      xcode: 26.4
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt

  qaudion-app-build:
    name: Q-Audion App Build (TestFlight)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      # W313: pinned to 26.4 (same reason as above workflow).
      xcode: 26.4
      groups:
        - asc_credentials   # must contain APP_STORE_CONNECT_KEY_IDENTIFIER,
                            # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.qaudion.app"
        XCODE_PROJECT: "QAudionApp.xcodeproj"
        XCODE_SCHEME: "QAudionApp"
        # App Store Connect numeric "App Apple ID" — required by
        # `app-store-connect get-latest-testflight-build-number` to fetch
        # the current build number from TestFlight. Without it, the
        # increment script silently fell back to `echo "0"` (because of
        # `2>/dev/null`), leaving CFBundleVersion stuck at 1 across every
        # tagged release. Source of truth: CLAUDE.md "Project snapshot".
        APP_APPLE_ID: "REDACTED_APP_ID"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
          echo "=== Schemes ==="
          xcodebuild -project QAudionApp.xcodeproj -list 2>&1 | head -20
      - name: Bump marketing version + build number (Info.plist direct via plutil)
        script: |
          set -e
          cd QAudionApp

          # ----------------------------------------------------------------
          # Why we DON'T rely on agvtool alone:
          #
          # `agvtool new-marketing-version` only writes the new value into
          # the Xcode project's MARKETING_VERSION build setting AND into
          # any Info.plist that uses the literal `$(MARKETING_VERSION)`
          # substitution. Our QAudionApp/Info.plist hard-codes the values
          # ("1.0.0" and "1") rather than referencing the build settings,
          # so agvtool's update never reached the bundle. Apple read the
          # literal "1.0.0 (1)" pair out of Info.plist on every upload,
          # silently overwrote the previous build under the same TestFlight
          # entry, and the user saw a stuck `1.0.0 (1)` for the entire
          # v1.0.34..v1.0.47 chain.
          #
          # Fix: write Info.plist directly via plutil, which guarantees
          # the literal values land in the IPA. We still call agvtool
          # afterwards (best-effort) so the .pbxproj's build settings stay
          # in sync for any local developer build that DOES use $(VAR)
          # substitution. agvtool failures are non-fatal here.
          # ----------------------------------------------------------------

          # 1) Marketing version from the git tag.
          if [ -n "$CM_TAG" ]; then
            MARKETING_VERSION=$(echo "$CM_TAG" | sed -E 's/^v//; s/-[A-Za-z].*$//')
          else
            MARKETING_VERSION="1.0.0"
          fi
          echo "CM_TAG = $CM_TAG"
          echo "Marketing version = $MARKETING_VERSION"

          # 2) Build number from TestFlight + 1.
          echo "APP_APPLE_ID = $APP_APPLE_ID"
          set +e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ -z "$LATEST_BUILD_NUMBER" ]; then
            echo "WARN: get-latest-testflight-build-number returned rc=$rc; falling back to 0"
            LATEST_BUILD_NUMBER=0
          fi
          echo "Latest TestFlight build number = $LATEST_BUILD_NUMBER"
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "New build number = $NEW_BUILD_NUMBER"

          # 3) Show Info.plist BEFORE the modification so the build log
          #    is unambiguous if the values land back at "1.0.0/1" again.
          echo ""
          echo "=== Info.plist BEFORE plutil ==="
          plutil -extract CFBundleShortVersionString raw -o - Info.plist || true
          plutil -extract CFBundleVersion             raw -o - Info.plist || true

          # 4) Write directly. -replace creates the key if missing, sets
          #    its value if present. Both keys exist in our Info.plist.
          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" Info.plist
          plutil -replace CFBundleVersion            -string "$NEW_BUILD_NUMBER"  Info.plist

          # 5) Verify after.
          echo ""
          echo "=== Info.plist AFTER plutil ==="
          plutil -extract CFBundleShortVersionString raw -o - Info.plist
          plutil -extract CFBundleVersion             raw -o - Info.plist

          # 6) Best-effort sync into the .pbxproj build settings via
          #    agvtool. Failures are non-fatal — Info.plist is already
          #    correct and the build will use those values regardless.
          agvtool new-marketing-version "$MARKETING_VERSION" || \
            echo "WARN: agvtool new-marketing-version failed (non-fatal; Info.plist already updated via plutil)"
          agvtool new-version -all "$NEW_BUILD_NUMBER" || \
            echo "WARN: agvtool new-version failed (non-fatal; Info.plist already updated via plutil)"
      - name: Set up signing (fetch or create Distribution cert + App Store profile)
        script: |
          set -e
          echo "=== Initialize keychain ==="
          keychain initialize

          echo ""
          echo "=== Write Distribution cert private key to file ==="
          # CERTIFICATE_PRIVATE_KEY env var holds the PEM (RSA 2048) that was used
          # (or will be used) to create the Apple Distribution certificate.
          # First build: CSR signed with this key is sent to Apple -> cert created.
          # Subsequent builds: same key lets us re-fetch the existing cert.
          CERT_KEY_PATH="/tmp/dist_cert_key.pem"
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          chmod 600 "$CERT_KEY_PATH"
          openssl rsa -in "$CERT_KEY_PATH" -noout -check && echo "private key OK"

          echo ""
          echo "=== Fetch or create App Store signing assets for $BUNDLE_ID ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --strict-match-identifier

          echo ""
          echo "=== Add certificates to keychain ==="
          keychain add-certificates

          echo ""
          echo "=== Configure Xcode project to use the fetched profiles ==="
          xcode-project use-profiles --project QAudionApp/$XCODE_PROJECT

          echo ""
          echo "=== Profiles summary ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "no profiles dir"
      - name: Diagnose Swift compile (raw xcodebuild)
        script: |
          # Diagnostic-only step: run a raw `xcodebuild build` against
          # the QAudionApp scheme so the genuine Swift compiler error
          # surfaces (xcode-project build-ipa pipes through xcbeautify
          # which has been swallowing the diagnostic above 'Failed to
          # archive'). Failures here are TOLERATED — the real signed
          # archive happens in the next step. We just want the log.
          set +e
          cd QAudionApp
          echo "=== which xcodebuild + version ==="
          which xcodebuild
          xcodebuild -version

          echo ""
          echo "=== xcodebuild build (RAW redirect, no xcbeautify pipe) ==="
          # Redirect to file directly (no pipe) so any xcbeautify
          # wrapper in the env can't intercept. Then cat key sections
          # to console after.
          xcodebuild \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200 -Xfrontend -debug-time-function-bodies' \
            build > diag.log 2>&1
          DIAG_RC=$?
          echo "xcodebuild exit code: $DIAG_RC"

          echo ""
          echo "=== diag.log size ==="
          wc -l diag.log || true

          echo ""
          echo "=== diag.log : first 80 lines (project setup) ==="
          head -80 diag.log || true

          echo ""
          echo "=== diag.log : grep error/warning/fatal/abort/killed ==="
          grep -E "error:|warning:|fatal:|cannot find|killed|signal|abort|crash|long-function|long-expression|<unknown>|Segmentation|terminate|note:" diag.log | head -300 || true

          echo ""
          echo "=== diag.log : last 250 lines ==="
          tail -250 diag.log || true
          echo ""
          echo "=== diag.log size ==="
          wc -l diag.log || true
          # Always succeed so the real Build IPA step still runs even
          # when this dry build trips a diagnostic.
          exit 0
      - name: Build IPA
        script: |
          cd QAudionApp
          # First echo the diagnostic step's findings into THIS step's
          # console so the actual Swift error surfaces here even when
          # the operator only pastes Step 7. The diag.log from the
          # previous step lives in QAudionApp/diag.log.
          if [ -f diag.log ]; then
            echo "=== diag.log : grep error/warning/long-fn (from Step 6) ==="
            grep -E "error:|warning:|fatal:|cannot find|note:.*type-check|killed|signal|long-function|long-expression" diag.log | tail -200 || true
            echo ""
            echo "=== diag.log : last 150 lines ==="
            tail -150 diag.log || true
            echo ""
            echo "=== diag.log size ==="
            wc -l diag.log || true
            echo ""
          else
            echo "[Build IPA] no diag.log found from Step 6 — skipping pre-print"
          fi

          # Capture full xcode-project build-ipa output to build.log so
          # the next failed run's diagnostic is at least preserved as
          # an artifact for download. xcbeautify still filters the
          # in-console output but the artifact has the raw stream.
          set -o pipefail
          xcode-project build-ipa \
            --project QAudionApp.xcodeproj \
            --scheme QAudionApp 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          if [ "$BUILD_RC" -ne 0 ]; then
            echo ""
            echo "=== build.log tail (last 200 lines) ==="
            tail -200 build.log || true
            echo ""
            echo "=== Swift errors only (grep) ==="
            grep -E "error:|warning:" build.log | tail -100 || true
            exit "$BUILD_RC"
          fi
      - name: Patch onnxruntime.framework MinimumOSVersion + re-sign
        script: |
          set -e
          IPA_PATH=$(find QAudionApp/build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"; exit 1
          fi
          echo "Patching $IPA_PATH"

          WORK=$(mktemp -d)
          cd "$WORK"
          unzip -q "$OLDPWD/$IPA_PATH"

          # Belt-and-braces: print the actual version values that landed
          # in the IPA's Info.plist. If we ever see "1.0.0 / 1" again here
          # despite the plutil writes earlier, something is overwriting
          # Info.plist mid-build (xcodebuild process-plist phase, etc.).
          echo ""
          echo "=== IPA Info.plist version sanity check ==="
          APP_PLIST="Payload/QAudionApp.app/Info.plist"
          if [ -f "$APP_PLIST" ]; then
            BUNDLE_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST" 2>/dev/null || echo "<unset>")
            BUILD_NUMBER=$(plutil -extract CFBundleVersion raw -o - "$APP_PLIST" 2>/dev/null || echo "<unset>")
            echo "CFBundleShortVersionString = $BUNDLE_VERSION"
            echo "CFBundleVersion            = $BUILD_NUMBER"
            if [ "$BUNDLE_VERSION" = "1.0.0" ] && [ "$BUILD_NUMBER" = "1" ]; then
              echo "ERROR: IPA shipped with stale (1.0.0, 1) version pair."
              echo "       Apple will silently substitute the previous build under"
              echo "       the same TestFlight entry. Failing the build to surface."
              exit 1
            fi
          else
            echo "WARN: $APP_PLIST not found in unzipped IPA"
          fi

          FW="Payload/QAudionApp.app/Frameworks/onnxruntime.framework"
          if [ ! -d "$FW" ]; then
            echo "onnxruntime.framework not in IPA — nothing to patch"
            ls -la Payload/QAudionApp.app/Frameworks/ || true
            exit 0
          fi

          echo "--- Info.plist before ---"
          plutil -p "$FW/Info.plist" | grep -E "MinimumOS|CFBundleVersion|CFBundleShortVersionString" || true

          echo "--- Mach-O build version (no modification needed) ---"
          otool -l "$FW/onnxruntime" | grep -A 4 "LC_BUILD_VERSION" | head -6 || true

          # The Mach-O already declares minos=16.0 (iOS 16). The only bug in
          # onnxruntime 1.17.0 is that the framework Info.plist ships with
          # MinimumOSVersion='' (empty). Patch Info.plist to match the binary
          # so both surfaces agree: framework minimum OS = 16.0.
          plutil -replace MinimumOSVersion -string "16.0" "$FW/Info.plist"

          echo "--- Info.plist after ---"
          plutil -p "$FW/Info.plist" | grep -E "MinimumOS" || true

          # Re-sign the framework and the app with the Distribution identity
          # fetched by the earlier 'Set up signing' step.
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
                     | awk -F'"' '/Apple Distribution|iPhone Distribution/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Distribution signing identity found in keychain!"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Using identity: $IDENTITY"

          codesign --force --sign "$IDENTITY" "$FW"

          # Extract app entitlements to a real file (process substitution
          # via /dev/fd/63 doesn't survive codesign's stat check). Use the
          # --xml form so the output is a clean plist without the cms wrapper.
          ENT_FILE="$WORK/app.entitlements.plist"
          codesign -d --entitlements :- --xml "Payload/QAudionApp.app" > "$ENT_FILE" 2>/dev/null || true
          if [ ! -s "$ENT_FILE" ]; then
            # Fallback: dump without --xml
            codesign -d --entitlements :- "Payload/QAudionApp.app" > "$ENT_FILE" 2>/dev/null || true
          fi
          echo "--- Entitlements extracted ($(wc -c < "$ENT_FILE") bytes) ---"
          head -20 "$ENT_FILE" || true

          codesign --force --sign "$IDENTITY" \
                   --entitlements "$ENT_FILE" \
                   "Payload/QAudionApp.app"

          # Repackage IPA in-place
          rm -f "$OLDPWD/$IPA_PATH"
          zip -qr "$OLDPWD/$IPA_PATH" Payload
          echo "Repackaged IPA: $(ls -lh "$OLDPWD/$IPA_PATH")"

          # Verify signature
          codesign --verify --deep --strict --verbose=2 "Payload/QAudionApp.app" 2>&1 | head -10 || true
      - name: Debug onnxruntime.framework MinimumOSVersion
        script: |
          echo "=== Searching for iOS-device onnxruntime framework ==="
          # Prefer the ios-arm64 device slice of the xcframework, fall back to
          # the embedded framework that actually ships in the IPA
          FW=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
                 -path "*/ios-arm64/onnxruntime.framework" -type d 2>/dev/null | head -1)
          if [ -z "$FW" ]; then
            FW=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
                   -path "*/Release-iphoneos/onnxruntime.framework" -type d 2>/dev/null | head -1)
          fi
          echo "Using: $FW"
          echo ""
          echo "=== Info.plist Min/Supported OS keys ==="
          if [ -n "$FW" ] && [ -f "$FW/Info.plist" ]; then
            plutil -p "$FW/Info.plist" | grep -E "MinimumOS|Platform|Supported|DTSDKName|DTPlatformName" || echo "(keys not found)"
          else
            echo "No Info.plist at $FW"
          fi
    artifacts:
      - QAudionApp/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM
      # Captured raw xcodebuild output — surfaces the actual Swift
      # error when xcbeautify swallows it above 'Failed to archive'.
      - QAudionApp/build.log
      # Diagnostic dry-build log without code signing — produces the
      # raw xcodebuild output that xcbeautify hides in the IPA step.
      - QAudionApp/diag.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # submit_to_testflight=false on purpose. With it true Codemagic
        # invokes the App Store Connect API "Submit for beta review"
        # endpoint, which is the gate for EXTERNAL TestFlight testing.
        # Apple rejects that submission unless `Test Information` is
        # filled (Feedback Email + Beta App Review Information: First
        # Name, Last Name, Phone Number, Email — only configurable from
        # the App Store Connect web UI at
        # https://appstoreconnect.apple.com/apps/$APP_APPLE_ID/testflight/test-info).
        # We don't ship to external testers (yet — see CLAUDE.md §7
        # "Export compliance"). With submit_to_testflight=false the IPA
        # upload + Apple processing still happens; Apple then auto-
        # distributes the processed build to INTERNAL groups (incl.
        # "Q-Audion testers") on its own. So our internal pipeline is
        # unaffected, and we no longer red-build on the unrelated
        # external-review gate. Flip back to true ONLY after the
        # external Test Information form is filled out and we add
        # external groups to beta_groups below.
        submit_to_testflight: false
        # Do NOT list "Q-Audion testers" here: it's an INTERNAL group and
        # ASC auto-assigns every processed build to internal groups. The
        # App Store Connect API rejects explicit adds of internal groups
        # ("Cannot add internal group to a build"), which fails the
        # post-processing step even when the build itself is valid.
        # Re-add beta_groups ONLY for EXTERNAL groups.
        #
        # NOTE: `expire_build_submitted_for_review: true` was here, but
        # Codemagic's YAML schema rejects it when `submit_to_testflight`
        # is false ("TestFlight submission is required for
        # expire_build_submitted_for_review"). It's only meaningful in
        # the external-review flow anyway, so it's removed for now.
        # Re-add it together with submit_to_testflight=true the day we
        # turn external testing on.
