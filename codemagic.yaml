workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt

  qaudion-app-build:
    name: Q-Audion App Build (TestFlight)
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QAudion ASC API Key
    environment:
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.qaudion.app"
        XCODE_PROJECT: "QAudionApp.xcodeproj"
        XCODE_SCHEME: "QAudionApp"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
          echo "=== Schemes ==="
          xcodebuild -project QAudionApp.xcodeproj -list 2>&1 | head -20
      - name: Increment build number from TestFlight
        script: |
          cd QAudionApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "New build number: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER
      - name: Set up signing (fetch or create Distribution cert + App Store profile)
        script: |
          set -e
          echo "=== Initialize keychain ==="
          keychain initialize

          echo ""
          echo "=== Fetch or create App Store signing assets for $BUNDLE_ID ==="
          # --create: auto-create Distribution cert + provisioning profile if missing
          # --certificate-key-path: stores the private key locally so Codemagic can reuse it
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS \
            --strict-match-identifier

          echo ""
          echo "=== Add certificates to keychain ==="
          keychain add-certificates

          echo ""
          echo "=== Configure Xcode project to use the fetched profiles ==="
          xcode-project use-profiles --project QAudionApp/$XCODE_PROJECT

          echo ""
          echo "=== Profiles summary ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "no profiles dir"
      - name: Build IPA
        script: |
          cd QAudionApp
          xcode-project build-ipa \
            --project QAudionApp.xcodeproj \
            --scheme QAudionApp
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        expire_build_submitted_for_review: true
