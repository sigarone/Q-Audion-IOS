workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt

  qaudion-app-build:
    name: Q-Audion App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
      ios_signing:
        distribution_type: development
        bundle_identifier: com.qaudion.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
          echo "=== Schemes ==="
          xcodebuild -project QAudionApp.xcodeproj -list 2>&1 | head -20
      - name: Set up signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project QAudionApp/QAudionApp.xcodeproj
      - name: Build Archive and Export IPA
        script: |
          cd QAudionApp

          # Step 1: Archive
          echo "=== ARCHIVING ==="
          xcodebuild archive \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -archivePath "$CM_BUILD_DIR/QAudionApp.xcarchive" \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            2>&1 | grep -E "error:|ARCHIVE SUCCEEDED|ARCHIVE FAILED|ld:|Undefined symbols|referenced from|symbol" | tail -80

          echo ""
          echo "=== ARCHIVE CHECK ==="
          ls -la "$CM_BUILD_DIR/QAudionApp.xcarchive/" 2>/dev/null || echo "Archive NOT created"
          find "$CM_BUILD_DIR/QAudionApp.xcarchive" -name "*.app" -type d 2>/dev/null || echo "No .app in archive"

          # Step 2: Export IPA
          if [ -d "$CM_BUILD_DIR/QAudionApp.xcarchive" ]; then
            echo ""
            echo "=== EXPORTING IPA ==="

            cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>5G22P9239N</string>
          </dict>
          </plist>
          PLIST

            xcodebuild -exportArchive \
              -archivePath "$CM_BUILD_DIR/QAudionApp.xcarchive" \
              -exportPath "$CM_BUILD_DIR/ipa" \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              2>&1 | tail -20

            echo ""
            echo "=== IPA RESULT ==="
            find "$CM_BUILD_DIR/ipa" -name "*.ipa" -exec ls -lh {} \; 2>/dev/null || echo "No IPA found"
          else
            echo "ARCHIVE FAILED — cannot export IPA"
            echo "Build dir contents:"
            ls -la "$CM_BUILD_DIR/" | head -20
          fi
    artifacts:
      - "*.xcarchive"
      - ipa/*.ipa
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/QAudionApp.xcarchive
