workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests (macOS)
        script: |
          cd QAudionEngine
          swift test 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt
