workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt

  qaudion-app-build:
    name: Q-Audion App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
      ios_signing:
        distribution_type: development
        bundle_identifier: com.qaudion.app
      groups:
        - appstore_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.qaudion.app" \
            --type IOS_APP_DEVELOPMENT \
            --create
          keychain add-certificates
          xcode-project use-profiles --project QAudionApp/QAudionApp.xcodeproj
      - name: Build and Archive
        script: |
          cd QAudionApp
          xcodebuild archive \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -archivePath build/QAudionApp.xcarchive \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            2>&1 | tail -40
      - name: Export IPA
        script: |
          cd QAudionApp
          xcode-project build-ipa \
            --archive build/QAudionApp.xcarchive \
            --export-options-plist /dev/stdin <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>5G22P9239N</string>
          </dict>
          </plist>
          EOF

          echo "=== IPA files ==="
          find . -name "*.ipa" -exec ls -lh {} \;
    artifacts:
      - QAudionApp/**/*.ipa
      - QAudionApp/build/QAudionApp.xcarchive
