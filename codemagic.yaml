workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Lint (SwiftLint)
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd QAudionEngine
            swiftlint lint --config ../.swiftlint.yml --reporter xcode 2>&1 | tee lint_results.txt || true
          else
            echo "SwiftLint not installed, skipping lint step" | tee QAudionEngine/lint_results.txt
          fi
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
      - name: Export Code Coverage
        script: |
          cd QAudionEngine
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -print -quit)
          TEST_BIN="${BIN_PATH}/QAudionEnginePackageTests.xctest/Contents/MacOS/QAudionEnginePackageTests"
          if [ ! -f "$TEST_BIN" ]; then
            TEST_BIN=$(find "${BIN_PATH}" -type f -perm +111 -name '*PackageTests*' -print -quit 2>/dev/null || true)
          fi
          if [ -n "$PROFDATA" ] && [ -n "$TEST_BIN" ] && [ -f "$TEST_BIN" ]; then
            xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" "$TEST_BIN" > coverage.lcov
          else
            echo "Skipping coverage export"
          fi
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt
      - QAudionEngine/lint_results.txt
      - QAudionEngine/coverage.lcov

  qaudion-app-build:
    name: Q-Audion App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
          echo "Project generated successfully"
          ls -la QAudionApp.xcodeproj/
      - name: Build App
        script: |
          cd QAudionApp
          # Find an iOS Simulator
          SIM_ID=$(xcrun simctl list devices available -j | \
            python3 -c "import json,sys; devs=json.load(sys.stdin)['devices']; \
            ids=[d['udid'] for k,v in devs.items() if 'iOS' in k for d in v if 'iPhone' in d['name'] and d['isAvailable']]; \
            print(ids[0] if ids else '')")
          echo "Building for simulator: $SIM_ID"

          xcodebuild build \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -30

          echo ""
          echo "=== Build products ==="
          find build -name "*.app" -type d 2>/dev/null
      - name: Package IPA
        script: |
          cd QAudionApp
          APP_PATH=$(find build -name "QAudionApp.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "App bundle size: $(du -sh "$APP_PATH" | cut -f1)"
            echo "App contents:"
            ls -la "$APP_PATH/"

            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            cd Payload && zip -r ../QAudionApp-v1.0.1-unsigned.ipa . && cd ..
            rm -rf Payload

            echo ""
            echo "=== IPA created ==="
            ls -lh QAudionApp-v1.0.1-unsigned.ipa
          else
            echo "ERROR: .app bundle not found!"
            echo "Looking in build directory:"
            find build -type d -name "*.app" 2>/dev/null || echo "No .app found"
            find build -type d -maxdepth 5 2>/dev/null | head -20
          fi
    artifacts:
      - QAudionApp/QAudionApp-*.ipa
