workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Build QAudionEngine (iOS Simulator)
        script: |
          cd QAudionEngine
          xcodebuild build \
            -scheme QAudionEngine \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Run Engine Tests
        script: |
          cd QAudionEngine
          xcodebuild test \
            -scheme QAudionEngine \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - QAudionEngine/.build/**/*.o

  qaudion-engine-test:
    name: Q-Audion Engine Tests
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Build & Test (iOS Simulator)
        script: |
          cd QAudionEngine
          xcodebuild test \
            -scheme QAudionEngine \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/test_results.txt
