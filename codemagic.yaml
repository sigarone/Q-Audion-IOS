workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Lint (SwiftLint)
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd QAudionEngine
            swiftlint lint --config ../.swiftlint.yml --reporter xcode 2>&1 | tee lint_results.txt || true
          else
            echo "SwiftLint not installed, skipping lint step" | tee QAudionEngine/lint_results.txt
          fi
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
      - name: Export Code Coverage
        script: |
          cd QAudionEngine
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -print -quit)
          TEST_BIN="${BIN_PATH}/QAudionEnginePackageTests.xctest/Contents/MacOS/QAudionEnginePackageTests"
          if [ ! -f "$TEST_BIN" ]; then
            TEST_BIN=$(find "${BIN_PATH}" -type f -perm +111 -name '*PackageTests*' -print -quit 2>/dev/null || true)
          fi
          if [ -n "$PROFDATA" ] && [ -n "$TEST_BIN" ] && [ -f "$TEST_BIN" ]; then
            xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" "$TEST_BIN" > coverage.lcov
          else
            echo "Skipping coverage export"
          fi
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt
      - QAudionEngine/lint_results.txt
      - QAudionEngine/coverage.lcov

  qaudion-app-build:
    name: Q-Audion App Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
          echo "Project generated successfully"
          ls -la QAudionApp.xcodeproj/
      - name: Build and Archive
        script: |
          cd QAudionApp

          # Build for iOS device (arm64) using archive
          xcodebuild archive \
            -project QAudionApp.xcodeproj \
            -scheme QAudionApp \
            -archivePath build/QAudionApp.xcarchive \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -40

          echo ""
          echo "=== Archive contents ==="
          find build/QAudionApp.xcarchive -name "*.app" -type d 2>/dev/null
          APP_IN_ARCHIVE=$(find build/QAudionApp.xcarchive -name "QAudionApp.app" -type d | head -1)
          if [ -n "$APP_IN_ARCHIVE" ]; then
            echo "App found: $APP_IN_ARCHIVE"
            echo "Size: $(du -sh "$APP_IN_ARCHIVE" | cut -f1)"
            ls -la "$APP_IN_ARCHIVE/"
          fi
      - name: Package IPA
        script: |
          cd QAudionApp
          APP_PATH=$(find build/QAudionApp.xcarchive -name "QAudionApp.app" -type d | head -1)

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            # Check the binary exists
            if [ -f "$APP_PATH/QAudionApp" ]; then
              echo "Binary found: $(file "$APP_PATH/QAudionApp")"
              echo "Binary size: $(du -h "$APP_PATH/QAudionApp" | cut -f1)"
            fi

            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r QAudionApp-v1.0.2-unsigned.ipa Payload/
            rm -rf Payload

            echo ""
            echo "=== IPA created ==="
            ls -lh QAudionApp-v1.0.2-unsigned.ipa
          else
            echo "ERROR: .app not found in archive"
            find build -type f -name "QAudionApp" 2>/dev/null | head -5
            find build -type d 2>/dev/null | head -30
          fi
    artifacts:
      - QAudionApp/QAudionApp-*.ipa
