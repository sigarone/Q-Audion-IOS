workflows:
  qaudion-ios-build:
    name: Q-Audion iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
        - pattern: 'develop'
    scripts:
      - name: Resolve dependencies
        script: |
          cd QAudionEngine
          swift package resolve
      - name: Build (macOS)
        script: |
          cd QAudionEngine
          swift build 2>&1 | tee build_results.txt
      - name: Run Tests with Coverage (macOS)
        script: |
          cd QAudionEngine
          swift test --enable-code-coverage 2>&1 | tee test_results.txt
    artifacts:
      - QAudionEngine/build_results.txt
      - QAudionEngine/test_results.txt

  qaudion-app-build:
    name: Q-Audion App Build (TestFlight)
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QAudion ASC API Key
    environment:
      xcode: 16.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qaudion.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd QAudionApp
          xcodegen generate
          echo "=== Schemes ==="
          xcodebuild -project QAudionApp.xcodeproj -list 2>&1 | head -20
      - name: Increment build number from TestFlight
        script: |
          cd QAudionApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "New build number: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.qaudion.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project QAudionApp/QAudionApp.xcodeproj
      - name: Build IPA
        script: |
          cd QAudionApp
          xcode-project build-ipa \
            --project QAudionApp.xcodeproj \
            --scheme QAudionApp
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        expire_build_submitted_for_review: true
