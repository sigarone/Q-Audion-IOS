appId: com.qaudion.app
---
# Screen-coverage flow #2: authenticate via the reusable register flow,
# then visit every HomeView tab and screenshot it. First real coverage
# beyond the onboarding welcome screen (smoke-launch.yaml).
- runFlow: auth-extension-register.yaml
# The first time the shell is shown, the one-time Bluetooth mesh consent screen
# covers it; "Non ora" leaves the mesh off. `optional: true` since it is asked
# only once per install.
- tapOn:
    text: "Non ora"
    optional: true
- takeScreenshot: home-chat-tab
- tapOn: "Contatti"
- takeScreenshot: home-contacts-tab
- tapOn: "Chiamate"
- takeScreenshot: home-calls-tab
- tapOn: "Impostazioni"
- takeScreenshot: home-settings-tab
